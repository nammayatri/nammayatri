# Devbox releases: run Backend/dev/devbox_core on the office runner against a
# fleet dev-box. System Control Centre ("Devbox Releases") dispatches this.
#
# P2.1: ping only — proves the runner can SSH into the dev-box with the
# DEVBOX_SSH_KEY secret (its public half is on the dev-box, restricted to the
# runner's IP). spawn / stop come next.
name: devbox

on:
  workflow_dispatch:
    inputs:
      devbox_host:
        description: "Dev-box address"
        default: "192.168.10.107"
      devbox_user:
        description: "Dev-box SSH user"
        default: "soya-chaap"
  # Test hook until this file is on main (only main's workflows can be
  # dispatched): runs when this file changes on the feature branch.
  push:
    branches: [backend/feat/devbox-feature-test]
    paths: [.github/workflows/devbox.yaml]

jobs:
  devbox:
    runs-on: x86_64_main_push
    timeout-minutes: 10
    env:
      DEVBOX_HOST: ${{ inputs.devbox_host || '192.168.10.107' }}
      DEVBOX_USER: ${{ inputs.devbox_user || 'soya-chaap' }}
    steps:
      - name: Checkout devbox_core
        uses: actions/checkout@v4
        with:
          sparse-checkout: Backend/dev/devbox_core

      - name: Runner
        run: |
          echo "runner machine: $(hostname)"
          echo "runner addresses: $(hostname -I 2>/dev/null || true)"
          python3 --version

      - name: Dev-box key
        env:
          DEVBOX_SSH_KEY: ${{ secrets.DEVBOX_SSH_KEY }}
        run: |
          key="$RUNNER_TEMP/devbox_key"
          (umask 077; printf '%s\n' "$DEVBOX_SSH_KEY" > "$key")
          echo "DEVBOX_SSH_KEY_FILE=$key" >> "$GITHUB_ENV"

      - name: Ping
        working-directory: Backend/dev
        run: python3 -m devbox_core ping --host "$DEVBOX_HOST" --user "$DEVBOX_USER"

      - name: Runner as seen by the dev-box
        run: |
          ssh -i "$DEVBOX_SSH_KEY_FILE" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 \
              "$DEVBOX_USER@$DEVBOX_HOST" \
              'echo "runner address as seen by $(hostname): ${SSH_CONNECTION%% *}"'

      - name: Remove dev-box key
        if: always()
        run: rm -f "$RUNNER_TEMP/devbox_key"
