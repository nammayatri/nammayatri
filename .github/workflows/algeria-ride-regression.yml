# A whole backend, brought up from nothing, and asked for a ride.
#
# ── Why this exists ─────────────────────────────────────────────────────────
# The app's own tests prove the app. They cannot prove the SERVER: a change to
# a seed, a migration, a merchant row, a geofence or a patched binary can break
# a released app while every app test stays green. This is the other half.
#
# It starts Postgres, Redis, Kafka, passetto, both Haskell apps, the BECKN
# gateway and the registry from the image CI publishes, seeds them exactly as a
# laptop would, and then asks the two questions that matter:
#
#   1. Can an Algerian number sign in?  (the +222/+213 patches, passetto, the
#      migrations, the merchant row)
#   2. Does a ride search come back with a PRICE?  (rider -> gateway ->
#      registry -> driver-app -> dispatch -> tariff -> back over BECKN)
#
# Every link in that second chain has broken at least once, and all but the
# first are invisible from the passenger side: you get a route and no price,
# whichever one it is.
#
# ── Routing: real, on a small map ───────────────────────────────────────────
# A price needs a route, and a route needs OSRM. From 2026-09-20 to 2026-10-06
# this job ran WITHOUT it (SKIP_OSRM=1), on the theory that mock-google would
# stand in. It cannot: the mock in the image we run (upstream 03a7531) has no
# /directions/json at all, answers 404, and the rider turned that into
# E500 GOOGLE_MAPS_API_ERROR -- so every run, from the first, failed with
# "ride search returned no searchId" before any price was computed. 19 runs,
# 19 red, and none of them about the change that triggered it.
#
# So the job now routes exactly like the server (rider -> maps-shim -> OSRM),
# on Algiers only: the country extract is downloaded once a week, cut down to
# the city with osmium, and cached. Preprocessing the city takes seconds.
#
# ── What it does NOT do ─────────────────────────────────────────────────────
# No tiles, no secrets, no VPS, nothing published. One merchant (the upstream
# seed, given Algeria's coverage and tariff), not the server's two. A green run
# means the stack still prices a ride when built from this repository; it says
# nothing about what is deployed -- that is ops/deploy.sh status and
# ops/checks/probe-two-country-rides.py.
name: "algeria: ride regression"

on:
  # Every push to our branches. It used to be a list of paths, and four days
  # of commits went by with the job never running; a ride can break from
  # anywhere in this tree, and a red tick that comes the same day is the point.
  push:
    branches: ['algeria/**']
  # Weekly, for a change to the published image or an upstream fetch that rots.
  # GitHub runs a schedule only from the DEFAULT branch. Since 2026-10-08 that
  # is `algeria/osrm-routing` on both repositories (it was upstream's `main`,
  # which does not have this file, so until then this line did nothing).
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: algeria-ride-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ride:
    name: sign in, then a priced ride in each country
    runs-on: ubuntu-latest
    # The stack itself comes up in a few minutes; the cap is for a pull that
    # crawls or a search that never answers, so the logs still get uploaded.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Backend/dev/local-stack
            .github
          sparse-checkout-cone-mode: false

      # THE image the server runs: the one stack/deploy-backend.sh pulls, from
      # the company org, whichever repository this job runs in. Public, so no
      # login. Until 2026-10-08 this pulled ghcr.io/<repo owner>/..., which on
      # MohaGNPro is a 2026-08-26 build (41cbe406) -- six weeks older than the
      # server's (108eca6c), and blind to +222: found the day CI first tried a
      # Mauritanian sign-in. The digest is printed so a run says what it tested.
      - name: Pull the backend image
        run: |
          set -euo pipefail
          img=ghcr.io/nammayatri-algeria/ny-backend:latest
          docker pull "$img"
          docker image inspect "$img" --format 'tested image: {{index .RepoDigests 0}}'
          # The compose file names this tag on all five services. Tagging is the
          # whole "deploy" here, exactly as deploy-backend.sh does on the VPS.
          docker tag "$img" ny-rider:patched
          docker run --rm --entrypoint ls ny-rider:patched -1 /opt/app | head -20

      # The ISO week: the map is fetched again at most once a week.
      - name: Which week
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: The two cities' map, from the cache
        id: map
        uses: actions/cache@v4
        with:
          path: ~/osm/two-cities.osm.pbf
          key: osm-two-cities-v1-${{ steps.week.outputs.week }}

      # Algiers and Nouakchott, with room to spare round both test rides (and
      # each country's drivers), cut out of the two country extracts and merged
      # -- the server routes on the two countries merged the same way.
      - name: Cut Algiers and Nouakchott out of the countries (cache miss only)
        if: steps.map.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/osm && cd ~/osm
          sudo apt-get install -y -qq osmium-tool >/dev/null
          for c in algeria mauritania; do
            curl -fsSL --retry 5 --retry-delay 10 -o "$c.osm.pbf" \
              "https://download.geofabrik.de/africa/$c-latest.osm.pbf"
          done
          osmium extract --bbox 2.85,36.60,3.35,36.85 --overwrite -o algiers.osm.pbf algeria.osm.pbf
          osmium extract --bbox -16.10,17.95,-15.85,18.25 --overwrite -o nouakchott.osm.pbf mauritania.osm.pbf
          osmium merge --overwrite -o two-cities.osm.pbf algiers.osm.pbf nouakchott.osm.pbf
          rm -f algeria.osm.pbf mauritania.osm.pbf algiers.osm.pbf nouakchott.osm.pbf
          ls -lh two-cities.osm.pbf

      # osrm-prepare.sh skips the download when the extract is already in the
      # volume, and the name is the one compose and setup.sh expect.
      - name: Build the routing graph
        working-directory: Backend/dev/local-stack/stack
        run: |
          set -euo pipefail
          docker volume create ny-osrm-data >/dev/null
          docker run --rm -v ny-osrm-data:/data -v ~/osm:/src:ro alpine:latest \
            cp /src/two-cities.osm.pbf /data/algeria-latest.osm.pbf
          bash osrm-prepare.sh

      - name: Bring the stack up, and ask for a price
        working-directory: Backend/dev/local-stack/stack
        env:
          # Published on the runner's loopback only; nothing here is reachable
          # from outside the job in any case.
          BIND_ADDR: '127.0.0.1'
        run: bash setup.sh

      # Driver positions go stale silently, and a stale pool answers a search
      # with a route and no price -- the exact symptom this job exists to
      # catch, so it must not be the job's own fault.
      - name: Freshen the driver positions and ask again
        working-directory: Backend/dev/local-stack/stack
        run: |
          set -euo pipefail
          bash setup.sh drivers
          bash setup.sh price

      # The server's layout since 2026-09-13, from the same SQL files: two
      # driver merchants, two tariffs, two service areas. Then a priced ride in
      # each country, and each must be priced by its own merchant.
      - name: The live two-country layout, and a priced ride in each country
        working-directory: Backend/dev/local-stack/stack
        run: |
          set -euo pipefail
          bash setup.sh two-countries
          bash setup.sh price-both

      - name: What was running, and what it said
        if: ${{ always() }}
        working-directory: Backend/dev/local-stack/stack
        run: |
          docker compose ps
          mkdir -p /tmp/logs
          for c in ny-rider ny-driver ny-beckn-gateway ny-mock-registry ny-mock-google ny-maps-shim ny-osrm ny-postgres; do
            docker logs --tail 400 "$c" > "/tmp/logs/$c.log" 2>&1 || true
          done
          tail -n 25 /tmp/logs/ny-driver.log || true

      - name: Upload the logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: stack-logs-${{ github.run_id }}
          path: /tmp/logs
          if-no-files-found: warn
          retention-days: 14
