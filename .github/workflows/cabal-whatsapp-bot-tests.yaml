name: Cabal WhatsApp Bot Tests

on:
  pull_request:
    paths:
      - 'Backend/lib/whatsapp-bot/**'
      - 'Backend/cabal.project'

concurrency:
  group: cabal-whatsapp-bot-tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  whatsapp-bot-tests:
    name: WhatsApp Bot Golden Suite
    runs-on: x86_64_main_pull
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run the whatsapp-bot golden suite
        run: |
          nix develop .#backend --command bash -c "
            export CABAL_DIR=\$GITHUB_WORKSPACE/Backend/.cabal-dir
            mkdir -p \$CABAL_DIR
            printf 'active-repositories: :none\n' > \$CABAL_DIR/config
            export CABAL_CONFIG=\$CABAL_DIR/config
            cd Backend
            mkdir -p \$CABAL_DIR/store/ghc-\$(ghc --numeric-version)
            ghc-pkg init \$CABAL_DIR/store/ghc-\$(ghc --numeric-version)/package.db 2>/dev/null || true
            cabal test whatsapp-bot --test-show-details=direct
          "
