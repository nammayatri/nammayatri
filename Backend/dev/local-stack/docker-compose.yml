# Self-hosted Namma Yatri rider backend (2023 baseline).
#
# Networking note: the dhall configs hardcode `localhost` for Postgres, Redis,
# Kafka and passetto (only the *ports* are env-overridable). Rather than patch
# the upstream configs, the services that rider-app talks to publish their ports
# on the Docker host, and rider-app itself runs with network_mode: host so that
# `localhost` resolves to the same place. `proxy` then re-exposes the API on
# 8014 so it is reachable from Windows (host-network ports are not forwarded
# out of the Docker Desktop VM).
#
# Run via ./setup.sh — it fetches the pinned upstream tree that ./2023 refers to.
#
# RESERVED PORTS — do not use these for anything we add. The merchant row and
# the upstream dhall configs point at them, so squatting on one makes the
# backend talk to the wrong service and fail in a thoroughly confusing way:
#
#   8013  rider-app (BAP)          8016  driver-app (BPP)
#   8015  beckn-gateway            8020  mock-registry
#   8019  mock-google              5000  osrm
#
# 8015 and 8020 now have services behind them. They did not until we built
# beckn-gateway and mock-registry ourselves -- neither is in the published image,
# which ships beckn-cli-exe only. Until then atlas_app.merchant.gateway_url
# pointed at a port with nothing listening, so every BECKN /search the rider app
# sent went nowhere: a search came back with a route and no price, and the
# driver side never saw the request.
#
# Keeping them reserved was still right. An earlier version of this file put the
# map on 8015 and the shim on 8020, and ride search failed because rider-app
# dutifully sent its /search to the map's nginx.
#
# Ours live above the reserved range: 8025 map, 8030 maps-shim, and the
# Windows-facing proxies on 8014 / 8017 / 5001.

# WHICH BACKEND IMAGE THIS USES
#
# By default it builds one locally from ./bin (see Dockerfile.rider), which is
# what you want while iterating. To run the image CI published instead -- no
# binaries to download, no build:
#
#   export NY_IMAGE=ghcr.io/nammayatri-algeria/ny-backend:latest
#   docker compose pull rider-app
#   docker compose up -d --no-build
#
# `--no-build` matters: rider-app still declares a build section, and compose
# would otherwise rebuild it locally and overwrite the tag you just pulled.

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: ny-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: atlas_dev
    ports:
      - "5434:5432"
      # Both apps are configured with a read replica on 5435 (esqDBReplicaCfg)
      # and use it for `runInReplica` queries -- GET /v2/rideSearch/{id}/results
      # among them, which otherwise dies with
      #   libpq: failed (could not connect to server ... port 5435)
      # There is no actual replica here, so 5435 is pointed at the same
      # database. Reads simply go to the primary.
      - "5435:5432"
    volumes:
      - ny-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d atlas_dev"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Same policy as the app containers. Without it a host reboot brings the
    # apps back with no database underneath them, which looks like a broken
    # stack rather than a stopped one.
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ny-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.0
    container_name: ny-kafka
    network_mode: host
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    restart: unless-stopped

  # Encryption sidecar. rider-app calls this to encrypt/decrypt PII (phone
  # numbers); without it every auth request fails with a 500.
  passetto-db:
    image: postgres:12.3
    container_name: ny-passetto-db
    environment:
      POSTGRES_DB: passetto
      POSTGRES_USER: passetto
      POSTGRES_PASSWORD: passetto
    volumes:
      # Pre-generated keys that match the encrypted values in the seed data.
      - ./2023/Backend/dev/sql-seed/passetto-seed.sql:/docker-entrypoint-initdb.d/create_schema.sql:ro
    # Note: this one has no named volume, so its keys live in the container
    # layer. They survive stop/start and reboot, but NOT `docker compose down`
    # -- after a `down` the initdb script re-seeds them, which is fine.
    restart: unless-stopped

  passetto:
    image: juspayin/passetto-hs:0b18530
    container_name: ny-passetto
    command: demo
    depends_on:
      - passetto-db
    environment:
      PASSETTO_PG_BACKEND_CONN_STRING: postgresql://passetto:passetto@ny-passetto-db:5432/passetto
    ports:
      - "8021:8012"
    restart: unless-stopped

  rider-app:
    build:
      context: .
      dockerfile: Dockerfile.rider
    image: ny-rider:patched
    container_name: ny-rider
    network_mode: host
    working_dir: /opt/app
    entrypoint: ["/opt/app/rider-app-exe"]
    # Wait for a database that actually accepts connections. Without this the
    # app can start first on a host reboot, fail its migrations, and sit there
    # returning SqlError on every request instead of retrying.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_PRIMARY_PORT: "5434"
      REDIS_PORT: "6379"
      KAFKA_BROKER_PORT: "29092"
    volumes:
      - ./2023/Backend/dhall-configs:/opt/app/dhall-configs:ro
      # rider-app runs these migrations itself on every startup.
      - ./2023/Backend/dev:/opt/app/dev:ro
    restart: unless-stopped

  # The driver side (BPP). Same image — it already contains every executable in
  # the repo, so no second build — just a different entrypoint, a different
  # schema (atlas_driver_offer_bpp) and its own migrations.
  driver-app:
    image: ny-rider:patched
    container_name: ny-driver
    network_mode: host
    working_dir: /opt/app
    entrypoint: ["/opt/app/dynamic-offer-driver-app-exe"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./2023/Backend/dhall-configs:/opt/app/dhall-configs:ro
      # It applies dev/migrations/dynamic-offer-driver-app itself on startup.
      - ./2023/Backend/dev:/opt/app/dev:ro
    restart: unless-stopped

  # The connector between the two sides. rider-app (BAP) does not call
  # driver-app (BPP) directly: it POSTs /search to the gateway, which looks up
  # every BPP for the domain in the registry and multicasts to them. Without it
  # the two halves of this stack never speak.
  #
  # Config: dhall-configs/dev/beckn-gateway.dhall -- port 8015, Redis on 6379,
  # registryUrl http://localhost:8020/, selfId JUSPAY.BG.1. No database.
  beckn-gateway:
    image: ny-rider:patched
    container_name: ny-beckn-gateway
    network_mode: host
    working_dir: /opt/app
    entrypoint: ["/opt/app/beckn-gateway-exe"]
    depends_on:
      - redis
    volumes:
      - ./2023/Backend/dhall-configs:/opt/app/dhall-configs:ro
    restart: unless-stopped

  # The registry all three resolve subscribers through, and the reason
  # signature auth works: it holds each party's public key.
  #
  # It needs its own schema and role (atlas_registry / atlas_registry_user),
  # created by setup.sh from dev/sql-seed/mock-registry-seed.sql. The subscriber
  # rows come from dev/local-testing-data/mock-registry.sql and already match
  # this deployment exactly -- nothing had to be written by hand:
  #
  #   JUSPAY.BG.1                     BG   -> http://localhost:8015/v1
  #   JUSPAY.MOBILITY.APP.UAT.1       BAP  -> http://localhost:8013/cab/v1
  #   JUSPAY.MOBILITY.PROVIDER.UAT.3  BPP  -> http://localhost:8016/beckn/favorit0-...
  #
  # That last one is atlas_driver_offer_bpp.merchant.subscriber_id for
  # NAMMA_YATRI_PARTNER, whose id is favorit0-0000-0000-0000-00000favorit.
  # All three sign with the same dev key, so the one public key the fixture
  # carries is correct for all of them.
  mock-registry:
    image: ny-rider:patched
    container_name: ny-mock-registry
    network_mode: host
    working_dir: /opt/app
    entrypoint: ["/opt/app/mock-registry-exe"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./2023/Backend/dhall-configs:/opt/app/dhall-configs:ro
      # autoMigrate = True, migrationPath dev/migrations/mock-registry.
      - ./2023/Backend/dev:/opt/app/dev:ro
    restart: unless-stopped

  # Maps. The seeded merchant config already points Maps_Google at
  # http://localhost:8019/ -- i.e. at this mock, not at Google -- so without it
  # running, every ride search fails with GOOGLE_MAPS_API_ERROR before it ever
  # reaches BECKN. It serves distances, routes, place names and autocomplete
  # from fixture data, so no API key and no billing account are involved.
  #
  # Distances are fixtures, not real Algerian routing. Switching to real
  # routing means pointing Maps_OSRM at an OSRM server with an Algeria extract
  # -- already supported in merchant_service_config, no code change.
  mock-google:
    image: ny-rider:patched
    container_name: ny-mock-google
    network_mode: host
    working_dir: /opt/app
    entrypoint: ["/opt/app/mock-google-exe"]
    volumes:
      - ./2023/Backend/dhall-configs:/opt/app/dhall-configs:ro
      # mockDataPath in mock-google.dhall is "./app/mocks/google/mock-data/",
      # resolved relative to working_dir.
      - ./2023/Backend/app/mocks/google/mock-data:/opt/app/app/mocks/google/mock-data:ro
    restart: unless-stopped

  # Real routing for Algeria. merchant_service_config already carries
  #   Maps_OSRM -> {"osrmUrl": "localhost:5000", "radiusDeviation": 20}
  # so this is a configuration change, not a code change. Host networking so
  # that `localhost:5000` means the same thing here as it does to rider-app.
  #
  # The graph is built by ./osrm-prepare.sh into the ny-osrm-data volume; this
  # only serves it. mld matches how the graph was prepared -- osrm-routed
  # refuses to start if the algorithm and the graph disagree.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: ny-osrm
    network_mode: host
    command: osrm-routed --algorithm mld --port 5000 /data/algeria-latest.osrm
    volumes:
      - ny-osrm-data:/data:ro
    restart: unless-stopped

  # OSRM on host networking is invisible from Windows; this exposes it on 5001
  # so routes can be inspected directly. Not needed by the backend.
  osrm-proxy:
    image: alpine/socat
    container_name: ny-osrm-proxy
    command: tcp-listen:5000,fork,reuseaddr tcp-connect:172.17.0.1:5000
    ports:
      - "5001:5000"
    restart: unless-stopped

  # Google Directions -> OSRM translator. See maps-shim/server.js for why this
  # is necessary: this baseline cannot get routes from OSRM, and mock-google
  # has no /directions/json. The backend keeps talking "Google"; the answers
  # come from the Algerian road graph. Non-route requests are forwarded to
  # mock-google, so one googleMapsUrl still covers everything.
  maps-shim:
    image: node:20-alpine
    container_name: ny-maps-shim
    network_mode: host
    working_dir: /app
    command: node server.js
    environment:
      PORT: "8030"
      OSRM_URL: "http://localhost:5000"
      MOCK_GOOGLE_URL: "http://localhost:8019"
    volumes:
      - ./maps-shim:/app:ro
    restart: unless-stopped

  # rider-app uses host networking, so its port lives inside the Docker VM and
  # isn't published to Windows. This forwards it to localhost:8014.
  proxy:
    image: alpine/socat
    container_name: ny-proxy
    command: tcp-listen:8013,fork,reuseaddr tcp-connect:172.17.0.1:8013
    ports:
      - "8014:8013"
    restart: unless-stopped

  # Same trick for the driver app: 8016 inside the VM -> 8017 on Windows.
  driver-proxy:
    image: alpine/socat
    container_name: ny-driver-proxy
    command: tcp-listen:8016,fork,reuseaddr tcp-connect:172.17.0.1:8016
    ports:
      - "8017:8016"
    restart: unless-stopped

  # Visual demo: a map of the service areas that queries the live API.
  # It also exists to solve a CORS problem -- rider-app sends no CORS headers,
  # so the page has to be served from the same origin as the API it calls.
  # areas.geojson is exported from the database by setup.sh.
  map:
    image: nginx:alpine
    container_name: ny-map
    ports:
      - "8025:80"
    volumes:
      - ./demo-map/site:/usr/share/nginx/html:ro
      - ./demo-map/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # Browser view of the database, for demos and screenshots. Nothing depends on
  # it and nothing breaks if it is stopped.
  #
  # Log in with: system PostgreSQL · server ny-postgres · user postgres ·
  # password root · database atlas_dev. It reaches Postgres over the compose
  # network, so it uses the container name and port 5432, not the published 5434.
  adminer:
    image: adminer:4
    container_name: ny-adminer
    ports:
      - "8026:8080"
    environment:
      ADMINER_DEFAULT_SERVER: ny-postgres
      ADMINER_DESIGN: dracula
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ny-pgdata:
  # Built by ./osrm-prepare.sh rather than by compose, because preprocessing is
  # a one-off that takes far longer than a container start and should not be
  # repeated on every `up`.
  ny-osrm-data:
    external: true
