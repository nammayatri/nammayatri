server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store";
    }

    # rider-app sends no CORS headers and 404s on OPTIONS, so a page loaded
    # from anywhere else cannot call it. Serving the page and proxying the API
    # through the same origin sidesteps CORS entirely rather than patching the
    # upstream application.
    #
    # 172.17.0.1 is the Docker host as seen from inside a container; rider-app
    # runs with network_mode: host and listens there on 8013.
    location ~ ^/(v2|openapi|swagger)(/|$) {
        proxy_pass http://172.17.0.1:8013;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
}
