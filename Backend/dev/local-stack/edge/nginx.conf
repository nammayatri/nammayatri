# ── compression, 14 Sep 2026 ───────────────────────────────────────────────
# Nothing was compressed before this block existed. In `http` by way of
# conf.d, so all four server blocks get it from one place.
gzip on;
# Tells a cache that the answer differs by Accept-Encoding. Without it a shared
# proxy can hand a gzipped body to a client that did not ask for one.
gzip_vary on;
# 5, not 9: measured on the console bundle, 9 saves 1.5 % for about a quarter
# more CPU, and nothing here is pre-compressed so every request pays it.
gzip_comp_level 5;
# Below about a kilobyte the gzip header and the CPU cost more than the saving,
# and a very small response can come out larger than it went in.
gzip_min_length 1024;
# The console and the API are both behind this proxy, so compress proxied
# answers too — /admin/ JSON is some of the most compressible traffic here.
gzip_proxied any;
# text/html is ALWAYS compressed when gzip is on and must not be listed: nginx
# treats a duplicate as a configuration warning.
gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/manifest+json
    image/svg+xml;

# The only thing on this machine the internet can talk to, besides SSH.
#
# ── Why this exists ─────────────────────────────────────────────────────────
# Everything has been reached through an SSH tunnel so far, which is safe and
# useless for handing an APK to someone else. This publishes two APIs over TLS —
# the rider one on /v2/, the driver one on /ui/ — and nothing else.
#
# ── What it deliberately does not expose ────────────────────────────────────
# Postgres, Redis, the demo pages, mock-google, OSRM and Swagger all stay on
# loopback. Swagger in particular is a complete, executable description of the
# API and there is no reason to publish it.
#
# The sharpest omission is /dashboard/. The driver binary serves 96 routes: 47
# under /ui/, which is the driver's own app, and 41 under /dashboard/, which is
# the office — the API that enables a driver, attaches his vehicle and reads his
# documents. Publishing /ui/ must not carry /dashboard/ with it. The catch-all
# 404 at the bottom is what stops it, and the guard refuses any prefix it does
# not route as well, so it takes two mistakes rather than one.
#
# ── Ordering ────────────────────────────────────────────────────────────────
# Every /v2/ and every /ui/ request goes to the auth guard, which forwards to
# rider-app and driver-app respectively. That is not a detail: the guard is what
# makes publishing this safe at all — the backend accepts unlimited OTP guesses,
# and on /ui/ the guard additionally holds the per-driver code that retires the
# fixed 7891. A `location` that reached either backend directly would quietly
# undo both. There is no such location.

# nginx runs with network_mode: host so that these limits are enforced by ufw
# like anything else — a bridged container with published ports would bypass it,
# which is the trap that makes `ufw default deny` insufficient on this box.

# Rate limits, keyed on the caller's address. The guard already limits per phone
# number and per auth session; this is the layer that survives a guard restart
# and catches someone rotating numbers.
limit_req_zone  $binary_remote_addr  zone=auth:10m   rate=20r/m;
limit_req_zone  $binary_remote_addr  zone=api:10m    rate=240r/m;
# Starting a sign-in is the only request on this box that spends money -- every
# one sends a Moorsyl text -- so it gets a zone of its own rather than sharing
# `auth` with uploads and admin logins.
#
# Six a minute, because a person types ONE phone number: the burst of three
# covers a fat-fingered retry and nothing else. It deliberately does NOT cover
# /auth/{id}/verify -- typing a wrong code is normal, costs nothing, and stays
# on `auth` below, or a rider on his third guess would be refused by the edge
# before the guard could tell him the code was wrong.
#
# Lowering `auth` itself was the other option and would have been a mistake:
# the same zone carries /driver/documents, and a driver sending five photographs
# would have been rate-limited mid-enrolment.
limit_req_zone  $binary_remote_addr  zone=signin:10m rate=6r/m;
# Tiles are fetched in bursts -- one screenful at z14 is thirty-odd requests,
# and panning fires hundreds in a minute. A limit tight enough to feel like
# security here just makes the map stutter for real riders, so this is set to
# bound abuse rather than to be clever: generous per second, still finite.
limit_req_zone  $binary_remote_addr  zone=tiles:10m  rate=1200r/m;
limit_conn_zone $binary_remote_addr  zone=conns:10m;

# Logged so a real attempt is visible afterwards. `warn` keeps the rejections.
limit_req_log_level warn;
limit_conn_log_level warn;

# nginx answers a rate-limited request with 503 by default, which is a lie: it
# says "this service is broken" when the truth is "you are going too fast". An
# app reading 503 tells the rider the server is down and offers to retry, which
# is exactly the wrong advice. 429 is the honest code, and it is the one the
# guard already uses, so a caller sees one consistent answer from both layers.
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Certbot renews over HTTP-01, so this one path has to answer on 80
    # forever. It is the only thing that does.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.169-58-139-65.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/api.169-58-139-65.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.169-58-139-65.sslip.io/privkey.pem;

    # TLS 1.2 as the floor: 1.3 alone would be cleaner, but Android 8 and 9 are
    # still common here and negotiate 1.2. Nothing older is allowed.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # A year, and includeSubDomains, since 2026-08-26.
    #
    # It was a day, with this reasoning: "the hostname is a temporary sslip.io
    # one; committing every browser to HTTPS-only on it for a year would be a
    # nuisance to undo". That was right and stopped being true the day
    # api.movinapp.net went live. A day is barely a policy -- it protects a
    # returning visitor and nobody else.
    #
    # What it actually buys: the *first* request a phone makes after an update
    # or a reinstall is the one that can be intercepted, because nothing has
    # told it to prefer HTTPS yet. A year means one such request per phone per
    # year rather than one per day.
    #
    # `includeSubDomains` reaches only subdomains of THIS host -- api.movinapp.net
    # and anything under it. The root, where the company site will eventually
    # live, is untouched, so this cannot strand a future plain-HTTP website.
    #
    # No `preload`. That is a submission to a list baked into browsers and is
    # genuinely hard to undo; it is not worth it while the domain is days old.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    server_tokens off;
    client_max_body_size 1m;
    limit_conn conns 24;

    # ── the rider API, and nothing else ──────────────────────────────────────
    # Sign-in is the expensive, attackable part, so it gets the tighter bucket.
    # The sign-in START, and only it -- this is the request that sends a text.
    # Regex locations are matched in the order they appear, so this has to stay
    # ABOVE the block below or the looser one would swallow it.
    location ~ ^/v2/auth/?$ {
        limit_req zone=signin burst=3 nodelay;
        proxy_pass http://127.0.0.1:8031;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location ~ ^/v2/auth {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8031;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location /v2/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8031;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # ── the driver API ───────────────────────────────────────────────────────
    # Same guard, different upstream behind it. Published because a driver app
    # on a real phone cannot reach a loopback port, and because a release build
    # refuses cleartext — so the tunnel that has served development is not an
    # option for a driver in a car.
    #
    # /ui/ only. The office API on /dashboard/ falls through to the 404 below,
    # which is the whole reason these are two prefixes and not one.
    # The sign-in START, and only it -- this is the request that sends a text.
    # Regex locations are matched in the order they appear, so this has to stay
    # ABOVE the block below or the looser one would swallow it.
    location ~ ^/ui/auth/?$ {
        limit_req zone=signin burst=3 nodelay;
        proxy_pass http://127.0.0.1:8031;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location ~ ^/ui/auth {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8031;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # Licence and registration photos arrive here as base64 inside JSON, so a
    # 1.5 MB photo is about 2 MB on the wire. The server-wide 1 MB limit would
    # refuse them with a 413 that looks, from the phone, like the network
    # dropped. The guard has a matching cap; raising one without the other just
    # moves which layer says no.
    location ~ ^/ui/driver/register/ {
        limit_req zone=api burst=60 nodelay;
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:8031;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location /ui/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8031;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # ── who is nearby, and what they drive ───────────────────────
    # maps-shim, one route of it. The rider API carries only {lat, lon} for a
    # nearby driver and the BPP pool holds no vehicle, so this reads the fleet
    # out of the same database instead -- see maps-shim/fleet.js.
    #
    # NOT behind the auth guard, and that is deliberate rather than an
    # oversight: the guard exists to rate-limit OTP and to hide /dashboard/, and
    # it forwards to the two Haskell apps. This route checks its own caller
    # instead -- it asks rider-app whether the token can read its own profile,
    # and answers 401 otherwise. Nobody unauthenticated is ever named a driver.
    #
    # It returns no plate. A signed-in rider could otherwise walk the map and
    # enumerate the fleet; the plate appears on screen 11, once a driver has
    # actually accepted and is genuinely on the way.
    location /fleet/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8030;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # ── a passenger's own star rating ────────────────────────────────────────
    # maps-shim again, and for the same reason as /avatar/ below: the rider
    # binary does not have this field. `GET /v2/profile` was measured returning
    # eight fields and no rating, while the rating a driver gives a passenger is
    # written to the provider schema. See maps-shim/rating.js.
    #
    # No request body ever, so the server-wide limit is the right one here.
    location /rating/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8030;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # ── the driver's subscription ────────────────────────────────────────────
    # maps-shim again. The backend has nowhere to record a payment -- no plan,
    # fee, subscription or invoice table in either schema, and none of those
    # words in the binary. See maps-shim/subscription.js.
    #
    # This block is NOT behind the auth-guard, and that is deliberate on both
    # counts. The app routes here carry a driver token that the shim proves
    # against the driver backend itself, so the guard would add nothing; and
    # /subscription/webhook is called by Chargily, which has no token, no
    # personal code and no business being asked for one. What protects the
    # webhook is its signature -- an HMAC-SHA256 of the raw body -- checked in
    # subscription.js before a single byte is trusted.
    #
    # Two things this block must not do, each of which would break payments in
    # a way that looks like something else:
    #
    #   * Buffer or rewrite the request body. The signature is over the exact
    #     bytes Chargily sent. Anything that re-serialises them makes every
    #     webhook look forged, and the driver's money vanishes into a 403.
    #   * Rate-limit the callback into oblivion. Their retries are the only
    #     second chance a paid month gets.
    #
    # The server-wide 1m body limit is right here: their events are ~1 KB.
    location /subscription/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8030;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # -- the driver's wallet, added 2026-09-07 --------------------------------
    # maps-shim again, for the same reason as the subscription above: the
    # backend has no table and no route for money. See maps-shim/wallet.js.
    #
    # One prefix, three kinds of caller, and only one of them is the app:
    #
    #   /wallet/status|history|topup  the driver app, carrying his token
    #   /wallet/done                  HIS BROWSER, coming back from Moosyl with
    #                                 no token at all. A redirect target that
    #                                 demanded one would end every payment on an
    #                                 error page.
    #   /wallet/webhook               Moosyl's servers, also with no token
    #
    # Not behind the auth-guard, deliberately. The app routes carry a driver
    # token the shim proves against the driver backend itself, so the guard
    # would add nothing; the other two have no token to give.
    #
    # Unlike Chargily, Moosyl documents NO webhook signature anywhere. So the
    # webhook here is only a hint to go and look: wallet.js reads the session
    # status back from Moosyl with our own key and credits from that. An
    # unsigned POST from anyone on the internet cannot put money in a wallet --
    # which is why leaving this open is safe in a way it would not have been for
    # /subscription/webhook, and is stronger than checking a signature we would
    # have had to guess.
    #
    # Zone `api`, not `auth`: a driver checking his balance is an ordinary read,
    # and Moosyl's retries are the only second chance a top-up gets.
    location /wallet/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8030;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # The sign-in screen's country, from the caller's IP (2026-09-14). The
    # shim reads X-Real-IP, which proxy-common.inc sets from $remote_addr.
    location /geo/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8030;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # Arabic place names, read by the app straight from our own index.
    #
    # They cannot travel the normal way. The deployed rider-app validates
    # `language` against a five-value enum with no Arabic in it, and its Google
    # client has no `language` query parameter at all -- it accepts the field
    # and then drops it. Both measured against the binary on 2026-09-10.
    # Adding it is a backend rebuild; this is a location.
    #
    # `=` and the whole path, NOT the /place/ prefix. /place/autocomplete/json
    # and /place/details/json answer the backend and have no business being
    # reachable from a phone -- widening this would publish the whole geocoder.
    #
    # No auth, deliberately: OpenStreetMap names keyed by ids the caller already
    # holds, carrying no rider and no driver. Same rate limit as the rest.
    location = /place/labels/json {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8030;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # Account deletion requests — the in-app path Google Play requires.
    #
    # Exact path, not a prefix: /account/ is a plausible namespace for things
    # that should never be proxied to the shim, and one route is easier to
    # audit than a subtree. Add a second `location =` rather than widening
    # this one.
    #
    # The `auth` zone rather than `api`: this is not something anyone does
    # dozens of times a minute, and it is the one route where a flood would be
    # somebody trying to guess a token rather than an app behaving badly.
    location = /account/deletion-request {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8030;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # ── profile photographs ──────────────────────────────────────────────────
    # Also maps-shim, and also nothing to do with Google. The backend cannot
    # hold an image -- no column on either side, and the only image routes that
    # exist anywhere forward the picture to Idfy in India -- so the bytes live
    # here instead. See maps-shim/avatars.js.
    #
    # `client_max_body_size` is the point of this block having its own settings:
    # the server-wide limit refuses a body long before an image arrives, and the
    # refusal would look like a broken upload rather than a policy. 512 KB
    # matches what avatars.js enforces while reading; the apps send 15-40 KB.
    location /avatar/ {
        limit_req zone=api burst=20 nodelay;
        client_max_body_size 512k;
        proxy_pass http://127.0.0.1:8030;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # ── the map ──────────────────────────────────────────────────────────────
    # Published because a release APK cannot reach a loopback tile server, and
    # because Android refuses cleartext HTTP in a release build -- so "just open
    # 8035" was never an option either.
    #
    # Read-only, and the whole of it is one .mbtiles file we built ourselves, so
    # the exposure is bandwidth rather than data. A map view is 1-3 MB the first
    # time and close to nothing afterwards, because of the cache headers below.
    # If it is ever abused, deleting this block revokes it in seconds.
    #
    # The trailing slash on proxy_pass is what strips /tiles/ from the path.
    location /tiles/ {
        limit_req zone=tiles burst=300 nodelay;
        proxy_pass http://127.0.0.1:8035/;
        include /etc/nginx/conf.d/proxy-common.inc;

        # A tile at a given z/x/y does not change until we rebuild the whole
        # extract, which is a deliberate act. Without this every pan back over
        # ground already seen costs us the bytes again.
        #
        # Two things had to go for this to come out once. The tileserver sets a
        # Cache-Control of its own, and `expires` quietly generates a second --
        # so the naive version of this block emitted the header three times and
        # left the client to pick. One directive, one header.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800, immutable" always;

        # The browser demos are served from a different origin (8025), and
        # MapLibre fetches tiles with XHR.
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Cheap liveness check that reveals nothing.
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true}';
    }

    # ── The admin console's API, added 2026-08-31 (Phase 1.4) ─────────────
    # movin-admin-api listens on 127.0.0.1:8040 and is published nowhere else,
    # so this location is the only way in from outside the box.
    #
    # Zone `api` (240 r/m), not `auth` (20 r/m): this is the zone for ordinary
    # reads, and one console screen legitimately opens several at once, which
    # is what burst=60 nodelay lets through instead of queueing. The login
    # route takes `auth` in Phase 2 as an exact-path `location =` -- putting a
    # prefix on `auth` here would rate-limit the whole console at 20 requests
    # a minute and look like the API being down.
    #
    # No trailing slash on proxy_pass: the upstream's own routes are /admin/*,
    # so the prefix has to survive the hop.
    # Sign-in is the expensive, attackable route, so it gets the tighter
    # bucket -- and as an EXACT path. `auth` on the /admin/ prefix would
    # throttle the entire console to 20 requests a minute, which does not look
    # like a rate limit from the inside, it looks like the API being down.
    #
    # burst=4, where the rider routes use 10. With nodelay a bucket passes
    # burst+1 straight through, so 4 makes the sixth rapid attempt the one that
    # is refused -- roughly four more than someone who knows their password
    # needs, and the bucket refills at one every three seconds.
    # The driver app posts papers here, and this is the only unauthenticated
    # write in the system. Exact path, `auth` bucket, and a body limit an order
    # of magnitude above a phone photograph and far below a nuisance: the
    # application caps at 8 MB itself and 413s, but nginx should refuse the
    # body before it is buffered at all.
    # The app sends what the driver typed here: the plate, the model, the
    # year, the colour, the licence and the carte grise numbers. Same bucket
    # and same exact-path rule as the upload beside it, and a body limit sized
    # for a dozen short strings.
    location = /driver/declaration {
        limit_req zone=auth burst=4 nodelay;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8040;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location = /driver/documents {
        limit_req zone=auth burst=4 nodelay;
        client_max_body_size 10m;
        proxy_request_buffering on;
        proxy_pass http://127.0.0.1:8040;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location = /admin/auth/login {
        limit_req zone=auth burst=4 nodelay;
        proxy_pass http://127.0.0.1:8040;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location /admin/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8040;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # Within half an hour of this going public, GPTBot and OpenAI's search
    # crawler had both been here, and both asked for a robots.txt that did not
    # exist -- so they will keep asking. This is an API, not a website: there is
    # nothing here to index, and no reason to appear in a search result or a
    # training set.
    #
    # It is a request, not a control. Crawlers that ignore robots.txt are
    # stopped by the 404 on everything and the rate limits, not by this.
    #
    # Written as a real multi-line string because nginx does not interpret \n
    # inside a `return` -- it would serve the two characters, literally.
    location = /robots.txt {
        access_log off;
        default_type text/plain;
        return 200 "User-agent: *
Disallow: /
";
    }

    # Everything else, including Swagger and the OpenAPI document.
    location / {
        return 404;
    }
}

# ══════════════════════════════════════════════════════════════════════════
# The three names added 2026-08-30, when the certificate was expanded from
# two identifiers to five.
#
# Until Phase 1.6 and Phase 4 put built files here, each of these terminates
# TLS and answers 404, and that is the intended state rather than an
# unfinished one: a handshake that completes proves the certificate, the DNS
# and the edge all agree about the name, and 404 is the honest answer to
# "there is nothing here yet". The alternative -- no server block -- makes
# these names fall through to the default server and present a certificate
# for the sslip name, which is the exact failure this step existed to fix.
# ══════════════════════════════════════════════════════════════════════════

# ── the public site ───────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name movinapp.net;

    ssl_certificate     /etc/letsencrypt/live/api.169-58-139-65.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.169-58-139-65.sslip.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # The site is here now, so the promise has something behind it. One year,
    # and deliberately WITHOUT includeSubDomains: admin. and api. carry their
    # own policy already, and claiming authority over subdomains that do not
    # exist buys nothing while making any future plain-HTTP one unreachable.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    server_tokens off;
    limit_conn conns 24;

    root /var/www/edge-web/site;
    index index.html;

    # The custom 404, since 9 Sep 2026. `error_page` keeps the status: the
    # visitor gets our page and the crawler still gets a 404. It sits at the
    # server level so every location inherits it, and the document is served
    # through `location /` below, which means `expires -1` — a cached 404 is a
    # page that goes on being wrong after the address starts working.
    error_page 404 /404.html;

    # `expires`, deliberately, and NOT `add_header Cache-Control`: an
    # add_header anywhere inside a location REPLACES every add_header
    # inherited from the server block, so writing one here would silently
    # strip HSTS, nosniff, the referrer policy and X-Frame-Options from
    # exactly the pages a visitor reads. `expires` sets caching and touches
    # nothing else.
    #
    # The documents are never cached: a deploy the client cannot see because
    # his browser kept last week's page is the failure this prevents, and he
    # reviews in a browser that has already been here.
    location / {
        expires -1;
        # /confidentialite, not /confidentialite.html. Google Play is given a
        # bare address and a legal document should not wear a file extension.
        try_files $uri $uri.html $uri/ =404;
    }

    # Vite hashes these, so a year is safe and a stale one is impossible.
    location /assets/ {
        expires 1y;
    }
}

# ── www, which is not a second site ───────────────────────────────────────
# One canonical name. Left to answer on its own, www would duplicate every
# page at a second address and split links, bookmarks and search results
# between them for as long as the site exists.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.movinapp.net;

    ssl_certificate     /etc/letsencrypt/live/api.169-58-139-65.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.169-58-139-65.sslip.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    limit_conn conns 24;

    return 301 https://movinapp.net$request_uri;
}

# ── the admin console ─────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.movinapp.net;

    ssl_certificate     /etc/letsencrypt/live/api.169-58-139-65.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.169-58-139-65.sslip.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS here, unlike the public name. This host will only ever serve a
    # console that sits behind a login and reads driver phone numbers, so it
    # has no plain-HTTP future to strand and the year is safe to promise.
    # No `includeSubDomains`: nothing lives underneath this name, and claiming
    # authority over hostnames that do not exist buys nothing.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    server_tokens off;
    limit_conn conns 24;

    # The built console. Static files only -- no Node process on this name.
    root /var/www/edge-web/admin;
    index index.html;

    # The console's own API, on its own origin. This is why the front end
    # calls /admin/* as a relative path: no CORS preflight, and in Phase 2 the
    # session cookie is a plain same-origin cookie instead of a cross-site one
    # that every future browser default is getting stricter about. The same
    # routes stay reachable at api.movinapp.net/admin/* -- this serves them,
    # it does not move them.
    # Sign-in is the expensive, attackable route, so it gets the tighter
    # bucket -- and as an EXACT path. `auth` on the /admin/ prefix would
    # throttle the entire console to 20 requests a minute, which does not look
    # like a rate limit from the inside, it looks like the API being down.
    #
    # burst=4, where the rider routes use 10. With nodelay a bucket passes
    # burst+1 straight through, so 4 makes the sixth rapid attempt the one that
    # is refused -- roughly four more than someone who knows their password
    # needs, and the bucket refills at one every three seconds.
    location = /admin/auth/login {
        limit_req zone=auth burst=4 nodelay;
        proxy_pass http://127.0.0.1:8040;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location /admin/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8040;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # `expires`, deliberately, and not `add_header Cache-Control`: an
    # add_header anywhere in a location REPLACES every add_header inherited
    # from the server block, so writing one here would silently drop HSTS,
    # nosniff, the referrer policy and X-Frame-Options from exactly the files
    # that carry the console. `expires` sets caching without touching them.
    #
    # Vite hashes asset filenames, so those can be cached for a year; the entry
    # document must not be, or a deploy stays invisible behind a cache -- and
    # this client reviews pages in a browser that has already cached them once.
    location /assets/ {
        expires 1y;
    }
    location = /index.html {
        expires -1;
    }

    # One document, client-side routing underneath it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
