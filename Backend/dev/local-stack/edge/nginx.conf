# The only thing on this machine the internet can talk to, besides SSH.
#
# ── Why this exists ─────────────────────────────────────────────────────────
# Everything has been reached through an SSH tunnel so far, which is safe and
# useless for handing an APK to someone else. This publishes exactly one thing —
# the rider API — over TLS, and nothing else.
#
# ── What it deliberately does not expose ────────────────────────────────────
# Postgres, Redis, the tile server, the driver API, the demo pages, mock-google,
# OSRM and Swagger all stay on loopback. Swagger in particular is a complete,
# executable description of the API and there is no reason to publish it.
#
# ── Ordering ────────────────────────────────────────────────────────────────
# Every /v2/ request goes to the auth guard, which forwards to rider-app. That
# is not a detail: the guard is what makes publishing this safe at all (the
# backend accepts unlimited OTP guesses), and a `location` that reached
# rider-app directly would quietly undo it. There is no such location.

# nginx runs with network_mode: host so that these limits are enforced by ufw
# like anything else — a bridged container with published ports would bypass it,
# which is the trap that makes `ufw default deny` insufficient on this box.

# Rate limits, keyed on the caller's address. The guard already limits per phone
# number and per auth session; this is the layer that survives a guard restart
# and catches someone rotating numbers.
limit_req_zone  $binary_remote_addr  zone=auth:10m   rate=20r/m;
limit_req_zone  $binary_remote_addr  zone=api:10m    rate=240r/m;
limit_conn_zone $binary_remote_addr  zone=conns:10m;

# Logged so a real attempt is visible afterwards. `warn` keeps the rejections.
limit_req_log_level warn;
limit_conn_log_level warn;

# nginx answers a rate-limited request with 503 by default, which is a lie: it
# says "this service is broken" when the truth is "you are going too fast". An
# app reading 503 tells the rider the server is down and offers to retry, which
# is exactly the wrong advice. 429 is the honest code, and it is the one the
# guard already uses, so a caller sees one consistent answer from both layers.
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Certbot renews over HTTP-01, so this one path has to answer on 80
    # forever. It is the only thing that does.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.169-58-139-65.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/api.169-58-139-65.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.169-58-139-65.sslip.io/privkey.pem;

    # TLS 1.2 as the floor: 1.3 alone would be cleaner, but Android 8 and 9 are
    # still common here and negotiate 1.2. Nothing older is allowed.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # A day, not a year, and no includeSubDomains. The hostname is a temporary
    # sslip.io one; committing every browser to HTTPS-only on it for a year
    # would be a nuisance to undo, and includeSubDomains would impose it on
    # other people's sslip.io names too.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    server_tokens off;
    client_max_body_size 1m;
    limit_conn conns 24;

    # ── the rider API, and nothing else ──────────────────────────────────────
    # Sign-in is the expensive, attackable part, so it gets the tighter bucket.
    location ~ ^/v2/auth {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8031;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location /v2/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8031;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # Cheap liveness check that reveals nothing.
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true}';
    }

    # Everything else, including Swagger and the OpenAPI document.
    location / {
        return 404;
    }
}
