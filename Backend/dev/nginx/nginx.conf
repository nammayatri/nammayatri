
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;

    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        location /app/ {
            proxy_pass http://host.docker.internal:8013/;
           }

       location /transporter/ {
            proxy_pass http://host.docker.internal:8014/;
           }

        # --- dashboard cutover -------------------------------------------------
        # provider-dashboard's public paths, served directly by the application
        # servers. The path after the prefix is identical on both sides, so this
        # is a pure prefix swap; flip a location back to :8016 (the dashboard) to
        # roll a side back without a deploy.
        #
        #   /bpp/driver-offer/<merchantId>/<city>/...  ->  driver-app
        #   /bap/<merchantId>/<city>/...              ->  rider-app
        #
        # issueManagement IS served by the application servers (issue/config and
        # issueV2/config both return 200), so it rides along with these prefixes.
        # The login / 2FA / user / role administration tree is handled by the
        # separate location blocks below.
        location /bpp/driver-offer/ {
            proxy_pass http://host.docker.internal:8016/direct-dashboard/;
           }

        location /bap/ {
            proxy_pass http://host.docker.internal:8013/direct-dashboard/;
           }

        # The login / user-administration tree. These paths sit OUTSIDE the two
        # prefixes above, so the prefix swaps do not move them. driver-app serves
        # the whole tree (lib-dashboard's API.DashboardLogin); rider-app does NOT
        # mount it and will 404 -- never point these at :8013 or balance across
        # both. A dashboard session is not server-scoped (registration_token has
        # no server_name), so one token minted here authenticates against both
        # application servers.
        location /user/ {
            proxy_pass http://host.docker.internal:8016/direct-dashboard/user/;
           }

        location /admin/ {
            proxy_pass http://host.docker.internal:8016/direct-dashboard/admin/;
           }

        location /listTransactions {
            proxy_pass http://host.docker.internal:8016/direct-dashboard/listTransactions;
           }

        location /specialZone/ {
            proxy_pass http://host.docker.internal:8016/direct-dashboard/specialZone/;
           }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}

