imports:
  LatLong: Kernel.External.Maps.Types
  UTCTime: Kernel.Prelude
  Int: Kernel.Prelude
  Text: Kernel.Prelude
  Bool: Kernel.Prelude
  Double: Kernel.Prelude
  APISuccess: Kernel.Types.APISuccess

module: DemandHotspots
types:
  GetDemandHotspotsResp:
    hotspotsDetails: [HotspotsDetails]
    createdAt: UTCTime
    expiryAt: UTCTime
    enableDemandHotspots: Bool
  HotspotsDetails:
    location: LatLong
    frequency: Int
    categories: [HotspotCategoryCount]
  HotspotCategoryCount:
    tripOption: Text
    isScheduled: Bool
    frequency: Int
  DemandNudgeReq:
    lat: Double
    lon: Double
    timestamp: UTCTime
apis:
  - GET:
      endpoint: /driver/demandHotspots
      auth: TokenAuth PROVIDER_TYPE
      response:
        type: GetDemandHotspotsResp
  - POST:
      endpoint: /driver/demandHotspot
      auth: TokenAuth PROVIDER_TYPE
      request:
        type: DemandNudgeReq
      response:
        type: APISuccess
