imports:
  LatLong: Kernel.External.Maps.Types
  UTCTime: Kernel.Prelude
  Int: Kernel.Prelude
  Text: Kernel.Prelude
  Bool: Kernel.Prelude

module: DemandHotspots
types:
  GetDemandHotspotsResp:
    hotspotsDetails: [HotspotsDetails]
    createdAt: UTCTime
    expiryAt: UTCTime
    enableDemandHotspots: Bool
  HotspotsDetails:
    location: LatLong
    frequency: Int
    categories: [HotspotCategoryCount]
  HotspotCategoryCount:
    tripOption: Text
    isScheduled: Bool
    frequency: Int

apis:
  - GET:
      endpoint: /driver/demandHotspots
      auth: TokenAuth PROVIDER_TYPE
      response:
        type: GetDemandHotspotsResp
