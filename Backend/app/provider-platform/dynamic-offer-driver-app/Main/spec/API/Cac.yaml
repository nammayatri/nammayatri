# Kept after haskell-cac removal for backward compatibility: older driver apps
# may still call /driver/getUiConfigs; dropping the route would 404 them.
# Handler returns empty Object {}.
imports:
module: Cac
types: {}
apis:
  - POST:
      endpoint: /driver/getUiConfigs
      auth: TokenAuth PROVIDER_TYPE
      request:
        type: "Data.Aeson.Object"
      response:
        type: "Data.Aeson.Object"
