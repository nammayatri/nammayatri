imports:
  Id: Kernel.Types.Id
  IncentiveJourney: Lib.IncentiveJourney.Domain.Types.IncentiveJourney
  IncentiveJourneyMilestone: Lib.IncentiveJourney.Domain.Types.IncentiveJourneyMilestone
  IncentiveJourneyType: Lib.IncentiveJourney.Domain.Types.IncentiveJourney
  MilestoneConditionType: Lib.IncentiveJourney.Domain.Types.IncentiveJourneyMilestone
  MilestoneConditionOperator: Lib.IncentiveJourney.Domain.Types.IncentiveJourneyMilestone
  MilestoneAreaType: Lib.IncentiveJourney.Domain.Types.IncentiveJourneyMilestone
  MilestoneRewardType: Lib.IncentiveJourney.Domain.Types.Common
  JourneyMilestoneStatus: Lib.IncentiveJourney.Domain.Types.IncentiveJourneyStats
  TimeBound: Kernel.Types.TimeBound
  VehicleCategory: Domain.Types.VehicleCategory
  ServiceTierType: Domain.Types.ServiceTierType
  CoinsConfig: Domain.Types.Coins.CoinsConfig
  Text: Data.Text
  Merchant: Domain.Types.Merchant
  MerchantOperatingCity: Domain.Types.MerchantOperatingCity

module: IncentiveJourney

types:
  IncentiveJourneyMilestoneItem:
    milestoneId: Id IncentiveJourneyMilestone
    name: Maybe Text
    description: Maybe Text
    order: Int
    conditionType: MilestoneConditionType
    conditionOperator: MilestoneConditionOperator
    conditionValue: Int
    areaType: Maybe MilestoneAreaType
    specialLocationNames: Maybe [Text]
    vehicleCategory: Maybe VehicleCategory
    serviceTierType: Maybe ServiceTierType
    rewardType: MilestoneRewardType
    rewardValue: Maybe Int
    timeBounds: Maybe TimeBound
    status: JourneyMilestoneStatus
    currentValue: Int

  IncentiveJourneyListItem:
    journeyId: Id IncentiveJourney
    name: Text
    description: Maybe Text
    journeyType: Maybe IncentiveJourneyType
    startDate: UTCTime
    endDate: UTCTime
    streakRange: Int
    enabled: Bool
    milestones: "[IncentiveJourneyMilestoneItem]"

  IncentiveJourneyListRes:
    journeys: "[IncentiveJourneyListItem]"

  IncentiveJourneyHistoryItem:
    journeyId: Id IncentiveJourney
    journeyName: Text
    journeyType: Maybe IncentiveJourneyType
    milestoneId: Id IncentiveJourneyMilestone
    milestoneName: Maybe Text
    milestoneDescription: Maybe Text
    milestoneOrder: Int
    conditionType: MilestoneConditionType
    conditionOperator: MilestoneConditionOperator
    conditionValue: Int
    areaType: Maybe MilestoneAreaType
    specialLocationNames: Maybe [Text]
    currentValue: Int
    status: JourneyMilestoneStatus
    rewardType: MilestoneRewardType
    rewardValue: Maybe Int
    periodKey: Text
    completedAt: Maybe UTCTime

  IncentiveJourneyHistoryRes:
    history: "[IncentiveJourneyHistoryItem]"

apis:
  - GET:
      endpoint: /incentive/journey/list
      auth: TokenAuth PROVIDER_TYPE
      query:
        active: Bool
        limit: Int
        offset: Int
        date: Text
      response:
        type: IncentiveJourneyListRes

  - GET:
      endpoint: /incentive/journey/history
      auth: TokenAuth PROVIDER_TYPE
      query:
        date: Text
        limit: Int
        offset: Int
      response:
        type: IncentiveJourneyHistoryRes
