imports:
  APISuccess: Kernel.Types.APISuccess
  SharedCabAllocationEntityData: Tools.Notifications
  CabEventReq: Domain.Types.SharedCabSession
  CabEventResp: Domain.Types.SharedCabSession

module: SharedCabInternal

# Called by rider-app and mounted under /internal by API.Internal. The token header is checked in the domain handlers.
types:
  SharedCabDriverCallNumberResp:
    driverNumber: Text
    derive: "Show"

apis:
  - POST:
      endpoint: /sharedCabAllocationFCM
      auth: NoAuth
      headers:
        token: Text
      request:
        type: SharedCabAllocationEntityData
      response:
        type: APISuccess
  - GET:
      endpoint: /sharedCab/driver/{driverId}/callNumber
      auth: NoAuth
      params:
        driverId: Text
      headers:
        token: Text
      response:
        type: SharedCabDriverCallNumberResp
  # rider-app's silence check and a cab emptied of riders change the trip, which driver-app owns; the answer is the update to apply.
  - POST:
      endpoint: /sharedCab/cab/{vehicleNumber}/event
      auth: NoAuth
      params:
        vehicleNumber: Text
      headers:
        token: Text
      request:
        type: CabEventReq
      response:
        type: CabEventResp
