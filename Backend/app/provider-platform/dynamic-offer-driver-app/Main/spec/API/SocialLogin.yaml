imports:
  MerchantOperatingCity: Domain.Types.MerchantOperatingCity
  Merchant: Domain.Types.Merchant
  City: Kernel.Types.Beckn.Context
  FCMRecipientToken: Kernel.External.Notification.FCM.Types

module: SocialLogin

types:
  OAuthProvider:
    enum: "Google, IOS"
  SocialLoginStatus:
    enum: "LOGGED_IN, LINK_REQUIRED"
  SocialLoginReq:
    name: Maybe Text
    email: Maybe Text
    tokenId: Text
    oauthProvider: OAuthProvider
    merchantOperatingCity: City
    merchantId: Maybe (Id Merchant)
    registrationLat: Maybe Double
    registrationLon: Maybe Double
    merchantShortId: Maybe (ShortId Merchant)
  SocialLoginRes:
    isNew: Bool
    token: Text
  SocialUpdateProfileReq:
    email: Text
    firstName: Maybe Text
    lastName: Maybe Text
    mobileNumber: Maybe Text
    mobileCountryCode: Maybe Text
  SocialLoginV2Req:
    tokenId: Text
    oauthProvider: OAuthProvider
    merchantShortId: ShortId Merchant
    merchantOperatingCity: City
    nonce: Maybe Text
    authorizationCode: Maybe Text
  SocialLoginV2Res:
    status: SocialLoginStatus
    token: Maybe Text
    linkToken: Maybe Text
  EmailAuthV2Req:
    email: Text
    merchantShortId: ShortId Merchant
    merchantOperatingCity: City
  EmailAuthV2Res:
    authId: Text
    attempts: Int
  EmailAuthVerifyV2Req:
    otp: Text
    deviceToken: FCMRecipientToken
  SocialLinkReq:
    tokenId: Text
    oauthProvider: OAuthProvider
    nonce: Maybe Text
    authorizationCode: Maybe Text
  SocialUnlinkReq:
    oauthProvider: OAuthProvider
  LinkedSocialAccount:
    oauthProvider: OAuthProvider
    email: Maybe Text
    isPrivateEmail: Bool
    validTill: UTCTime
  LinkedSocialAccountsRes:
    accounts: "[LinkedSocialAccount]"
apis:
  - POST:
      endpoint: /social/login
      auth: NoAuth
      request:
        type: API.Types.UI.SocialLogin.SocialLoginReq
      response:
        type: API.Types.UI.SocialLogin.SocialLoginRes
  - POST:
      endpoint: /social/update/profile
      auth: TokenAuth PROVIDER_TYPE
      request:
        type: API.Types.UI.SocialLogin.SocialUpdateProfileReq
      response:
        type: Kernel.Types.APISuccess.APISuccess
  - POST:
      endpoint: /social/login/v2
      auth: NoAuth
      request:
        type: API.Types.UI.SocialLogin.SocialLoginV2Req
      response:
        type: API.Types.UI.SocialLogin.SocialLoginV2Res
  - POST:
      endpoint: /auth/email/v2
      auth: NoAuth
      headers:
        x-forwarded-for: Text
      request:
        type: API.Types.UI.SocialLogin.EmailAuthV2Req
      response:
        type: API.Types.UI.SocialLogin.EmailAuthV2Res
  - POST:
      endpoint: /auth/email/{authId}/verify/v2
      auth: NoAuth
      params:
        authId: Text
      request:
        type: API.Types.UI.SocialLogin.EmailAuthVerifyV2Req
      response:
        type: API.Types.UI.SocialLogin.SocialLoginV2Res
  - POST:
      endpoint: /social/link
      auth: TokenAuth PROVIDER_TYPE
      request:
        type: API.Types.UI.SocialLogin.SocialLinkReq
      response:
        type: Kernel.Types.APISuccess.APISuccess
  - POST:
      endpoint: /social/unlink
      auth: TokenAuth PROVIDER_TYPE
      request:
        type: API.Types.UI.SocialLogin.SocialUnlinkReq
      response:
        type: Kernel.Types.APISuccess.APISuccess
  - GET:
      endpoint: /social/linkedAccounts
      auth: TokenAuth PROVIDER_TYPE
      response:
        type: API.Types.UI.SocialLogin.LinkedSocialAccountsRes
