imports:
  RsfClaimStatus: Lib.Finance.Domain.Types.RsfReconLedgerEntry
  Day: Data.Time

module: RSFReconciliation

apis:
  # Orders whose receiver_recon claim arrived on `date` (IST day), one row per order.
  - GET: # OrderListAPI
      endpoint: /rsf/orders
      migrate:
        capability: financeManagement.rsfOrders.list
      auth: ApiAuthV2
      query:
        date: Day
        limit: Int
        offset: Int
        bapId: Text
        utr: Text
        status: OrderReconVerdict
      response:
        type: OrderListRes

  # UTRs first mentioned by a receiver_recon on `date` (IST day).
  - GET: # UtrListAPI
      endpoint: /rsf/utrs
      migrate:
        capability: financeManagement.rsfUtrs.list
      auth: ApiAuthV2
      query:
        date: Day
        limit: Int
        offset: Int
        bapId: Text
        isVerified: Bool
      response:
        type: UtrListRes

  - GET: # UtrDetailAPI
      endpoint: /rsf/utrs/{utr}
      name: getRSFReconciliationRsfUtr
      migrate:
        capability: financeManagement.rsfUtrs.detail
      auth: ApiAuthV2
      params:
        utr: Text
      response:
        type: UtrDetailRes

  # Phase 3 (step 10): finance enters the bank figure for a UTR -- once, then frozen.
  # Verifies and locks only; allocation is a separate step (autoAllocation).
  - POST: # UtrBankVerifyAPI
      endpoint: /rsf/utrs/{utr}/verify
      name: postRSFReconciliationRsfUtrBankVerify
      migrate:
        capability: financeManagement.rsfUtrs.bankVerify
      auth: ApiAuthV2
      params:
        utr: Text
      request:
        type: BankVerifyReq
      response:
        type: APISuccess

  # Phase 3 (step 11): pooled allocation over the day's orders. Every UTR the day's
  # claims mention must be verified first, else the call fails.
  - POST: # AutoAllocationAPI
      endpoint: /rsf/autoAllocation
      migrate:
        capability: financeManagement.rsfAllocation.auto
      auth: ApiAuthV2
      query:
        date: Day
      response:
        type: AutoAllocationRes

  # Phase 3 (step 11a): ops sets an order's allocation on one UTR by hand.
  - POST: # OrderManualConfirmAPI
      endpoint: /rsf/orders/{orderId}/confirm
      migrate:
        capability: financeManagement.rsfOrders.confirm
      auth: ApiAuthV2
      params:
        orderId: Text
      request:
        type: ManualConfirmReq
      response:
        type: APISuccess

  # Phase 4: checks every receiver_recon message of the day (gates 1-3) and, only when all
  # of them pass, sends their on_receiver_recon responses one by one.
  - POST: # SendForDateAPI
      endpoint: /rsf/send
      migrate:
        capability: financeManagement.rsfSettlements.send
      auth: ApiAuthV2
      query:
        date: Day
      response:
        type: SendForDateRes

  # Rides completed on the platform that no receiver_recon ever claimed.
  - GET: # ReconUnmatchedAPI
      endpoint: /rsf/recon/unmatched
      migrate:
        capability: financeManagement.rsfRecon.unmatched
      auth: ApiAuthV2
      query:
        limit: Int
        offset: Int
        from: UTCTime
        to: UTCTime
      response:
        type: ReconGridListRes

types:
  # Live order-level verdict. REJECTED = the claim failed a Phase 2 check (see claimStatus);
  # AWAITING = not judged yet, or no allocation has run for it.
  OrderReconVerdict:
    - enum: "AWAITING, PAID, UNDERPAID, OVERPAID, REJECTED"
    - derive: "HttpInstance"

  ReconTabStatus:
    - enum: "Matched, Unmatched, Mismatch, Pending"
    - derive: "HttpInstance"

  OrderListRes:
    - totalItems: Int
    - orders: [OrderRow]

  OrderRow:
    - orderId: Text
    - rideId: Maybe Text
    - driverId: Maybe Text
    - bapId: Text
    - platformGrossFare: Maybe HighPrecMoney
    - claimedTotalAmount: HighPrecMoney           # Σ standing claim legs
    - receivedTotal: HighPrecMoney                # Σ BANK_ALLOCATION to this order
    - orderVerdict: OrderReconVerdict
    - orderDiff: HighPrecMoney
    - claimStatus: Maybe RsfClaimStatus
    - settlementUtrs: [Text]
    - allocations: [OrderAllocation]
    - anyManuallyConfirmed: Bool
    - allSent: Bool                               # reported to the collector (frozen)
    - receivedAt: UTCTime

  OrderAllocation:
    - utr: Text
    - amount: HighPrecMoney

  UtrListRes:
    - totalItems: Int
    - utrs: [UtrSummary]

  UtrSummary:
    - utr: Text
    - bapId: Text
    - claimedTotalAmount: HighPrecMoney
    - bankVerifiedAmount: Maybe HighPrecMoney     # Nothing until finance verifies
    - allocatedAmount: HighPrecMoney
    - unallocatedAmount: HighPrecMoney            # received − Σ allocated
    - totalOrders: Int
    - reportedStatus: Maybe Text                  # rsf_utr_state: 01..04 once reported
    - createdAt: UTCTime

  UtrDetailRes:
    - utr: UtrSummary
    - orders: [OrderRow]

  BankVerifyReq:
    - bankVerifiedAmount: HighPrecMoney
    - verifiedBy: Maybe Text
    - reason: Maybe Text

  # confirmedAmount is what this order should hold from this UTR afterwards.
  ManualConfirmReq:
    - utr: Text
    - confirmedBy: Text
    - reason: Text
    - confirmedAmount: HighPrecMoney

  SendForDateRes:
    - messagesSent: [Text]

  AutoAllocationRes:
    - ordersConsidered: Int
    - ordersSettled: Int
    - ordersPartiallyFunded: Int
    - allocations: [AllocationLine]

  AllocationLine:
    - orderId: Text
    - utr: Text
    - amount: HighPrecMoney

  ReconGridListRes:
    - totalItems: Int
    - rows: [ReconGridRow]

  ReconGridRow:
    - rideId: Maybe Text
    - orderId: Text
    - buyerAppName: Text
    - rideDateTime: Maybe UTCTime
    - driverId: Maybe Text
    - grossFarePlatform: Maybe HighPrecMoney
    - netReceivablePlatform: Maybe HighPrecMoney
    - bapSettlementAmount: HighPrecMoney
    - amountDifference: HighPrecMoney
    - settlementDateBap: Maybe UTCTime
    - settlementUtrs: [Text]
    - reconciliationStatus: ReconTabStatus
    - payoutEligible: Bool
    - anyManuallyConfirmed: Bool
    - communicationStatus: Text

extraOperations:
  - EXTRA_API_TYPES_FILE
  - EXTRA_API_COMMON_TYPES_FILE
