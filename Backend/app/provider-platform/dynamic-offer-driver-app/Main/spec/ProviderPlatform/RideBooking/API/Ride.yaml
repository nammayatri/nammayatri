imports:
  Ride: Dashboard.Common
  LatLong: Kernel.External.Maps.Types
  CancellationReasonCode: Dashboard.Common.Booking

module: Ride

apis:
  - POST: # RideStartAPI
      endpoint: /{rideId}/start
      auth: ApiAuthV2
      params:
        rideId: Id Ride
      request:
        type: StartRideReq
      response:
        type: APISuccess
      helperApi:
        - POST:
            endpoint: /{rideId}/start
            auth: ApiAuthV2
            params:
              rideId: Id Ride
            query:
              - requestorId: Text
            request:
              type: StartRideReq
            response:
              type: APISuccess
  - POST: # RideEndAPI
      endpoint: /{rideId}/end
      auth: ApiAuthV2
      params:
        rideId: (Id Ride)
      request:
        type: EndRideReq
      response:
        type: APISuccess
      helperApi:
        - POST:
            endpoint: /{rideId}/end
            auth: ApiAuthV2
            params:
              rideId: (Id Ride)
            query:
              - requestorId: Text
            request:
              type: EndRideReq
            response:
              type: APISuccess
  - GET: # CurrentActiveRideAPI
      endpoint: /{vehicleNumber}/currentActiveRide
      auth: ApiAuthV2
      params:
        vehicleNumber: Text
      response:
        type: (Id Ride)
  - POST: # RideCancelAPI
      endpoint: /{rideId}/cancel
      auth: ApiAuthV2
      params:
        rideId: Id Ride
      request:
        type: CancelRideReq
      response:
        type: APISuccess
      helperApi:
        - POST:
            endpoint: /{rideId}/cancel
            auth: ApiAuthV2
            params:
              rideId: Id Ride
            query:
              - requestorId: Text
            request:
              type: CancelRideReq
            response:
              type: APISuccess
  - POST: # BookingWithVehicleNumberAndPhoneAPI
      endpoint: /booking/withVehicleNumberAndPhone
      auth: ApiAuthV2
      request:
        type: BookingWithVehicleAndPhoneReq
      response:
        type: BookingWithVehicleAndPhoneRes
      helperApi:
        - POST:
            endpoint: /booking/withVehicleNumberAndPhone
            auth: ApiAuthV2
            query:
              - requestorId: Text
            request:
              type: BookingWithVehicleAndPhoneReq
            response:
              type: BookingWithVehicleAndPhoneRes

types:
  StartRideReq:
    - point: Maybe LatLong
    - odometerReadingValue: Maybe Centesimal
    - derive: "'HideSecrets"
  EndRideReq:
    - point: Maybe LatLong
    - odometerReadingValue: Maybe Centesimal
    - derive: "'HideSecrets"
  CancelRideReq:
    - reasonCode: CancellationReasonCode
    - additionalInfo: Maybe Text
    - derive: "'HideSecrets"
  BookingWithVehicleAndPhoneReq:
    - vehicleNumber: Text
    - phoneNumber: Text
    - countryCode: Text
    - endRideForDriver: Bool
    - endRideForVehicle: Bool
    - derive: "'HideSecrets"
  BookingWithVehicleAndPhoneRes:
    - driverId: Text
    - recordType: NewType
    - derive: "'HideSecrets"
