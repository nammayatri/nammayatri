imports:
  Person: Dashboard.Common
  City: Kernel.Types.Beckn.Context
  BaseUrl: Kernel.Prelude
  PaymentMode: Domain.Types.PaymentMode
  RequirementsInfo: Kernel.External.Payment.Interface.Types
  Language: Kernel.External.Types
  IndianState: Kernel.Types.Beckn.Context
  AddressDocumentType: Dashboard.Common.Driver
  InitiatedBy: Domain.Types.InitiatedBy

module: RegistrationV2
apiPrefix: fleet

apis:
  - POST:
      endpoint: /v2/login/otp
      appServerHandler: custom
      name: postRegistrationV2LoginOtp
      auth: NoAuth
      request:
        type: FleetOwnerLoginReqV2
      response:
        type: APISuccess
      helperApi:
        - POST:
            endpoint: /v2/login/otp
            auth: NoAuth
            mandatoryQuery:
              - enabled: Bool
            query:
              - dashboardPersonId: Text
            request:
              type: FleetOwnerLoginReqV2
            response:
              type: FleetOwnerLoginResV2

  - POST:
      endpoint: /v2/verify/otp
      appServerHandler: custom
      name: postRegistrationV2VerifyOtp
      auth: NoAuth
      request:
        type: FleetOwnerVerifyReqV2
      response:
        type: FleetOwnerVerifyResV2
      helperApi:
        - POST:
            endpoint: /v2/verify/otp
            auth: NoAuth
            request:
              type: FleetOwnerVerifyReqV2
            response:
              type: FleetOwnerVerifiedRes

  - POST:
      endpoint: /v2/register
      appServerHandler: custom
      name: postRegistrationV2Register
      auth: ApiAuthV2
      request:
        type: FleetOwnerRegisterReqV2
      response:
        type: APISuccess
      helperApi:
        - POST:
            endpoint: /v2/register
            auth: ApiAuthV2
            mandatoryQuery:
              - requestorId: Text
            request:
              type: FleetOwnerRegisterReqV2
            response:
              type: FleetOwnerRegisterResV2

  - POST:
      endpoint: /v2/create
      appServerHandler: custom
      name: postRegistrationV2CreateFleet
      auth: ApiAuthV2
      request:
        type: FleetCreateReqV2
      response:
        type: FleetCreateResV2
      helperApiExtra:
        mandatoryQuery:
          - requestorId: Text
      migrate:
        capability: fleet.onboarding.write

  - GET:
      endpoint: /v2/contact
      appServerHandler: custom
      name: getRegistrationV2Contact
      auth: ApiAuthV2
      query:
        fleetOwnerId: Text
      response:
        type: FleetContactRes
      helperApiExtra:
        mandatoryQuery:
          - requestorId: Text
      migrate:
        capability: fleet.onboarding.read

  - POST:
      endpoint: /v2/contact
      appServerHandler: custom
      name: postRegistrationV2Contact
      auth: ApiAuthV2
      request:
        type: UpdateFleetContactReq
      response:
        type: APISuccess
      helperApiExtra:
        mandatoryQuery:
          - requestorId: Text
      migrate:
        capability: fleet.onboarding.write

  - POST:
      endpoint: /v2/assignment/accept
      appServerHandler: custom
      name: postRegistrationV2AcceptFleetAssignment
      auth: ApiAuthV2
      request:
        type: AcceptFleetAssignmentReqV2
      response:
        type: APISuccess
      helperApiExtra:
        mandatoryQuery:
          - requestorId: Text
      migrate:
        capability: fleet.onboarding.write

  - POST:
      endpoint: /register/bankAccount/link
      auth: ApiAuthV2
      query:
        - fleetOwnerId: Text
        - paymentMode: PaymentMode
        - initiatedBy: InitiatedBy
      response:
        type: FleetBankAccountLinkResp
      helperApiExtra:
        mandatoryQuery:
          - requestorId: Text

  - GET:
      endpoint: /register/bankAccount/status
      auth: ApiAuthV2
      query:
        - fleetOwnerId: Text
        - forceRefresh: Bool
      response:
        type: FleetBankAccountResp
      helperApiExtra:
        mandatoryQuery:
          - requestorId: Text

  - PUT:
      endpoint: /profile/language
      appServerHandler: custom
      name: putRegistrationV2ProfileLanguage
      auth: ApiAuthV2
      request:
        type: FleetOwnerUpdateLanguageReq
      response:
        type: APISuccess
      helperApiExtra:
        mandatoryQuery:
          - requestorId: Text

  - GET:
      endpoint: /profile/language
      name: getRegistrationV2ProfileLanguage
      auth: ApiAuthV2
      response:
        type: FleetOwnerLanguageRes
      helperApiExtra:
        mandatoryQuery:
          - requestorId: Text

types:
  FleetOwnerLoginReqV2:
    - mobileNumber: Text
    - mobileCountryCode: Text
    - fleetType: Maybe FleetType
  FleetOwnerLoginResV2:
    - personId: Id Person
    - recordType: NewType
    - derive: "'HideSecrets"
  FleetOwnerVerifyReqV2:
    - mobileNumber: Text
    - mobileCountryCode: Text
    - otp: Maybe Text
  FleetOwnerVerifyResV2:
    - authToken: Text
    - recordType: NewType
  # What the application server answers to the dashboard's OTP check. It still reads as an APISuccess
  # (result = "Success"), so an older dashboard keeps working, and adds the person the OTP was issued to,
  # which the dashboard mints the session for. Absent when the OTP predates storing the person.
  FleetOwnerVerifiedRes:
    - result: Text
    - personId: Maybe Text
  FleetOwnerRegisterReqV2:
    - firstName: Text
    - lastName: Text
    - personId: Maybe (Id Person)
    - email: Maybe Text
    - fleetType: Maybe FleetType
    - businessLicenseNumber: Maybe Text
    - businessLicenseImage: Maybe Text
    - operatorReferralCode: Maybe Text
    - adminApprovalRequired: Maybe Bool
    - setIsEnabled: Maybe Bool
    - fleetName: Maybe Text
    - address: Maybe Text
    - addressState: Maybe IndianState
    - addressDocumentType: Maybe AddressDocumentType
  FleetOwnerRegisterTReqV2: # hide secrets
    - firstName: Text
    - lastName: Text
    - personId: Maybe (Id Person)
    - fleetType: Maybe FleetType
    - operatorReferralCode: Maybe Text
    - adminApprovalRequired: Maybe Bool
    - setIsEnabled: Maybe Bool
  FleetType:
    - enum: "RENTAL_FLEET,NORMAL_FLEET,BUSINESS_FLEET"
    - derive: "HttpInstance"
  FleetCreateReqV2: # a person creates a fleet; it is a scope they get an admin assignment on, not a login
    - fleetName: Text
    - fleetType: Maybe FleetType
    - contactMobileCountryCode: Maybe Text
    - contactMobileNumber: Maybe Text
    - contactEmail: Maybe Text
    - derive: "'HideSecrets"
  FleetContactRes: # the contact a fleet is reached on; contactSetOnFleet is false while it still falls back to the owner's own
    - contactMobileCountryCode: Maybe Text
    - contactMobileNumber: Maybe Text
    - contactEmail: Maybe Text
    - contactSetOnFleet: Bool
    - fleetName: Maybe Text
  UpdateFleetContactReq: # sets the fleet's own contact; a missing phone or e-mail clears it, so the fleet falls back to the owner's
    - fleetOwnerId: Maybe Text
    - contactMobileCountryCode: Maybe Text
    - contactMobileNumber: Maybe Text
    - contactEmail: Maybe Text
    - derive: "'HideSecrets"
  AcceptFleetAssignmentReqV2: # accept an offer to work on a fleet; when it is a handover, say whose contact the fleet keeps
    - assignmentId: Text
    - useMyContact: Maybe Bool
    - derive: "'HideSecrets"
  FleetCreateResV2:
    - fleetId: Text
    - recordType: NewType
  FleetOwnerRegisterResV2:
    - enabled: Bool
    - recordType: NewType
  FleetBankAccountLinkResp:
    - chargesEnabled: Bool
    - payoutsEnabled: Maybe Bool
    - detailsSubmitted: Bool
    - accountLink: BaseUrl
    - accountUrlExpiry: UTCTime
    - paymentMode: PaymentMode
  FleetBankAccountResp:
    - chargesEnabled: Bool
    - payoutsEnabled: Maybe Bool
    - detailsSubmitted: Bool
    - paymentMode: PaymentMode
    - requirements: Maybe RequirementsInfo
    - futureRequirements: Maybe RequirementsInfo
    - stripeLegalEntityName: Maybe Text
  FleetOwnerUpdateLanguageReq:
    - language: Language
    - derive: "'HideSecrets"
  FleetOwnerLanguageRes:
    - language: Maybe Language

extraOperations:
  - EXTRA_API_TYPES_FILE
