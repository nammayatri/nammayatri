imports:
  LatLong: Kernel.External.Maps.Types
  Driver: Dashboard.Common
  VehicleVariant: Domain.Types.VehicleVariant

module: LiveMap

apis:
  - GET:
      endpoint: /drivers/{radius}
      appServerHandler: custom
      auth: ApiAuthV2
      params:
        radius: Meters
      query:
        - fleetOwnerId: Text
        - driverIdForRadius: Id Driver
        - point: LatLong
      response:
        type: "[MapDriverInfoRes]"
      helperApi:
        - GET:
            endpoint: /drivers/{radius}/{requestorId}
            auth: ApiAuthV2
            params:
              radius: Meters
              requestorId: Text
            query:
              - fleetOwnerId: Text
              - driverIdForRadius: Id Driver
              - point: LatLong
            response:
              type: "[MapDriverInfoRes]"
  - GET:
      endpoint: /demandHotspots
      appServerHandler: custom
      auth: ApiAuthV2
      response:
        type: DemandHotspotsResp
      migrate:
        capability: fleet.live.read

types:
  MapDriverInfoRes:
    - driverName: Text
    - driverStatus: Maybe Status
    - vehicleNumber: Text
    - vehicleVariant: VehicleVariant
    - vehicleMake: Maybe Text
    - vehicleModel: Maybe Text
    - vehicleColor: Maybe Text
    - vehicleIconURL: Maybe Text
    - profilePhotoImageId: Maybe Text
    - position: LatLong
    - mobileCountryCode: Text
    - mobileNumber: Text
    - rideRelatedInfo: RideRelatedInfo
  Status:
    - enum: ON_PICKUP, ON_RIDE, ACTIVE, INACTIVE, ONLINE, SILENT, OFFLINE
  RideRelatedInfo:
    - tripStartTime: Maybe UTCTime
    - fare: Maybe HighPrecMoney
    - source: Text
    - destination: Text
  DemandHotspotsResp:
    - createdAt: UTCTime
    - expiryAt: UTCTime
    - hotspotsDetails: "[DemandHotspotDetails]"
  DemandHotspotDetails:
    - frequency: Int
    - location: LatLong
    - categories: "[DemandHotspotCategory]"
  DemandHotspotCategory:
    - tripOption: Text
    - isScheduled: Bool
    - frequency: Int
