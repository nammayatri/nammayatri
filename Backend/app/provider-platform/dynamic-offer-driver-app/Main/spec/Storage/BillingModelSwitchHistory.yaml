imports:
  Merchant: Domain.Types.Merchant
  MerchantOperatingCity: Domain.Types.MerchantOperatingCity
  Person: Domain.Types.Person
  ServiceNames: Domain.Types.Extra.Plan
  UTCTime: Kernel.Prelude
  Text: Kernel.Prelude
  Bool: Kernel.Prelude

BillingModelSwitchHistory:
  tableName: billing_model_switch_history

  types:
    BillingModelSwitchSource:
      enum: "DRIVER, DASHBOARD"
      derive': "Show, Eq, Ord, Read, Generic, ToJSON, FromJSON, ToSchema"

  domainInstance:
    - Custom Kernel.Beam.Lib.UtilsTH.mkBeamInstancesForEnum <BillingModelSwitchSource>

  fields:
    id: Id BillingModelSwitchHistory
    driverId: Id Person
    fromModel: ServiceNames
    toModel: ServiceNames
    source: BillingModelSwitchSource
    requestedBy: Maybe Text # dashboard user for a DASHBOARD switch; the driver themselves otherwise
    acknowledgedUnusedCredits: Bool # driver confirmed that prepaid credits they still hold go unused while on YATRI_SUBSCRIPTION
    merchantId: Id Merchant
    merchantOperatingCityId: Id MerchantOperatingCity
    createdAt: UTCTime
    updatedAt: UTCTime

  constraints:
    id: PrimaryKey
    driverId: SecondaryKey

  queries:
    findLatestByDriverId:
      kvFunction: findAllWithOptionsKV
      where: driverId
      orderBy:
        field: createdAt
        order: desc
