imports:
  Person: Domain.Types.Person
  Merchant: Domain.Types.Merchant
  MerchantOperatingCity: Domain.Types.MerchantOperatingCity
  UTCTime: Kernel.Prelude
  EncryptedHashedField: Kernel.External.Encryption
  DbHash: Kernel.External.Encryption
  Day: Data.Time

StclMembership:
  tableName: stcl_membership
  fields:
    id: Id StclMembership
    driverId: Id Person
    applicationId: Text
    shortId: Maybe Text
    firstName: Text
    lastName: Text
    memberCategory: Text
    numberOfShares: Int
    applicationCount: Maybe Int
    shareStartCount: Maybe Int
    shareEndCount: Maybe Int
    dateOfBirth: Day
    panNumber: EncryptedHashedField e Text
    mobileNumber: EncryptedHashedField e Text
    emailId: Text
    fatherMotherName: Maybe Text
    addressStreetAddress1: Text
    addressStreetAddress2: Maybe Text
    addressCity: Text
    addressState: Text
    addressPostalCode: Text
    addressProofType: Maybe Text
    addressProofImageId: Maybe Text
    bankName: Maybe Text
    bankBranch: Maybe Text
    accountNumber: Maybe (EncryptedHashedField e Text)
    ifscCode: Maybe (EncryptedHashedField e Text)
    vehicleType: Maybe Text
    fuelTypes: "[Text]"
    nomineeName: Maybe Text
    declarationPlace: Maybe Text
    declarationDate: Day
    declarationSignature: Text
    termsAccepted: Bool
    status: ApplicationStatus
    paymentStatus: Maybe Text
    isAdditionalSharePurchase: Maybe Bool
    merchantId: Id Merchant
    merchantOperatingCityId: Id MerchantOperatingCity
    createdAt: UTCTime
    updatedAt: UTCTime
  types:
    ApplicationStatus:
      enum: "SUBMITTED,PENDING,APPROVED,REJECTED"
  default:
    status: "'SUBMITTED'"
    fatherMotherName: "NULL"
    bankName: "NULL"
    bankBranch: "NULL"
    accountNumberEncrypted: "NULL"
    accountNumberHash: "NULL"
    ifscCodeEncrypted: "NULL"
    ifscCodeHash: "NULL"
    vehicleType: "NULL"
    nomineeName: "NULL"
    declarationPlace: "NULL"
  constraints:
    id: PrimaryKey
    driverId: SecondaryKey
    applicationId: SecondaryKey
    panNumberHash: "!SecondaryKey"
    mobileNumberHash: "!SecondaryKey"
    accountNumberHash: "!SecondaryKey"
  beamFields:
    panNumber:
      panNumberEncrypted: Text
      panNumberHash: DbHash
    mobileNumber:
      mobileNumberEncrypted: Text
      mobileNumberHash: DbHash
    accountNumber:
      accountNumberEncrypted: Maybe Text
      accountNumberHash: Maybe DbHash
    ifscCode:
      ifscCodeEncrypted: Maybe Text
      ifscCodeHash: Maybe DbHash
  fromTType:
    panNumber: EncryptedHashed (Encrypted panNumberEncrypted) panNumberHash|E
    mobileNumber: EncryptedHashed (Encrypted mobileNumberEncrypted) mobileNumberHash|E
    accountNumber: EncryptedHashed <$> (Encrypted <$> accountNumberEncrypted) <*> accountNumberHash|E
    ifscCode: EncryptedHashed <$> (Encrypted <$> ifscCodeEncrypted) <*> ifscCodeHash|E
  toTType:
    panNumberEncrypted: (unEncrypted . (.encrypted) $ panNumber)|E
    panNumberHash: ((.hash) panNumber)|E
    mobileNumberEncrypted: (unEncrypted . (.encrypted) $ mobileNumber)|E
    mobileNumberHash: ((.hash) mobileNumber)|E
    accountNumberEncrypted: accountNumber <&> unEncrypted . (.encrypted)|E
    accountNumberHash: accountNumber <&> (.hash)|E
    ifscCodeEncrypted: ifscCode <&> unEncrypted . (.encrypted)|E
    ifscCodeHash: ifscCode <&> (.hash)|E
  sqlType:
    panNumberEncrypted: character varying(255)
    panNumberHash: bytea
    mobileNumberEncrypted: character varying(255)
    mobileNumberHash: bytea
    accountNumberEncrypted: character varying(255)
    accountNumberHash: bytea
    ifscCodeEncrypted: character varying(255)
    ifscCodeHash: bytea
    fuelTypes: text[]
  queries:
    findById:
      kvFunction: findOneWithKV
      where: id
    findByDriverId:
      kvFunction: findAllWithKV
      where: driverId
    findByApplicationId:
      kvFunction: findOneWithKV
      where: applicationId
    findByShortId:
      kvFunction: findOneWithKV
      where: shortId
    findByDriverIdAndStatus:
      kvFunction: findAllWithKV
      where:
        and: [driverId, status]
    updateStatus:
      kvFunction: updateOneWithKV
      params: [status, updatedAt]
      where: id
    updateStatusAndPaymentStatus:
      kvFunction: updateOneWithKV
      params: [status, paymentStatus, updatedAt]
      where: id
  extraOperations:
    - EXTRA_QUERY_FILE

