imports:
  Merchant: Domain.Types.Merchant
  MerchantOperatingCity: Domain.Types.MerchantOperatingCity
  Translation: IssueManagement.Common
  Value: Data.Aeson

RideFeedbackConfig:
  tableName: ride_feedback_config

  # One row = one during-ride feedback question for one city: its content, timing and actions.
  # Which questions a ride gets is decided by the RIDE-FEEDBACK logic in app_dynamic_logic_element
  # (version chosen per city by app_dynamic_logic_rollout), not by this table. The table is a Config
  # Pilot config (RideFeedbackConfig): edits are versioned patches, staged and concluded there.
  fields:
    id: Id RideFeedbackConfig
    merchantId: Id Merchant
    merchantOperatingCityId: Id MerchantOperatingCity
    questionKey: Text
    questionType: RideFeedbackQuestionType
    title: "[Translation]"
    description: Maybe [Translation]
    options: Maybe [QuestionOption]
    inputConfig: Maybe InputConfig
    acknowledgement: Maybe [Translation]
    iconUrl: Maybe Text # image on the right of the question card
    uiConfig: Maybe Value
    isSkippable: Maybe Bool
    isFollowUpOnly: Maybe Bool
    stages: Maybe [RideFeedbackStage] # where in the journey it can be asked; booking and ride stages are not mixed
    displayTrigger: Maybe DisplayTrigger
    actionRules: Maybe [FeedbackActionRule]
    priority: Maybe Int
    enabled: Bool
    createdAt: UTCTime
    updatedAt: UTCTime

  types:
    RideFeedbackQuestionType:
      enum: "SINGLE_SELECT,MULTI_SELECT,YES_NO,STAR_RATING,EMOJI_SCALE,THUMBS,SCALE,TEXT_INPUT,NUMBER_INPUT,IMAGE_UPLOAD,AUDIO"
      derive: "Bounded, Enum"

    # Mirrored in rider-app's SharedLogic.RideFeedback.Types, which runs the actions: add new values on both sides.
    RideFeedbackActionType:
      enum: "REPORT_ISSUE_TO_BPP,CREATE_TICKET,L0_SENSITIVE_WORD_CHECK,SLACK_ALERT,NOTIFY_RIDER,SAFETY_ESCALATION"
      derive: "Bounded, Enum"

    QuestionOption:
      key: Text
      label: "[Translation]"
      iconUrl: Maybe Text
      nextQuestionKey: Maybe Text
      requiresText: Maybe Bool
      isExclusive: Maybe Bool
      score: Maybe Double # 0 (bad) to 1 (good): the answer_score of picking it; not set = not scored

    InputConfig:
      placeholder: Maybe [Translation]
      minLength: Maybe Int
      maxLength: Maybe Int
      minValue: Maybe Double
      maxValue: Maybe Double
      step: Maybe Double
      minSelections: Maybe Int
      maxSelections: Maybe Int
      maxFiles: Maybe Int
      maxDurationSec: Maybe Int
      minLabel: Maybe [Translation]
      maxLabel: Maybe [Translation]

    # Where a booking's journey is when a question is asked. Booking stages come before any driver
    # (answers are about the booking, once per journey); ride stages have a ride and its driver
    # (answers are about that ride, once per ride).
    RideFeedbackStage:
      enum: "BOOKING_CONFIRMED,AWAITING_REASSIGNMENT,RIDE_ASSIGNED,RIDE_IN_PROGRESS"
      derive: "Bounded, Enum"

    DisplayTrigger:
      showAfterSecondsFromBooking: Maybe Int
      showAfterSecondsFromRideStart: Maybe Int
      showAfterSecondsFromAssign: Maybe Int
      autoDismissAfterSeconds: Maybe Int

    FeedbackAction:
      actionType: RideFeedbackActionType
      params: Maybe Value

    FeedbackActionRule:
      ruleId: Text
      condition: Maybe Value
      actions: "[FeedbackAction]"

  beamType:
    title: Value
    description: Maybe Value
    options: Maybe Value
    inputConfig: Maybe Value
    acknowledgement: Maybe Value
    stages: Maybe [Text]
    displayTrigger: Maybe Value
    actionRules: Maybe Value

  sqlType:
    questionKey: text
    questionType: text
    title: json
    description: json
    options: json
    inputConfig: json
    acknowledgement: json
    uiConfig: json
    stages: "text[]"
    displayTrigger: json
    actionRules: json

  default:
    enabled: "false"

  toTType:
    title: Data.Aeson.toJSON title|E
    description: Data.Aeson.toJSON <$> description|E
    options: Data.Aeson.toJSON <$> options|E
    inputConfig: Data.Aeson.toJSON <$> inputConfig|E
    acknowledgement: Data.Aeson.toJSON <$> acknowledgement|E
    stages: map Kernel.Prelude.show <$> stages|E
    displayTrigger: Data.Aeson.toJSON <$> displayTrigger|E
    actionRules: Data.Aeson.toJSON <$> actionRules|E

  fromTType:
    title: Kernel.Prelude.fromMaybe [] (Kernel.Utils.JSON.valueToMaybe title)|E
    description: Kernel.Utils.JSON.valueToMaybe =<< description|E
    options: Kernel.Utils.JSON.valueToMaybe =<< options|E
    inputConfig: Kernel.Utils.JSON.valueToMaybe =<< inputConfig|E
    acknowledgement: Kernel.Utils.JSON.valueToMaybe =<< acknowledgement|E
    stages: Kernel.Prelude.mapMaybe (Kernel.Prelude.readMaybe . Data.Text.unpack) <$> stages|E
    displayTrigger: Kernel.Utils.JSON.valueToMaybe =<< displayTrigger|E
    actionRules: Kernel.Utils.JSON.valueToMaybe =<< actionRules|E

  constraints:
    id: PrimaryKey

  extraIndexes:
    - columns: [merchantOperatingCityId, questionKey]
      unique: true

  queries:
    findById:
      kvFunction: findOneWithKV
      where: id

    findAllByMerchantOperatingCityId:
      kvFunction: findAllWithKV
      where: merchantOperatingCityId

    findAllByMerchantOperatingCityIdAndEnabled:
      kvFunction: findAllWithKV
      where:
        and: [merchantOperatingCityId, enabled]

  extraOperations:
    - GENERATE_INDEXES
