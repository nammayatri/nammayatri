imports:
  Merchant: Domain.Types.Merchant
  MerchantOperatingCity: Domain.Types.MerchantOperatingCity
  Person: Domain.Types.Person
  VehicleCategory: Domain.Types.VehicleCategory

FleetDriverAssociation:
  tableName: fleet_driver_association

  fields:
    id: Id FleetDriverAssociation
    driverId: Id Person
    isActive: Bool
    fleetOwnerId: Text
    associatedOn: Maybe UTCTime
    associatedTill: Maybe UTCTime
    onboardingVehicleCategory: Maybe VehicleCategory
    onboardedOperatorId: Maybe (Id Person)
    requestReason: Maybe Text
    enableCashRide: Maybe Bool
    responseReason: Maybe Text
    docsVerificationStatusUpdatedAt: Maybe UTCTime # Copy of driver_information's, kept in step by its flag writers; a fleet's driver list without other filters sorts by it.
    consentGiven: Maybe Bool
    consentValidTill: Maybe UTCTime
    merchantId: Maybe (Id Merchant)
    merchantOperatingCityId: Maybe (Id MerchantOperatingCity)
    createdAt: UTCTime
    updatedAt: UTCTime

  constraints:
    id: PrimaryKey
    driverId: "!SecondaryKey"
    fleetOwnerId: "!SecondaryKey"

  queries:
    deleteByDriverId:
      kvFunction: deleteWithKV
      where: driverId
    deleteByFleetOwnerId:
      kvFunction: deleteWithKV
      where: fleetOwnerId
    deleteById:
      kvFunction: deleteWithKV
      where: id
    updateRideConsent:
      kvFunction: updateOneWithKV
      params: [consentGiven, consentValidTill]
      where: id

  sqlType:
    id: text
    driverId: text
    fleetOwnerId: text

  extraOperations:
    - EXTRA_QUERY_FILE

  excludedFields: [merchantOperatingCityId, merchantId, createdAt, updatedAt]
