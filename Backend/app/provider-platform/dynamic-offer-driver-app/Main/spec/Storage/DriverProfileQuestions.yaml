imports:
  Merchant: Domain.Types.Merchant
  MerchantOperatingCity: Domain.Types.MerchantOperatingCity
  Person: Domain.Types.Person
  Value: Data.Aeson

DriverProfileQuestions:
  tableName: driver_profile_questions

  types:
    SelfDeclarationValueReq:
      questionId: Text
      question: Text
      answerId: "[Text]"
      answer: "[Text]"

  fields:
    driverId : Id Person
    hometown : Maybe Text
    pledges : "[Text]"
    aspirations : "Maybe [Text]"
    vehicleTags : "Maybe [Text]"
    createdAt : UTCTime
    updatedAt : UTCTime
    drivingSince : Maybe Int
    aboutMe: "Maybe Text"
    imageIds: "Maybe [Text]"
    selfDeclarations: "Maybe [SelfDeclarationValueReq]"
    merchantOperatingCityId : Id MerchantOperatingCity

  beamType:
    selfDeclarations: Maybe Value

  fromTType:
    selfDeclarations: Kernel.Utils.JSON.valueToMaybe =<< selfDeclarations|E

  toTType:
    selfDeclarations: Data.Aeson.toJSON <$> selfDeclarations|E

  sqlType:
    selfDeclarations: json

  default:
    imageIds: "'{}'"
    pledges: "'{}'"
    aspirations: "'{}'"
    vehicleTags: "'{}'"

  constraints:
    driverId : PrimaryKey

  extraOperations:
    - EXTRA_QUERY_FILE

  queries:
    findByPersonId:
      kvFunction: findOneWithKV
      where: driverId
    updateMerchantOperatingCityIdByDriverId:
      kvFunction: updateWithKV
      params: [merchantOperatingCityId]
      where: driverId

  excludedFields: [merchantId, merchantOperatingCityId, createdAt, updatedAt]
