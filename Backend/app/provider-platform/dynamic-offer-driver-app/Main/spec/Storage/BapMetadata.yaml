imports:
  Person: Domain.Types.Person
  Ride: Domain.Types.Ride
  HighPrecMoney: Kernel.Types.Common
  Merchant: Domain.Types.Merchant
  MerchantOperatingCity: Domain.Types.MerchantOperatingCity
  Text: Data.Text
  BaseUrl: Servant.Client.Core
  showBaseUrl: Kernel.Prelude
  parseBaseUrl: Kernel.Prelude

BapMetadata:
  tableName: bap_metadata

  fields:
    id : Id BapMetadata
    name : Text
    logoUrl : Maybe BaseUrl
    domain: Maybe Text # TODO: Use Domain type here
    merchantId: Maybe (Id Merchant) # ONDC 2.1.0 pilot: the single (merchant, city) this BAP is piloted in; ops-set, NULL for everyone else
    merchantOperatingCityId: Maybe (Id MerchantOperatingCity)
    staticTermsUrl : Maybe BaseUrl
    offlineContract : Maybe Bool # OFFLINE_CONTRACT tag echoed on BAP_TERMS/BPP_TERMS -- one fact about this BAP's deal with us, not a per-vehicle-category BecknConfig setting
    enableOndcScheduledRideSupport : Maybe Bool
    supportEmail : Maybe Text
    supportPhone : Maybe Text
    supportUrl : Maybe BaseUrl

  constraints:
    id: PrimaryKey

  queries:
    findById:
      kvFunction: findOneWithKV
      where: id

    findAllBySubscriberIdAndDomain:
      kvFunction: findAllWithKV
      where:
        and: [id, domain]

    findBySubscriberIdDomainAndCity:
      kvFunction: findOneWithKV
      where:
        and: [id, domain, merchantOperatingCityId]

    updateStaticTermsUrlBySubscriberIdDomainAndCity:
      kvFunction: updateWithKV
      params: [staticTermsUrl]
      where:
        and: [id, domain, merchantOperatingCityId]

  beamType:
    logoUrl: Maybe Text
    staticTermsUrl: Maybe Text
    supportUrl: Maybe Text

  toTType:
    logoUrl: (Kernel.Prelude.fmap showBaseUrl)|I
    staticTermsUrl: (Kernel.Prelude.fmap showBaseUrl)|I
    supportUrl: (Kernel.Prelude.fmap showBaseUrl)|I

  fromTType:
    logoUrl: (Kernel.Prelude.maybe (return Kernel.Prelude.Nothing) (Kernel.Prelude.fmap Kernel.Prelude.Just . parseBaseUrl))|MI
    staticTermsUrl: (Kernel.Prelude.maybe (return Kernel.Prelude.Nothing) (Kernel.Prelude.fmap Kernel.Prelude.Just . parseBaseUrl))|MI
    supportUrl: (Kernel.Prelude.maybe (return Kernel.Prelude.Nothing) (Kernel.Prelude.fmap Kernel.Prelude.Just . parseBaseUrl))|MI

  sqlType:
    id: character varying(255)
