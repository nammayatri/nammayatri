imports:
  UTCTime: Kernel.Prelude
  Person: Domain.Types.Person
  Merchant: Domain.Types.Merchant
  MerchantOperatingCity: Domain.Types.MerchantOperatingCity

DriverRouteTrip:
  tableName: driver_route_trip

  fields:
    id: Id DriverRouteTrip
    driverId: Id Person
    routeCode: Text
    source: DriverRouteTripSource
    idempotencyKey: Text
    rideId: Maybe Text
    vehicleNumber: Maybe Text
    merchantId: Id Merchant
    merchantOperatingCityId: Id MerchantOperatingCity
    createdAt: UTCTime
    updatedAt: UTCTime

  types:
    DriverRouteTripSource:
      enum: "INFERRED, CONFIRMED"
      derive': "Show, Eq, Ord, Read, Generic, ToJSON, FromJSON, ToSchema, ToParamSchema"

  domainInstance:
    - Custom Kernel.Beam.Lib.UtilsTH.mkBeamInstancesForEnumAndList <DriverRouteTripSource>

  sqlType:
    source: text

  constraints:
    id: PrimaryKey
    driverId: SecondaryKey
    idempotencyKey: SecondaryKey

  queries:
    findAllByDriverIdAndCityCreatedSince:
      kvFunction: findAllWithOptionsKV
      where:
        and:
          - driverId
          - merchantOperatingCityId
          - gte:
              - createdAt: since
      orderBy:
        field: createdAt
        order: desc

    findByIdempotencyKey:
      kvFunction: findOneWithKV
      where: idempotencyKey

  extraIndexes:
    - columns: [driverId, createdAt]

  extraOperations:
    - GENERATE_INDEXES

  default:
    createdAt: "CURRENT_TIMESTAMP"
    updatedAt: "CURRENT_TIMESTAMP"
