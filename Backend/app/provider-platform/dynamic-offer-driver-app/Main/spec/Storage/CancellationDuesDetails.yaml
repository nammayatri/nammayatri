imports:
  Merchant: Domain.Types.Merchant
  MerchantOperatingCity: Domain.Types.MerchantOperatingCity
  Ride: Domain.Types.Ride
  RiderDetails: Domain.Types.RiderDetails
  TaxBreakup: BecknV2.OnDemand.FareBreakup.Tax
  Value: Data.Aeson

CancellationDuesDetails:
  tableName: cancellation_dues_details
  derives: Generic

  types:
    CancellationDuesPaymentStatus:
      enum: "PENDING,PAID,WAIVED"

  fields:
    id : Id CancellationDuesDetails
    rideId : Id Ride
    riderId : Id RiderDetails
    cancellationAmount : HighPrecMoney
    cancellationFee : Maybe HighPrecMoney
    cancellationFeeTax : Maybe HighPrecMoney
    cancellationCommission : Maybe HighPrecMoney
    cancellationFeeTaxBreakup : Maybe TaxBreakup
    cancellationCommissionTaxBreakup : Maybe TaxBreakup
    paymentCharge : Maybe HighPrecMoney
    paymentChargeTaxBreakup : Maybe TaxBreakup
    currency : Currency
    paymentStatus : CancellationDuesPaymentStatus
    cancellationConsequenceRowId : Maybe Text
    cancellationCollectionMode : Maybe Text
    createdAt : UTCTime
    updatedAt : UTCTime

  beamType:
    cancellationFeeTaxBreakup: Maybe Value
    cancellationCommissionTaxBreakup: Maybe Value
    paymentChargeTaxBreakup: Maybe Value

  beamFields:
    currency:
      currency: Maybe Currency

  fromTType:
    currency: Kernel.Prelude.fromMaybe Kernel.Types.Common.INR|I
    cancellationFeeTaxBreakup: Kernel.Utils.JSON.valueToMaybe =<< cancellationFeeTaxBreakup|E
    cancellationCommissionTaxBreakup: Kernel.Utils.JSON.valueToMaybe =<< cancellationCommissionTaxBreakup|E
    paymentChargeTaxBreakup: Kernel.Utils.JSON.valueToMaybe =<< paymentChargeTaxBreakup|E

  toTType:
    currency: Kernel.Prelude.Just|I
    cancellationFeeTaxBreakup: toJSON <$> cancellationFeeTaxBreakup|E
    cancellationCommissionTaxBreakup: toJSON <$> cancellationCommissionTaxBreakup|E
    paymentChargeTaxBreakup: toJSON <$> paymentChargeTaxBreakup|E

  constraints:
    id: PrimaryKey
    rideId: SecondaryKey

  sqlType:
    cancellationAmount: integer
    cancellationFeeTaxBreakup: "json"
    cancellationCommissionTaxBreakup: "json"
    paymentChargeTaxBreakup: "json"

  extraOperations:
    - EXTRA_QUERY_FILE

  queries:
    findByRideId:
      kvFunction: findOneWithKV
      where:
        rideId

    updatePaymentStatusByRideId:
      kvFunction: updateOneWithKV
      params: [paymentStatus]
      where:
        rideId
