      request:
        type: UpdateVehicleReq
      response:
        type: VehicleChange
      helperApiExtra:
        query:
          - requestorId: Text
        actorInfo: requestorId

  - PUT:
      endpoint: /dutyGroups/{dutyGroupId}/crew
      name: TransitOperatorV2UpdateDutyGroupCrew
      auth: ApiAuthV2
      migrate:
        capability: transit-operations.waybill.write
      params:
        dutyGroupId: Text
      mandatoryQuery:
        - vehicleCategory: VehicleCategory
      request:
        type: UpdateCrewReq
      response:
        type: DutyGroupDetail
      helperApiExtra:
        query:
          - requestorId: Text
        actorInfo: requestorId

  - PUT:
      endpoint: /dutyGroups/{dutyGroupId}/active
      name: TransitOperatorV2SetDutyGroupActive
      auth: ApiAuthV2
      migrate:
        capability: transit-operations.waybill.write
      params:
        dutyGroupId: Text
      mandatoryQuery:
        - vehicleCategory: VehicleCategory
      request:
        type: SetActiveReq
      response:
        type: DutyGroup
      helperApiExtra:
        query:
          - requestorId: Text
        actorInfo: requestorId

  - PUT:
      endpoint: /duties/{dutyId}/crew
      name: TransitOperatorV2UpdateDutyCrew
      auth: ApiAuthV2
      migrate:
        capability: transit-operations.waybill.write
      params:
        dutyId: Text
      mandatoryQuery:
