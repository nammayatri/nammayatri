        actorInfo: requestorId

  - PUT:
      endpoint: /dutyGroups/{dutyGroupId}/vehicle
      name: TransitOperatorV2UpdateDutyGroupVehicle
      auth: ApiAuthV2
      migrate:
        capability: transit-operations.waybill.write
      params:
        dutyGroupId: Text
      mandatoryQuery:
