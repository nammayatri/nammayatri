        actorInfo: requestorId

  - GET:
      endpoint: /generationFailures
      name: TransitOperatorV2ListGenerationFailures
      auth: ApiAuthV2
      migrate:
        capability: transit-operations.master.read
      mandatoryQuery:
        - vehicleCategory: VehicleCategory
      query:
        - limit: Int
        - offset: Int
