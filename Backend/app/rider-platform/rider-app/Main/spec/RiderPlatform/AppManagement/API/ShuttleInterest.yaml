imports:
  UTCTime: Data.Time
  DayOfWeek: Data.Time.Calendar
  TimeOfDay: Data.Time.LocalTime
  Person: Domain.Types.Person
  PassOrganization: Domain.Types.PassOrganization
  ShuttleTripType: Domain.Types.ShuttleInterest

importPackageOverrides:
  Domain.Types.Person: "rider-app"
  Domain.Types.PassOrganization: "rider-app"
  Domain.Types.ShuttleInterest: "rider-app"

module: ShuttleInterest

# Control centre: corporate shuttle interest forms, as a table and as points for a map. Scoped to the dashboard's city.
# A company is a corporate pass organisation; pass its passOrganizationId (or one of its email domains as companyDomain,
# e.g. acme.example) to filter to one company.
types:
  ShuttleInterestItem:
    personId: Id Person
    employeeName: Maybe Text
    passOrganizationId: Id PassOrganization
    companyName: Maybe Text
    companyDomain: Text
    pickupLat: Double
    pickupLon: Double
    pickupAddress: Text
    dropLat: Double
    dropLon: Double
    dropAddress: Text
    tripType: ShuttleTripType
    pickupTime: Maybe TimeOfDay
    dropTime: Maybe TimeOfDay
    daysOfWeek: "[DayOfWeek]"
    createdAt: UTCTime
    updatedAt: UTCTime

  ShuttleInterestListResp:
    interests: "[ShuttleInterestItem]"
    limit: Int
    offset: Int

  ShuttleInterestMapPoint:
    personId: Id Person
    passOrganizationId: Id PassOrganization
    companyDomain: Text
    tripType: ShuttleTripType
    pickupLat: Double
    pickupLon: Double
    dropLat: Double
    dropLon: Double

  ShuttleInterestMapResp:
    points: "[ShuttleInterestMapPoint]"

  # The city's corporate shuttle routes, planned from the interest forms (the same plan the GTFS download gives): every
  # route with its stops in order and its trips.
  ShuttlePublishedStop:
    stopCode: Text
    name: Text
    lat: Double
    lon: Double
    sequence: Int
    minutesFromStart: Maybe Int # from the route's first stop

  # A published trip on the day asked for (or on every day it runs, when no day is asked for).
  ShuttlePublishedTripInfo:
    tripId: Text
    departure: Text # HH:MM from the route's first stop
    days: "[Text]" # lower-case day names the trip runs (just the asked day when a day is asked for)
    riders: Int # employees planned on it (on the asked day; else the most on any day)

  ShuttlePublishedRoute:
    routeCode: Text # CORP-<ORG>-<n>
    shortName: Text
    name: Text # the GTFS long name: the stops in order
    tripCount: Maybe Int
    firstDeparture: Maybe Text # HH:MM of the route's first trip
    stops: "[ShuttlePublishedStop]"
    trips: "[ShuttlePublishedTripInfo]" # its trips (on the asked day), from the published timetable
    passOrganizationId: Id PassOrganization
    fareAmount: HighPrecMoney # seat fare for every forward stop pair
    shape: "[[Double]]" # the route along the roads, [lat, lon] points (the GTFS shape)

  # The city's GTFS feed (corp_<city>), to load into the GIMS editor (new feed from a zip, or reload the feed). Also saves
  # the routes' seat fares.
  ShuttleRoutesPublishResp:
    fileName: Text # <city>.corp_shuttle.gtfs.zip
    gtfsZipBase64: Text

  ShuttlePublishedRoutesResp:
    feedKey: Maybe Text # corp_<city>, or none when the city has no published corporate feed
    routes: "[ShuttlePublishedRoute]"

apis:
  - GET:
      endpoint: /list
      auth: ApiAuthV2
      migrate:
        capability: corporate-shuttle.interest.read
      query:
        - passOrganizationId: Id PassOrganization
        - companyDomain: Text
        - limit: Int
        - offset: Int
      response:
        type: ShuttleInterestListResp
  - GET:
      endpoint: /mapPoints
      auth: ApiAuthV2
      migrate:
        capability: corporate-shuttle.interest.read
      query:
        - passOrganizationId: Id PassOrganization
        - companyDomain: Text
      response:
        type: ShuttleInterestMapResp
  - GET:
      endpoint: /publishedRoutes
      auth: ApiAuthV2
      migrate:
        capability: corporate-shuttle.interest.read
      query:
        - day: Text # e.g. monday: only the routes with a trip that day, with that day's trips
      response:
        type: ShuttlePublishedRoutesResp
  - POST:
      endpoint: /shuttleRoutes/publish
      auth: ApiAuthV2
      migrate:
        capability: corporate-shuttle.routes.write
      response:
        type: ShuttleRoutesPublishResp
