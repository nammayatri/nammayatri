  ScheduleList: Lib.BmsBackend.Transit.V1.Types
  CreateScheduleReq: Lib.BmsBackend.Transit.V1.Types
  UpdateScheduleReq: Lib.BmsBackend.Transit.V1.Types
  ScheduleType: Lib.BmsBackend.Transit.V1.Types
  ScheduleTypeItems: Lib.BmsBackend.Transit.V1.Types
  ScheduleTrip: Lib.BmsBackend.Transit.V1.Types
  ScheduleTripList: Lib.BmsBackend.Transit.V1.Types
  CreateScheduleTripReq: Lib.BmsBackend.Transit.V1.Types
  UpdateScheduleTripReq: Lib.BmsBackend.Transit.V1.Types
  RepeatConfig: Lib.BmsBackend.Transit.V1.Types
