importPackageOverrides:
  BecknV2.OnDemand.Enums: "beckn-spec"
  Lib.BmsBackend.Transit.Common: "bms-backend"
  Lib.BmsBackend.Transit.V1.Types: "bms-backend"

module: TransitOperatorV2V1
apiPrefix: transitOperatorV2

types: {}

apis:
  - GET:
      endpoint: /v1/schedules
      name: TransitV1ListSchedules
      auth: ApiAuthV2
      migrate:
        capability: transit-operations.master.read
      mandatoryQuery:
        vehicleCategory: VehicleCategory
      query:
        search: Text
        depotId: Text
        routeId: Text
        status: Text
        limit: Int
        offset: Int
      response:
        type: ScheduleList
      helperApiExtra:
        query:
          - requestorId: Text
        actorInfo: requestorId

  - POST:
      endpoint: /v1/schedules
      name: TransitV1CreateSchedule
      auth: ApiAuthV2
      migrate:
        capability: transit-operations.waybill.write
      mandatoryQuery:
        vehicleCategory: VehicleCategory
      request:
        type: CreateScheduleReq
      response:
        type: Schedule
      helperApiExtra:
        query:
          - requestorId: Text
        actorInfo: requestorId

  - GET:
      endpoint: /v1/schedules/{scheduleId}
      name: TransitV1GetSchedule
      auth: ApiAuthV2
      migrate:
        capability: transit-operations.master.read
      params:
        scheduleId: Text
      mandatoryQuery:
        vehicleCategory: VehicleCategory
      response:
        type: Schedule
      helperApiExtra:
        query:
          - requestorId: Text
        actorInfo: requestorId

