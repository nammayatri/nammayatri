module: TransitOperatorV2Masters
apiPrefix: transitOperatorV2

types:
  GtfsRoute:
    id: Text
    number: Maybe Text
    name: Maybe Text
    mode: Maybe Text
    tripCount: Maybe Int
    stopCount: Maybe Int
  GtfsRouteStop:
    sequenceNum: Int
    stopCode: Text
    name: Maybe Text
    lat: Double
    lon: Double
    stageNumber: Maybe Int
    isStageStop: Bool
  GtfsStop:
    code: Text
    name: Maybe Text
    lat: Double
    lon: Double
    routeCodes: "[Text]"
  TransitPerson:
    id: Text
    firstName: Text
    lastName: Text
    email: Maybe Text
    mobileNumber: Text
    mobileCountryCode: Text
    organizationId: Maybe Text
  TransitPersonList:
    items: "[TransitPerson]"
    total: Int

