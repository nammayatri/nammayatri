module: TransitOperator
apiPrefix: transitOperator

apis:
  - GET:
      endpoint: /row
      name: TransitOperatorGetRow
      auth: ApiAuthV2
      mandatoryQuery:
        vehicleCategory: VehicleCategory
        table: NandiTable
      query:
        column: Text
      response:
        type: NandiRow

  - GET:
      endpoint: /allRows
      name: TransitOperatorGetAllRows
      auth: ApiAuthV2
      mandatoryQuery:
        vehicleCategory: VehicleCategory
        table: NandiTable
      query:
        limit: Int
        offset: Int
      response:
        type: "[NandiRow]"

  - DELETE:
      endpoint: /row
      name: TransitOperatorDeleteRow
      auth: ApiAuthV2
      mandatoryQuery:
        vehicleCategory: VehicleCategory
        table: NandiTable
      request:
        type: Value
      response:
        type: RowsAffectedResp

  - POST:
      endpoint: /row
      name: TransitOperatorUpsertRow
      auth: ApiAuthV2
      mandatoryQuery:
        vehicleCategory: VehicleCategory
        table: NandiTable
      query:
        toRegen: Text
      request:
        type: Value
      response:
        type: NandiRow

  - POST:
      endpoint: /rows
      auditRequestBody: false
      name: TransitOperatorUpsertRows
      auth: ApiAuthV2
      mandatoryQuery:
        vehicleCategory: VehicleCategory
        table: NandiTable
      query:
        toRegen: Text
      request:
        type: "[Value]"
      response:
        type: "[NandiRow]"

  - POST:
      endpoint: /queryRow
      name: TransitOperatorQueryRows
      auth: ApiAuthV2
      mandatoryQuery:
        vehicleCategory: VehicleCategory
        table: NandiTable
      request:
        type: QueryBody
      response:
        type: "[NandiRow]"

  - GET:
      endpoint: /serviceTypes
      name: TransitOperatorGetServiceTypes
      auth: ApiAuthV2
      mandatoryQuery:
        vehicleCategory: VehicleCategory
      response:
        type: "[ServiceType]"

  - GET:
      endpoint: /routes
      name: TransitOperatorGetRoutes
      auth: ApiAuthV2
      mandatoryQuery:
        vehicleCategory: VehicleCategory
      response:
        type: "[NandiRoute]"

  - GET:
      endpoint: /depots
      name: TransitOperatorGetDepots
      auth: ApiAuthV2
      mandatoryQuery:
        vehicleCategory: VehicleCategory
      response:
        type: "[Depot]"

  - GET:
      endpoint: /shiftTypes
      name: TransitOperatorGetShiftTypes
      auth: ApiAuthV2
