      response:
        type: APISuccess

  - GET:
      endpoint: /stops/search
      name: TransitOperatorSearchStops
      auth: ApiAuthV2
      mandatoryQuery:
        vehicleCategory: VehicleCategory
        q: Text
      query:
        limit: Int
        withRoutes: Bool
      response:
        type: "[EnrichedStop]"

  - GET:
      endpoint: /stops/nearby
      name: TransitOperatorNearbyStops
      auth: ApiAuthV2
      mandatoryQuery:
        vehicleCategory: VehicleCategory
        lat: Double
        lon: Double
      query:
        radius: Double
        limit: Int
        withRoutes: Bool
      response:
