      name: TransitOperatorGetConductor
      auth: ApiAuthV2
      mandatoryQuery:
        vehicleCategory: VehicleCategory
        token: Text
      response:
        type: Employee

  - GET:
      endpoint: /driver
      name: TransitOperatorGetDriver
      auth: ApiAuthV2
      mandatoryQuery:
        vehicleCategory: VehicleCategory
        token: Text
      response:
