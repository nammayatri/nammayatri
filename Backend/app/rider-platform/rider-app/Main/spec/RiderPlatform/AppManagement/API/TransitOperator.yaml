  - GET:
      endpoint: /tabletIds
      name: TransitOperatorGetTabletIds
      auth: ApiAuthV2
      mandatoryQuery:
        vehicleCategory: VehicleCategory
      response:
        type: "[Text]"

  - GET:
      endpoint: /operators
      name: TransitOperatorGetOperators
      auth: ApiAuthV2
      mandatoryQuery:
        vehicleCategory: VehicleCategory
