  - GET:
      endpoint: /queryVehicle
      name: TransitOperatorQueryVehicle
      auth: ApiAuthV2
      migrate:
        capability: transit-operations.master.read
      mandatoryQuery:
        vehicleCategory: VehicleCategory
      query:
        vehicleNo: Text
        tagNumber: Text
        fleetNo: Text
      response:
        type: "[Fleet]"

  - POST:
      endpoint: /upsertVehicles
      name: TransitOperatorUpsertVehicles
      auth: ApiAuthV2
      migrate:
        capability: transit-operations.master.write
      mandatoryQuery:
        vehicleCategory: VehicleCategory
      request:
        type: "[VehicleUpsertRequest]"
      response:
        type: "[Fleet]"

  - DELETE:
      endpoint: /deleteVehicle
      name: TransitOperatorDeleteVehicle
      auth: ApiAuthV2
      migrate:
        capability: transit-operations.master.write
      mandatoryQuery:
        vehicleCategory: VehicleCategory
        vehicleId: Text
      response:
        type: RowsAffectedResp

  - GET:
      endpoint: /scheduleTrip/{scheduleTripId}/repeat
      name: TransitOperatorGetScheduleTripRepeat
      auth: ApiAuthV2
      migrate:
        capability: transit-operations.master.read
      mandatoryQuery:
        vehicleCategory: VehicleCategory
      params:
        scheduleTripId: Text
      response:
        type: ScheduleTripRepeatConfig

  - POST:
      endpoint: /scheduleTrip/{scheduleTripId}/repeat
      name: TransitOperatorSetScheduleTripRepeat
      auth: ApiAuthV2
      migrate:
        capability: transit-operations.master.write
      mandatoryQuery:
        vehicleCategory: VehicleCategory
      params:
        scheduleTripId: Text
      request:
        type: SetScheduleTripRepeatReq
      response:
        type: ScheduleTripRepeatConfig

  # ── transitV2 (GIMS /internal/operator/{gtfs_id}/v2) ─────────────────────
  # Typed models: SharedLogic.External.Nandi.TransitV2Types (same JSON as GIMS
  # services/operator_v2.rs). `operatorId` scopes the call (sent as x-operator-id); the dashboard
  # person is sent as x-actor-person-id.

  - GET:
      endpoint: /v2/tripGroups
      name: TransitOperatorV2ListTripGroups
      auth: ApiAuthV2
