        capability: transit-operations.master.read
      mandatoryQuery:
        vehicleCategory: VehicleCategory
      query:
        search: Text
        operatorId: Text
        limit: Int
        offset: Int
        shift: Text
        depotId: Text
        code: Text
        zone: Text
        tripType: Text
        vehicleNumber: Text
        driverTokenNumber: Text
        conductorTokenNumber: Text
      response:
        type: V2TripGroupPage
      helperApiExtra:
        query:
          - requestorId: Text
        actorInfo: requestorId

  - POST:
      endpoint: /v2/tripGroups/upsert
      name: TransitOperatorV2UpsertTripGroup
      auth: ApiAuthV2
      auditRequestBody: false
      migrate:
        capability: transit-operations.master.write
