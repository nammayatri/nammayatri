imports:
  BookingStatus: Domain.Types.BookingStatus
  MessageKey: Domain.Types.MerchantMessage
  Person: Domain.Types.Person
  BookingListResV2: Domain.Action.UI.Booking
  Integer: EulerHS.Prelude
  JourneyStatus: Domain.Types.Journey
  Journey: Domain.Types.Journey
  BookingRequestType: Domain.Types.Booking.API
  MultimodalCancelStatusResp: API.Types.UI.MultimodalConfirm
  FRFSRescheduleReq: API.Types.UI.FRFSTicketService

importPackageOverrides:
  Domain.Types.Person: "rider-app"
  Domain.Types.Booking.API: "rider-app"
  Domain.Action.UI.Booking: "rider-app"
  Domain.Types.Journey: "rider-app"
  Domain.Types.BookingStatus: "beckn-spec"
  API.Types.UI.MultimodalConfirm: "rider-app"
  API.Types.UI.FRFSTicketService: "rider-app"

module: MultiModal

apis:
  - GET:
      endpoint: /list/
      auth: ApiAuthV2
      query:
        - limit: Integer
        - offset: Integer
        - bookingOffset: Integer
        - journeyOffset: Integer
        - customerPhoneNo: Text
        - countryCode: Text
        - email: Text
        - fromDate: Integer
        - toDate: Integer
        - rideStatus: [BookingStatus]
        - journeyStatus: [JourneyStatus]
        - isPaymentSuccess: Bool
        - bookingRequestType: BookingRequestType
        - customerId: Text
      response:
        type: BookingListResV2
  - POST:
      endpoint: /sendMessage/{customerId}/
      auditRequestBody: false
      auth: ApiAuthV2
      params:
        customerId: Text
      request:
        type: CustomerSendMessageReq
      response:
        type: APISuccess
  - POST:
      endpoint: /sendDirectMessage/
      auth: ApiAuthV2
      request:
        type: CustomerSendDirectMessageReq
      response:
        type: APISuccess
  - POST:
      endpoint: /addComment/{customerId}/
      auditRequestBody: false
      auth: ApiAuthV2
      params:
        customerId: Text
      request:
        type: CustomerCommentReq
      response:
        type: APISuccess
  - GET:
      endpoint: /getComments/{customerId}/
      auth: ApiAuthV2
      params:
        customerId: Text
      response:
        type: CustomerCommentsResp
  - POST:
      endpoint: /customer/{customerId}/multimodal/{journeyId}/order/{legOrder}/softCancel
      auth: ApiAuthV2
      params:
        customerId: Id Person
        journeyId: Id Journey
        legOrder: Int
      response:
        type: Kernel.Types.APISuccess.APISuccess
      migrate:
        capability: city-operations.multimodal.execute
  - GET:
      endpoint: /customer/{customerId}/multimodal/{journeyId}/order/{legOrder}/cancel/status
      auth: ApiAuthV2
      params:
        customerId: Id Person
        journeyId: Id Journey
        legOrder: Int
      response:
        type: MultimodalCancelStatusResp
      migrate:
        capability: city-operations.multimodal.execute
  - POST:
      endpoint: /customer/{customerId}/multimodal/{journeyId}/order/{legOrder}/cancel
      auth: ApiAuthV2
      params:
        customerId: Id Person
        journeyId: Id Journey
        legOrder: Int
      response:
        type: Kernel.Types.APISuccess.APISuccess
      migrate:
        capability: city-operations.multimodal.execute
  - POST:
      endpoint: /customer/{customerId}/multimodal/{journeyId}/order/{legOrder}/reschedule
      auditRequestBody: false
      auth: ApiAuthV2
      params:
        customerId: Id Person
        journeyId: Id Journey
        legOrder: Int
      request:
        type: FRFSRescheduleReq
      response:
        type: Kernel.Types.APISuccess.APISuccess
      migrate:
        capability: city-operations.multimodal.execute
types:
  CustomerSendMessageReq:
    title: Text
    message: Text
    messageKey: Maybe MessageKey
    variables: Maybe [(Kernel.Prelude.Text, Kernel.Prelude.Text)]
    channel: MediaChannel
  MediaChannel:
    - enum: WHATSAPP, PUSH_NOTIFICATION, SMS, EMAIL
  CustomerSendDirectMessageReq:
    titleKey: Maybe MessageKey
    messageKey: MessageKey
    variables: Maybe [(Kernel.Prelude.Text, Kernel.Prelude.Text)]
    channel: MediaChannel
    destination: Text
    derive: "'HideSecrets"
  CustomerCommentReq:
    body: Text
  CustomerCommentsResp:
    customerId: Id Person
    comments: Maybe [TranslatedText]
