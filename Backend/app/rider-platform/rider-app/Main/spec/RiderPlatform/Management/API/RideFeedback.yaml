imports:
  APISuccess: Kernel.Types.APISuccess
  Ride: Dashboard.Common

# During-ride feedback is managed in the driver platform (questions, targeting, answers). rider-app runs
# the actions an answer triggers, so retrying failed ones is the only rider-side management API.
module: RideFeedback

types: {}

apis:
  # POST /rideFeedback/ride/{rideId}/response/{responseId}/retryActions
  # rideId and responseId are the driver platform's ids, as shown in the dashboard's Ride inspector.
  - POST:
      endpoint: /ride/{rideId}/response/{responseId}/retryActions
      auth: ApiAuthV2
      params:
        rideId: Id Ride
        responseId: Text
      response:
        type: APISuccess
      migrate:
        capability: system-config.ride_feedback.write
