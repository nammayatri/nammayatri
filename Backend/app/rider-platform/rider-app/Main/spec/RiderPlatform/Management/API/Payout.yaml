imports:
  PayoutOrderResp: Lib.Payment.API.Payout.Types

importPackageOverrides:
  Lib.Payment.API.Payout.Types: payment

module: Payout
# requestorId/actorInfo applied for each api by default
# for overwrite helperApiExtra/helperApi can be specified for each api separately
default:
  helperApiExtra:
    query:
      - requestorId: Text
    actorInfo: requestorId

types:
  RetriggerPayoutStatus:
    - enum: "RESENT, TRIGGERED, ALREADY_TRIGGERED, ALREADY_RETRIGGERED, ORDER_NOT_FOUND, NOT_E09, UNSUPPORTED_TYPE, STATUS_CHECK_FAILED, NO_VPA, NOTHING_PENDING, FAILED"
  RetriggerPayoutReq:
    - orderIds: [Text]
    - derive: "'HideSecrets"
  RetriggerPayoutResult:
    - orderId: Text
    - customerId: Maybe Text
    - entityName: Maybe Text
    - status: RetriggerPayoutStatus
    - message: Maybe Text
  RetriggerPayoutResp:
    - results: [RetriggerPayoutResult]

apis:
  - GET:
      endpoint: /payout/order/{payoutOrderId}
      auth: ApiAuthV2
      params:
        payoutOrderId: Text
      response:
        type: PayoutOrderResp
  - POST:
      endpoint: /payout/retrigger
      auth: ApiAuthV2
      request:
        type: RetriggerPayoutReq
      response:
        type: RetriggerPayoutResp
      migrate:
        capability: finance.payout.write
