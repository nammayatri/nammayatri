imports:
  APISuccess: Kernel.Types.APISuccess
  Value: Data.Aeson
  UTCTime: Kernel.Prelude
  AppFeedbackPlacement: Domain.Types.AppFeedbackConfig
  AppFeedbackSubjectType: Domain.Types.AppFeedbackResponse
  FeedbackQuestionType: Lib.Feedback.Types
  FeedbackResponseStatus: Lib.Feedback.Types
  FeedbackAnswer: Lib.Feedback.Types
  FeedbackActionResult: Lib.Feedback.Types

# App feedback in one merchant + city. The questions (app_feedback_config) are a Config Pilot table,
# managed through the generic nammaTag/configPilot APIs; which riders get a question is the APP-FEEDBACK
# logic (NammaTag APIs). These are the inspector (what a rider would be asked, and what they answered),
# the placements, and retrying failed actions.
module: AppFeedback

types:
  AppFeedbackMetaRes:
    placements: "[AppFeedbackPlacementInfo]"
    uiLayouts: "[Text]"
    supportedOperators: "[Text]"

  AppFeedbackPlacementInfo:
    placement: AppFeedbackPlacement
    subjectType: AppFeedbackSubjectType

  # What the rider would be asked at the placement now, and why each question is in or out.
  AppFeedbackPreviewRes:
    placement: AppFeedbackPlacement
    subjectType: AppFeedbackSubjectType
    subjectId: Text
    logicVersion: Maybe Int
    selectedQuestionKeys: "[Text]"
    nextAllowedAt: Maybe UTCTime
    context: Value
    evaluations: "[AppFeedbackEvaluation]"

  AppFeedbackEvaluation:
    configId: Text
    questionKey: Text
    eligible: Bool
    isFollowUp: Bool
    reason: Maybe Text

  AppFeedbackResponseRes:
    id: Text
    configId: Text
    questionKey: Text
    questionType: FeedbackQuestionType
    placement: AppFeedbackPlacement
    subjectType: AppFeedbackSubjectType
    subjectId: Text
    logicVersion: Maybe Int
    configPilotVersions: Maybe [Int]
    status: FeedbackResponseStatus
    answer: Maybe FeedbackAnswer
    answerScore: Maybe Double
    actionResults: Maybe [FeedbackActionResult]
    createdAt: UTCTime
    updatedAt: UTCTime

apis:
  # GET /appFeedback/meta
  - GET:
      endpoint: /meta
      auth: ApiAuthV2
      response:
        type: AppFeedbackMetaRes
      migrate:
        capability: system-config.ride_feedback.read

  # GET /appFeedback/inspect/{customerId}/preview?placement=HOME&subjectId=...
  - GET:
      endpoint: /inspect/{customerId}/preview
      auth: ApiAuthV2
      params:
        customerId: Text
      mandatoryQuery:
        placement: AppFeedbackPlacement
      query:
        subjectId: Text
      response:
        type: AppFeedbackPreviewRes
      migrate:
        capability: system-config.ride_feedback.read

  # GET /appFeedback/inspect/{customerId}/responses (the rider's latest answers, newest first)
  - GET:
      endpoint: /inspect/{customerId}/responses
      auth: ApiAuthV2
      params:
        customerId: Text
      response:
        type: "[AppFeedbackResponseRes]"
      migrate:
        capability: system-config.ride_feedback.read

  # POST /appFeedback/response/{responseId}/retryActions
  - POST:
      endpoint: /response/{responseId}/retryActions
      auth: ApiAuthV2
      params:
        responseId: Text
      response:
        type: APISuccess
      migrate:
        capability: system-config.ride_feedback.write
