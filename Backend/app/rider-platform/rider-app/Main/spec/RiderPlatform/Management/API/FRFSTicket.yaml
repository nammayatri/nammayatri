imports:
  Text: Data.Text
  APISuccess: Kernel.Types.APISuccess
  VehicleCategory: BecknV2.FRFS.Enums
  ServiceTierType: BecknV2.FRFS.Enums
  LatLong: Kernel.External.Maps.Types
  FilePath: EulerHS.Prelude
  TimeBound: Kernel.Types.TimeBound
  StationType: Domain.Types.StationType
  IntegratedBPPConfig: Dashboard.Common
  FRFSTicketBooking: Dashboard.Common
  PlatformType: Dashboard.Common
  HighPrecMoney: Kernel.Types.Common

module: FRFSTicket
types:
  FRFSDashboardRouteAPI:
    code: Text
    shortName: Text
    longName: Text
    startPoint: LatLong
    endPoint: LatLong
    integratedBppConfigId: Id IntegratedBPPConfig
    routeTag: Maybe Text

  FRFSRouteReq:
    shortName: Text
    longName: Text
    color: Maybe Text
    startPoint: LatLong
    endPoint: LatLong
    timeBounds: TimeBound
    polyline: Maybe Text
    derive: "'HideSecrets"

  FRFSStartStopsAPI:
    name: Text
    code: Text
    lat: Maybe Double
    lon: Maybe Double

  FRFSEndStopsFareAPI:
    name: Text
    code: Text
    amount: HighPrecMoney
    currency: Currency
    lat: Maybe Double
    lon: Maybe Double

  FRFSStopFareMatrixAPI:
    startStop: "FRFSStartStopsAPI"
    endStops: "[FRFSEndStopsFareAPI]"

  FRFSRouteFareAPI:
    code: Text
    shortName: Text
    longName: Text
    fares: "[FRFSStopFareMatrixAPI]"

  FRFSStationAPI:
    name: Text
    code: Text
    lat: Maybe Double
    lon: Maybe Double
    address: Maybe Text
    regionalName: Maybe Text
    hindiName: Maybe Text
    integratedBppConfigId: Id IntegratedBPPConfig
    derive: "Show"

  FRFSStationReq:
    name: Text
    lat: Double
    lon: Double
    address: Maybe Text
    possibleTypes: Maybe [StationType]
    derive: "'HideSecrets"

  UpsertRouteFareReq:
    recordType: NewType
    file: FilePath
    derive: "'HideSecrets"

  UpsertRouteFareResp:
    unprocessedRouteFares: [Text]
    success: Text

  # A null routeTag is the catch-all fare, charged for any route GIMS reports without a tag.
  FRFSStageFareAPI:
    serviceTier: ServiceTierType
    routeTag: Maybe Text
    stage: Int
    amount: HighPrecMoney
    cessCharge: Maybe HighPrecMoney
    currency: Currency
    derive: "Show,Eq"

  UpsertStageFareReq:
    recordType: NewType
    file: FilePath
    derive: "'HideSecrets"

  UpsertStageFareResp:
    unprocessedStageFares: [Text]
    success: Text

  FRFSStatusUpdateReq:
    recordType: NewType
    bookingIds: "[Id FRFSTicketBooking]"
    derive: "'HideSecrets"

  TripCancelAction:
    enum: "CANCEL,NOT_AFFECTED"

  TripCancelPaymentMode:
    enum: "ONLINE,PASS,PASS_PARTIAL"

  TripCancelStop:
    code: Text
    name: Maybe Text
    seq: Maybe Int

  TripCancelBookingPreview:
    bookingId: Id FRFSTicketBooking
    riderId: Text
    fromStop: TripCancelStop
    toStop: TripCancelStop
    quantity: Int
    paymentMode: TripCancelPaymentMode
    refundAmount: HighPrecMoney
    passTripsCredited: Int
    multimodalOrder: Bool
    checkedIn: Bool
    action: TripCancelAction

  TripCancelStopBreakdown:
    stop: TripCancelStop
    bookings: Int
    passengers: Int
    refundAmount: HighPrecMoney
    passTripsCredited: Int

  TripCancelSummary:
    totalBookings: Int
    toCancel: Int
    passengersToCancel: Int
    totalRefundAmount: HighPrecMoney
    passTripsCredited: Int
    checkedInToCancel: Int
    notAffected: Int

  TripCancelOperation:
    operationId: Text
    tripId: Text
    stopCode: Maybe Text
    reason: Maybe Text
    actorId: Maybe Text
    status: Text
    requested: Int
    cancelled: Maybe Int
    failed: Maybe Int
    createdAt: UTCTime

  TripCancelPreviewResp:
    tripId: Text
    cutoffStop: Maybe TripCancelStop
    summary: TripCancelSummary
    stopBreakdown: "[TripCancelStopBreakdown]"
    bookings: "[TripCancelBookingPreview]"
    cancellations: "[TripCancelOperation]"

  TripCancelReq:
    stopCode: Maybe Text
    reason: Text
    bookingIds: "[Id FRFSTicketBooking]"
    derive: "'HideSecrets"

  TripCancelResp:
    accepted: Int

  TripCancelBookingStatus:
    bookingId: Id FRFSTicketBooking
    bookingStatus: Text
    refundStatus: Maybe Text
    refundAmount: Maybe HighPrecMoney
    passTripsCredited: Int
    fromStop: TripCancelStop
    toStop: TripCancelStop
    quantity: Int

  TripCancelStatusResp:
    tripId: Text
    cancellations: "[TripCancelOperation]"
    cancelled: Int
    refundPending: Int
    refunded: Int
    refundFailed: Int
    stillPending: Int
    bookings: "[TripCancelBookingStatus]"

  FRFSGtfsStopAPI:
    code: Text
    name: Maybe Text
    lat: Maybe Double
    lon: Maybe Double
    derive: "Show,Eq"

  FRFSGtfsRouteAPI:
    code: Text
    shortName: Text
    vehicleType: Maybe Text
    variant: Maybe Text
    derive: "Show,Eq"

  FRFSGtfsRouteStopAPI:
    routeCode: Text
    stopCode: Text
    sequenceNum: Int
    stopType: Maybe Text
    derive: "Show,Eq"

  FRFSGtfsFareAPI:
    code: Text
    name: Maybe Text
    providerCode: Maybe Text
    validityDuration: Maybe Text
    derive: "Show,Eq"

  FRFSGtfsRes:
    integratedBppConfigId: Id IntegratedBPPConfig
    ready: Bool
    routes: [FRFSGtfsRouteAPI]
    stops: [FRFSGtfsStopAPI]
    routeStops: [FRFSGtfsRouteStopAPI]
    fares: [FRFSGtfsFareAPI]
    derive: "Show"

apis:
  - GET: # Get list of all the FRFS routes
      endpoint: /frfs/routes
      auth: ApiAuthV2
      mandatoryQuery:
        vehicleType: VehicleCategory
        limit: Int
        offset: Int
      query:
        searchStr: Text
      response:
        type: "[FRFSDashboardRouteAPI]"
  - GET: # Get list of stop fares for a Route
      endpoint: /frfs/route/fare/{routeCode}/list
      mandatoryQuery:
        vehicleType: VehicleCategory
        integratedBppConfigId: Id IntegratedBPPConfig
      params:
        routeCode: Text
      auth: ApiAuthV2
      response:
        type: "FRFSRouteFareAPI"
  - PUT: # Upsert fares for Route through CSV
      endpoint: /frfs/route/fare/{routeCode}/upsert
      mandatoryQuery:
        vehicleType: VehicleCategory
        integratedBppConfigId: Id IntegratedBPPConfig
      params:
        routeCode: Text
      multipart:
        type: UpsertRouteFareReq
      auth: ApiAuthV2
      response:
        type: UpsertRouteFareResp
  - GET: # Stage fare grid for the city, across service tiers and route types
      endpoint: /frfs/stageFare/list
      mandatoryQuery:
        vehicleType: VehicleCategory
      auth: ApiAuthV2
      response:
        type: "[FRFSStageFareAPI]"
      migrate:
        capability: transit-operations.master.read
  - PUT: # Upsert the stage fare grid through CSV
      endpoint: /frfs/stageFare/upsert
      mandatoryQuery:
        vehicleType: VehicleCategory
        integratedBppConfigId: Id IntegratedBPPConfig
      multipart:
        type: UpsertStageFareReq
      auth: ApiAuthV2
      response:
        type: UpsertStageFareResp
      migrate:
        capability: transit-operations.master.write
  - GET: # List all stations
      endpoint: /frfs/route/stations
      mandatoryQuery:
        vehicleType: VehicleCategory
        limit: Int
        offset: Int
      query:
        searchStr: Text
      auth: ApiAuthV2
      response:
        type: "[FRFSStationAPI]"

  - GET:
      endpoint: /frfs/gtfs
      auth: ApiAuthV2
      mandatoryQuery:
        vehicleType: VehicleCategory
      query:
        integratedBppConfigId: Id IntegratedBPPConfig
        platformType: PlatformType
      response:
        type: FRFSGtfsRes

  - POST: # FRFS Status Update (proxies internal/frfs/statusUpdate)
      endpoint: /frfs/statusUpdate
      auth: ApiAuthV2
      request:
        type: FRFSStatusUpdateReq
      response:
        type: APISuccess
      helperApiExtra:
        query:
          - requestorId: Text
        actorInfo: requestorId

  - GET:
      endpoint: /frfs/trip/{tripId}/cancel/preview
      auth: ApiAuthV2
      params:
        tripId: Text
      query:
        stopCode: Text
      response:
        type: TripCancelPreviewResp
      migrate:
        capability: transit-operations.trip.execute

  - POST:
      endpoint: /frfs/trip/{tripId}/cancel
      auth: ApiAuthV2
      params:
        tripId: Text
      request:
        type: TripCancelReq
      response:
        type: TripCancelResp
      helperApiExtra:
        query:
          - requestorId: Text
        actorInfo: requestorId
      migrate:
        capability: transit-operations.trip.execute

  - GET:
      endpoint: /frfs/trip/cancellations
      auth: ApiAuthV2
      mandatoryQuery:
        fromDate: UTCTime
        toDate: UTCTime
      query:
        limit: Int
        offset: Int
      response:
        type: "[TripCancelOperation]"
      migrate:
        capability: transit-operations.trip.execute

  - GET:
      endpoint: /frfs/trip/{tripId}/cancel/status
      auth: ApiAuthV2
      params:
        tripId: Text
      response:
        type: TripCancelStatusResp
      migrate:
        capability: transit-operations.trip.execute

extraOperations:
  - EXTRA_API_TYPES_FILE
