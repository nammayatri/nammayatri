imports:
  Text: Data.Text
  Person: Domain.Types.Person
  Ride: Domain.Types.Ride
  UTCTime: Kernel.Prelude
  APISuccess: Kernel.Types.APISuccess
  HighPrecMeters: Kernel.Types.Common
  Summary: Dashboard.Common
  Value: Data.Aeson
  InvoiceStatus: Lib.Finance.Domain.Types.Invoice
  InvoiceType: Domain.Types.Invoice

importPackageOverrides:
  Domain.Types.Invoice: "beckn-spec"

module: Invoice
types:
  InvoiceRes:
    date: UTCTime
    rideStartTime: UTCTime
    rideEndTime: UTCTime
    totalAmount: Text
    shortRideId: Text
    driverName: Text
    vehicleNumber: Text
    source: Text
    destination: Text
    faresList: "[FareBreakup]"
    chargeableDistance: Maybe HighPrecMeters
    chargeableDistanceWithUnit: Maybe Distance

  FareBreakup:
    title: Text
    price: Text

  # Rider-side (BAP) finance_invoice register; field names mirror the BPP
  # FinanceManagement InvoiceListItem so the dashboard can render both alike.
  FinanceInvoiceListRes:
    totalItems: Int
    summary: Summary
    invoices: "[FinanceInvoiceListItem]"

  FinanceInvoiceListItem:
    invoiceId: Text
    invoiceNumber: Text
    invoiceType: InvoiceType
    invoiceDate: UTCTime
    invoiceStatus: InvoiceStatus
    counterpartyType: Text
    counterpartyId: Text
    taxableValue: Maybe HighPrecMoney
    gstRate: Maybe Double
    gstAmount: Maybe HighPrecMoney
    cgstAmount: Maybe HighPrecMoney
    sgstAmount: Maybe HighPrecMoney
    igstAmount: Maybe HighPrecMoney
    totalInvoiceValue: HighPrecMoney
    irn: Maybe Text
    qrCode: Maybe Text
    rideId: Maybe Text
    supplierName: Maybe Text
    supplierAddress: Maybe Text
    supplierGstin: Maybe Text
    supplierTaxNo: Maybe Text
    supplierId: Maybe Text
    merchantGstin: Maybe Text
    issuedToName: Maybe Text
    issuedToAddress: Maybe Text
    issuedByName: Maybe Text
    issuedByAddress: Maybe Text
    gstinOfParty: Maybe Text
    sacCode: Maybe Text
    paymentMethod: Maybe Text
    taxableValueOfServiceSupplied: Maybe HighPrecMoney
    lineItems: Value
    generatedAt: UTCTime
    taxRate: Maybe Double
    issuedToTaxNo: Maybe Text
    issuedByTaxNo: Maybe Text

  FinanceInvoicePdfRes:
    pdfBase64: Text
    invoiceNumber: Text

apis:
  # GET /invoice
  - GET:
      endpoint: /invoice
      auth: ApiAuthV2 # TODO changed from APP_BACKEND to APP_BACKEND_MANAGEMENT, test access and url
      mandatoryQuery:
        from: UTCTime
        to: UTCTime
        phoneNumber: Text
      response:
        type: "[InvoiceRes]"
      migrate:
        userActionType: ApiAuth APP_BACKEND CUSTOMERS INVOICE
  # GET /invoice/finance/list (module prefix adds /invoice)
  - GET:
      endpoint: /finance/list
      auth: ApiAuthV2
      query:
        limit: Int
        offset: Int
        invoiceId: Text
        invoiceNumber: Text
        from: UTCTime
        to: UTCTime
        invoiceType: InvoiceType
        status: InvoiceStatus
      response:
        type: FinanceInvoiceListRes
      migrate:
        capability: finance.report.read

  # GET /invoice/finance/pdf
  - GET:
      endpoint: /finance/pdf
      auth: ApiAuthV2
      mandatoryQuery:
        invoiceId: Text
      response:
        type: FinanceInvoicePdfRes
      migrate:
        capability: finance.report.read
