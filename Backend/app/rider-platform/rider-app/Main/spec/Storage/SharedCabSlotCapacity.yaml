imports:
  Merchant: Domain.Types.Merchant
  MerchantOperatingCity: Domain.Types.MerchantOperatingCity

# Shuttle subscription: seats on one slot route (one route per departure time, e.g. A-B 7:30), set by ops. A rider can reschedule a day onto a slot only
# while the riders booked on it for that day are fewer than this. One row per (city, route); the dashboard upsert keeps it so.
SharedCabSlotCapacity:
  tableName: shared_cab_slot_capacity

  derives: "Show, Generic, ToJSON, FromJSON, Eq"

  fields:
    id: Id SharedCabSlotCapacity
    routeId: Text
    capacity: Int
    merchantId: Id Merchant
    merchantOperatingCityId: Id MerchantOperatingCity

  constraints:
    id: PrimaryKey
    routeId: SecondaryKey

  queries:
    findByRouteIdAndMerchantOperatingCityId:
      kvFunction: findOneWithKV
      where:
        and:
          - routeId
          - merchantOperatingCityId

    findAllByMerchantOperatingCityId:
      kvFunction: findAllWithKV
      where: merchantOperatingCityId

    updateCapacityById:
      kvFunction: updateOneWithKV
      params: [capacity]
      where: id
