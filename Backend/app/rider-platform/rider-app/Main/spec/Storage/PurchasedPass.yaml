imports:
  Merchant: Domain.Types.Merchant
  MerchantOperatingCity: Domain.Types.MerchantOperatingCity
  Person: Domain.Types.Person
  PassType: Domain.Types.PassType
  Pass: Domain.Types.Pass
  PaymentOrder: Lib.Payment.Domain.Types.PaymentOrder
  HighPrecMoney: Kernel.Types.Common
  FRFSVehicleServiceTier: Domain.Types.FRFSVehicleServiceTier
  ServiceTierType: BecknV2.FRFS.Enums
  VehicleCategory: BecknV2.FRFS.Enums
  BenefitType: Domain.Types.PurchasedPass
  PassEnum: Domain.Types.PassType
  MediaFile: IssueManagement.Domain.Types.MediaFile
  Version: Kernel.Types.Version
  OverrideBenefitConfig: Domain.Types.PassOverrideConfig
  Value: Data.Aeson

PurchasedPass:
  tableName: purchased_pass

  types:
    StatusType:
      enum: "Pending,Active,PreBooked,Failed,Expired,RefundPending,RefundInitiated,Refunded,RefundFailed,PhotoPending"
      derive': "Show, Eq, Ord, Read, Generic, ToJSON, FromJSON, ToSchema, Kernel.Prelude.ToParamSchema"

    BenefitType:
      enum: "FullSaving,FixedSaving,PercentageSaving"
      derive': "Show, Eq, Ord, Read, Generic, ToJSON, FromJSON, ToSchema"

  domainInstance:
    - Custom Kernel.Beam.Lib.UtilsTH.mkBeamInstancesForEnum <StatusType>
    - Custom Kernel.Utils.TH.mkFromHttpInstanceForEnum <StatusType>
    - Custom Kernel.Utils.TH.mkToHttpInstanceForEnum <StatusType>
    - Custom Kernel.Beam.Lib.UtilsTH.mkBeamInstancesForEnum <BenefitType>
    - Custom Kernel.Utils.TH.mkFromHttpInstanceForEnum <BenefitType>

  fields:
    id: Id PurchasedPass
    passNumber: Int
    personId: Id Person
    startDate: Day
    endDate: Day
    passTypeId: Id PassType
    deviceId: Text
    deviceSwitchCount: Int
    passCode: Text
    passName: Maybe Text
    passDescription: Maybe Text
    passAmount: HighPrecMoney
    verificationValidity: Seconds
    benefitDescription: Text
    benefitType: Maybe BenefitType
    benefitValue: Maybe HighPrecMoney
    applicableVehicleServiceTiers: "[ServiceTierType]"
    vehicleType: VehicleCategory
    maxValidTrips: Maybe Int
    maxValidDays: Maybe Int
    usedTripCount: Maybe Int
    status: StatusType
    merchantId: Id Merchant
    merchantOperatingCityId: Id MerchantOperatingCity
    profilePicture: Maybe Text
    passPhotoMediaId: Maybe (Id MediaFile)
    preferredSource: Maybe Text
    preferredDestination: Maybe Text
    currentPaymentOrderId: Maybe (Id PaymentOrder)
    activatedAt: Maybe UTCTime

  beamType:
    vehicleType: Maybe VehicleCategory
    deviceSwitchCount: Maybe Int
    verificationValidity: Maybe Seconds

  fromTType:
    vehicleType: Kernel.Prelude.fromMaybe BecknV2.FRFS.Enums.BUS|I
    deviceSwitchCount: (fromMaybe 0 deviceSwitchCount)|E
    verificationValidity: Kernel.Prelude.fromMaybe 9000|I

  toTType:
    vehicleType: Kernel.Prelude.Just|I
    deviceSwitchCount: Just deviceSwitchCount|E
    verificationValidity: Just verificationValidity|E

  sqlType:
    applicableVehicleServiceTiers: text[]

  constraints:
    id: PrimaryKey
    passNumber: SecondaryKey
    personId: SecondaryKey

  extraOperations:
    - EXTRA_QUERY_FILE
    - GENERATE_INDEXES

  queries:
    updateDeviceSwitchCount:
      kvFunction: updateWithKV
      params: [deviceSwitchCount]
      where: id

    updatePersonIdById:
      kvFunction: updateOneWithKV
      params: [personId]
      where: id

    findByPassNumber:
      kvFunction: findOneWithKV
      where: passNumber

    updatePrefSrcAndDestById:
      kvFunction: updateWithKV
      params: [preferredSource, preferredDestination]
      where: id

    updatePassPhotoMediaIdById:
      kvFunction: updateWithKV
      params: [passPhotoMediaId]
      where: id

    findAllByPersonIdsAndStatus:
      kvFunction: findAllWithKV
      where:
        and:
          - in: [personId]
          - status

    updateActivatedAt:
      kvFunction: updateOneWithKV
      params: [activatedAt]
      where: id

PurchasedPassPayment:
  tableName: purchased_pass_payment

  types:
    # A day the rider will not travel on a shuttle term: the daily issue job skips it and the trip goes back on the counter.
    SkipDay:
      day: Day
      reason: Maybe Text
      derive': "Generic, Show, Eq, ToJSON, FromJSON, ToSchema"

    # A day of a shuttle term moved to another slot (reschedule): the daily issue job books that day on this route.
    SlotChange:
      day: Day
      routeId: Text
      derive': "Generic, Show, Eq, ToJSON, FromJSON, ToSchema"

  fields:
    id: Id PurchasedPassPayment
    orderId: Id PaymentOrder
    passCode: Text
    passName: Maybe Text
    purchasedPassId: Id PurchasedPass
    amount: HighPrecMoney
    benefitDescription: Text
    isDashboard: Maybe Bool
    benefitType: Maybe BenefitType
    benefitValue: Maybe HighPrecMoney
    personId: Id Person
    startDate: Day
    status: Domain.Types.PurchasedPass.StatusType
    endDate: Day
    merchantId: Id Merchant
    merchantOperatingCityId: Id MerchantOperatingCity
    profilePicture: Maybe Text
    passPhotoMediaId: Maybe (Id MediaFile)
    passEnum: Maybe PassEnum
    clientSdkVersion: Maybe Version
    passId: Maybe (Id Pass)
    availableTripCount: Maybe Int
    passPhotoChangeCount: Maybe Int
    activatedAt: Maybe UTCTime
    overrideBenefitConfigJson: Maybe OverrideBenefitConfig
    sourceStopCode: Maybe Text
    destinationStopCode: Maybe Text
    maximumOverrideableFarePerTicket: Maybe HighPrecMoney
    validityDays: Maybe Int
    # Shared cab subscription: the slot route this term rides daily. Each departure time is its own route (A-B 7:30 and
    # A-B 8:30 have different route ids), so the route fixes the time. On the payment row
    # (one row per term) beside sourceStopCode/destinationStopCode, so a renewal can pick a different slot.
    routeId: Maybe Text
    # Days of this term the rider skipped/paused; read whole by the daily issue job. Small per-term list, so json not a table.
    skipDays: "[SkipDay]"
    # Days of this term moved to another slot; any other day rides routeId.
    slotChanges: "[SlotChange]"

  beamType:
    benefitDescription: Maybe Text
    clientSdkVersion: Maybe Text
    overrideBenefitConfigJson: Maybe Value
    skipDays: Maybe Value
    slotChanges: Maybe Value

  fromTType:
    benefitDescription: Kernel.Prelude.fromMaybe ""|I
    clientSdkVersion: mapM Kernel.Utils.Version.readVersion (Data.Text.strip <$> clientSdkVersion)|EM
    overrideBenefitConfigJson: (overrideBenefitConfigJson >>= Kernel.Utils.JSON.valueToMaybe)|E
    skipDays: (Kernel.Prelude.fromMaybe [] (skipDays >>= Kernel.Utils.JSON.valueToMaybe))|E
    slotChanges: (Kernel.Prelude.fromMaybe [] (slotChanges >>= Kernel.Utils.JSON.valueToMaybe))|E

  toTType:
    benefitDescription: Kernel.Prelude.Just|I
    clientSdkVersion: Kernel.Utils.Version.versionToText <$> clientSdkVersion|E
    overrideBenefitConfigJson: (Data.Aeson.toJSON <$> overrideBenefitConfigJson)|E
    skipDays: (Kernel.Prelude.Just (Data.Aeson.toJSON skipDays))|E
    slotChanges: (Kernel.Prelude.Just (Data.Aeson.toJSON slotChanges))|E

  sqlType:
    overrideBenefitConfigJson: jsonb
    skipDays: jsonb
    slotChanges: jsonb

  constraints:
    id: PrimaryKey
    orderId: SecondaryKey
    purchasedPassId: SecondaryKey
    personId: "!SecondaryKey"

  queries:
    findOneByPaymentOrderId:
        kvFunction: findOneWithKV
        where: orderId

    updatePersonIdByPurchasedPassId:
      kvFunction: updateWithKV
      params: [personId]
      where: purchasedPassId

    findAllByPurchasedPassId:
      kvFunction: findAllWithKV
      where: purchasedPassId

    updateStatusByOrderId:
      kvFunction: updateOneWithKV
      params: [status]
      where: orderId

    updateSdkVersionByOrderId:
      kvFunction: updateOneWithKV
      params: [clientSdkVersion]
      where: orderId

    findAllByPurchasedPassIdAndStatus:
      kvFunction: findAllWithOptionsKV
      where:
        and:
          - purchasedPassId
          - in:
            - status
          - gte:
            - endDate
      orderBy:
        field: startDate
        order: asc

    findAllByPurchasedPassIdAndStatusStartDateGreaterThan:
      kvFunction: findAllWithOptionsKV
      where:
        and:
          - purchasedPassId
          - status
          - gte:
            - startDate
      orderBy:
        field: startDate
        order: asc

    findAllWithPersonId:
      kvFunction: findAllWithOptionsKV
      where: personId

    findAllByPersonIdAndStatuses:
      kvFunction: findAllWithOptionsKV
      where:
        and:
          - personId
          - in:
            - status

    updateStatusByPurchasedPassIdAndStartEndDate:
      kvFunction: updateWithKV
      params: [status]
      where:
        and:
          - purchasedPassId
          - startDate
          - endDate

    findAllByPurchasedPassIdAndStatusAndStartDate:
      kvFunction: findAllWithOptionsKV
      where:
        and:
          - purchasedPassId
          - in:
            - status
          - startDate
      orderBy:
        field: createdAt
        order: desc

    updateStatusAndDatesById:
      kvFunction: updateWithKV
      params: [startDate, endDate, status]
      where: id

    updateProfilePictureByPurchasedPassIdAndStatus:
      kvFunction: updateWithKV
      params: [profilePicture]
      where:
        and:
          - purchasedPassId
          - in:
            - status

    updatePassPhotoMediaIdByPurchasedPassIdAndStatus:
      kvFunction: updateWithKV
      params: [passPhotoMediaId]
      where:
        and:
          - purchasedPassId
          - in:
            - status

    updatePhotoChangeCountByPurchasedPassIdAndStatus:
      kvFunction: updateWithKV
      params: [passPhotoChangeCount]
      where:
        and:
          - purchasedPassId
          - in:
            - status

    findAllByPersonIdWithFilters:
      kvFunction: findAllWithOptionsKV
      where:
        and:
          - personId
          - merchantId
          - in:
            - status
          - passCode

    updateAvailableTripCountById:
      kvFunction: updateOneWithKV
      params: [availableTripCount]
      where: id

    updateSkipDaysById:
      kvFunction: updateOneWithKV
      params: [skipDays]
      where: id

    updateSlotChangesById:
      kvFunction: updateOneWithKV
      params: [slotChanges]
      where: id

    updateActivatedAt:
      kvFunction: updateOneWithKV
      params: [activatedAt]
      where: id

  extraOperations:
    - EXTRA_QUERY_FILE

PassVerifyTransaction:
  tableName: pass_verify_transaction

  types:
    PassVerifiedStatus:
      enum: "FULLY_VERIFIED, PARTIALLY_VERIFIED, NOT_VERIFIED"
      derive': "Show, Eq, Ord, Read, Generic, ToJSON, FromJSON, ToSchema"

  domainInstance:
    - Custom Kernel.Beam.Lib.UtilsTH.mkBeamInstancesForEnumAndList <PassVerifiedStatus>
    - Custom Kernel.Utils.TH.mkHttpInstancesForEnum <PassVerifiedStatus>

  fields:
    id: Id PassVerifyTransaction
    purchasePassId: Id PurchasedPass
    validTill: UTCTime
    verifiedAt: UTCTime
    sourceStopCode: Maybe Text
    destinationStopCode: Maybe Text
    fleetId: Text
    isActuallyValid: Maybe Bool
    autoActivated: Maybe Bool
    verificationStatus: Maybe PassVerifiedStatus
    passEnum: Maybe PassEnum

  sqlType:
    verificationStatus: text
    passEnum: text

  constraints:
    id: PrimaryKey
    purchasePassId: SecondaryKey

  queries:
    findAllByPurchasePassId:
      kvFunction: findAllWithKV
      where: purchasePassId

  extraOperations:
    - EXTRA_QUERY_FILE
    - GENERATE_INDEXES
