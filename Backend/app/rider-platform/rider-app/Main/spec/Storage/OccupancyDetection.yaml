imports:
  Merchant: Domain.Types.Merchant
  MerchantOperatingCity: Domain.Types.MerchantOperatingCity
  TicketPlace: Domain.Types.TicketPlace
  TicketService: Domain.Types.TicketService
  VehicleViolation: Domain.Types.VehicleViolation
  UTCTime: Kernel.Prelude
  Value: Data.Aeson
  EncryptedField: Kernel.External.Encryption
  AsEncrypted: Kernel.External.Encryption
  DetectionSource: Domain.Types.DetectionSource

DetectionSource:
  tableName: detection_source
  derives: "Generic,Show,FromJSON,ToJSON"

  fields:
    id: Id DetectionSource
    merchantOperatingCityId: Id MerchantOperatingCity
    name: Text
    vendorKey: Text
    authMode: DetectionAuthMode
    authSecret: Maybe (EncryptedField 'AsEncrypted Text)
    authCode: Maybe Text
    occupancyMode: OccupancyMode
    enforcementEnabled: Bool
    enforcementGraceMinutes: Int
    anomalyAlertsEnabled: Bool
    imagesEnabled: Bool
    enabled: Bool
    mappings: "[DetectionMapping]"

  types:
    DetectionAuthMode:
      enum: "Hmac,Bearer,Custom"
    OccupancyMode:
      enum: "Availability,Session"
    DetectionMapping:
      externalId: Text # camera vendor's area id; zone occupancy = sum of its mapped areas
      ticketPlaceId: Id TicketPlace
      ticketServiceId: Maybe (Id TicketService) # vehicle-type slice; Nothing = whole place
      derive: "Eq"

  beamType:
    authSecret: Maybe Text
    mappings: Value

  sqlType:
    mappings: json

  fromTType:
    authSecret: Encrypted <$> authSecret|E
    mappings: (\val -> case Data.Aeson.fromJSON val of Data.Aeson.Success x -> x; Data.Aeson.Error _ -> []) mappings|E

  toTType:
    authSecret: authSecret <&> unEncrypted|E
    mappings: Data.Aeson.toJSON mappings|E

  constraints:
    id: PrimaryKey

  default:
    authMode: "'Hmac'"
    occupancyMode: "'Availability'"
    enforcementEnabled: "false"
    enforcementGraceMinutes: "10"
    anomalyAlertsEnabled: "false"
    imagesEnabled: "false"
    enabled: "true"
    mappings: "'[]'"

  queries:
    findById:
      kvFunction: findOneWithKV
      where: id
    findAllByMerchantOperatingCityId:
      kvFunction: findAllWithKV
      where: merchantOperatingCityId

OccupancyAlert:
  tableName: occupancy_alert

  fields:
    id: Id OccupancyAlert
    merchantOperatingCityId: Id MerchantOperatingCity
    detectionSourceId: Id DetectionSource
    ticketPlaceId: Id TicketPlace
    category: AlertCategory
    externalAlertId: Maybe Text
    status: AlertStatus
    unpaidEstimate: Int
    detectedAt: UTCTime
    graceUntil: UTCTime
    resolution: Maybe AlertResolution
    violationId: Maybe (Id VehicleViolation)
    acknowledgedBy: Maybe Text # dashboard person id
    resolvedAt: Maybe UTCTime

  types:
    AlertCategory:
      enum: "Unpaid,WrongVehicleType,Orientation,VehicleType,DoublePark"
    AlertStatus:
      enum: "Pending,Open,Resolved,Dismissed,Escalated"
    AlertResolution:
      enum: "PaidLater,VehicleLeft,VerifiedViolation,FalsePositive"

  constraints:
    id: PrimaryKey
    ticketPlaceId: "!SecondaryKey"

  default:
    category: "'Unpaid'"
    status: "'Pending'"
    unpaidEstimate: "1"

  queries:
    findById:
      kvFunction: findOneWithKV
      where: id
    updateResolution:
      kvFunction: updateOneWithKV
      params: [status, resolution, violationId, acknowledgedBy, resolvedAt, updatedAt]
      where: id
