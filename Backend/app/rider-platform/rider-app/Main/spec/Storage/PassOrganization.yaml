imports:
  Merchant: Domain.Types.Merchant
  MerchantOperatingCity: Domain.Types.MerchantOperatingCity
  Person: Domain.Types.Person
  UTCTime: Data.Time
  PassEnum: Domain.Types.PassType

PassOrganization:
  tableName: pass_organization

  fields:
    id: Id PassOrganization
    name: Text
    personId: Id Person
    address: Maybe Text
    merchantId: Id Merchant
    merchantOperatingCityId: Id MerchantOperatingCity
    createdAt: UTCTime
    updatedAt: UTCTime
    passEnum: PassEnum
    depotPersonId: Maybe (Id Person)
    depotId: Maybe Text
    # Corporate shuttle: the work-email domains (lower-case, e.g. acme.example) whose verified employees belong to this
    # organisation. Empty for every non-corporate organisation (student / regular pass).
    emailDomains: "[Text]"
    # Corporate shuttle: where the company's office is (the drop of every to-office trip). Empty for other organisations.
    officeLat: Maybe Double
    officeLon: Maybe Double

  constraints:
    id: PrimaryKey
    personId: SecondaryKey
    depotPersonId: SecondaryKey

  # nullable column (no backfill for the existing organisations); NULL reads as no domains
  beamType:
    emailDomains: Maybe [Text]

  fromTType:
    emailDomains: Kernel.Prelude.fromMaybe []|I

  toTType:
    emailDomains: Kernel.Prelude.Just|I

  sqlType:
    name: text
    address: text
    emailDomains: text[]

  queries:
    findById:
      kvFunction: findOneWithKV
      where: id

    findByPersonId:
      kvFunction: findOneWithKV
      where: personId

    findByDepotPersonId:
      kvFunction: findAllWithKV
      where: depotPersonId

    findByMerchantOperatingCityIdAndPassEnum:
      kvFunction: findAllWithKV
      where:
        and: [merchantOperatingCityId, passEnum]

    updatePassOrganization:
      kvFunction: updateWithKV
      params: [name, address, updatedAt]
      where: id

    updateEmailDomains:
      kvFunction: updateWithKV
      params: [emailDomains, updatedAt]
      where: id

    updateOfficeLocation:
      kvFunction: updateWithKV
      params: [officeLat, officeLon, updatedAt]
      where: id

    updateDepotAssignment:
      kvFunction: updateWithKV
      params: [depotPersonId, depotId, updatedAt]
      where:
        in: [id]

  extraIndexes:
    - columns: [merchantOperatingCityId, name, passEnum]
      unique: true

  extraOperations:
    - GENERATE_INDEXES

  excludedFields: [merchantOperatingCityId, merchantId, createdAt, updatedAt]