imports:
  APISuccess: Kernel.Types.APISuccess
  FRFSTicketBooking: Domain.Types.FRFSTicketBooking

module: SharedCab

types:
  # FULL = no seat for me (nobody's fault), OTHER = I don't want this cab (counts as my miss)
  SharedCabSkipReason:
    enum: "FULL,OTHER"

  SharedCabSkipReq:
    reason: SharedCabSkipReason

apis:
  - POST:
      endpoint: /sharedCab/booking/{bookingId}/skip
      auth: TokenAuth
      params:
        bookingId: Id FRFSTicketBooking
      request:
        type: SharedCabSkipReq
      response:
        type: APISuccess
