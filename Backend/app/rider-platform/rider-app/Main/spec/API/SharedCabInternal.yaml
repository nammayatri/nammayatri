imports:
  UTCTime: Kernel.Prelude
  Day: Data.Time
  VehicleTrip: Domain.Types.VehicleTrip
  VehicleTripStatus: Domain.Types.VehicleTrip
  VehicleTripEndReason: Domain.Types.VehicleTrip
  IntegratedBPPConfig: Domain.Types.IntegratedBPPConfig
  ServiceTierType: BecknV2.FRFS.Enums
  SelectRouteMode: SharedLogic.SharedCab.SessionState
  SharedCabRoute: SharedLogic.SharedCab.SessionView
  SharedCabSession: SharedLogic.SharedCab.SessionView
  EndRouteReq: SharedLogic.SharedCab.SessionView
  FRFSTicketBooking: Domain.Types.FRFSTicketBooking

module: SharedCabInternal

# Responses are the driver-app /sharedCab/* contract verbatim (driver-app proxies them unchanged);
# requests add the driver/vehicle identity driver-app resolves from its token.
# SharedCabSession and EndRouteReq live in SharedLogic.SharedCab.SessionView: their `route` / `force` fields
# clash with Servant.route / EulerHS.Prelude.force in the generated module.
types:
  SharedCabRoutesResp:
    routes: "[SharedCabRoute]"

  AffectedRider:
    bookingId: Text
    firstName: Text
    dropStop: Text

  SelectRouteResp:
    session: Maybe SharedCabSession
    affectedRiders: Maybe [AffectedRider]

  SelectRouteReq:
    driverId: Text
    vehicleNumber: Text
    integratedBppConfigId: Id IntegratedBPPConfig
    serviceTierType: ServiceTierType
    capacity: Maybe Int
    routeCode: Text
    walkupCount: Int
    mode: Maybe SelectRouteMode

  SeatsReq:
    driverId: Text
    vehicleNumber: Text
    walkupCount: Int
    version: Int

  SharedCabDriverReq:
    driverId: Text
    vehicleNumber: Text

  SharedCabTrip:
    id: Id VehicleTrip
    routeCode: Text
    status: VehicleTripStatus
    startedAt: UTCTime
    endedAt: Maybe UTCTime
    endReason: Maybe VehicleTripEndReason
    offlineBoardings: Int

  SharedCabTripsResp:
    trips: "[SharedCabTrip]"

apis:
  - GET:
      endpoint: /sharedCab/routes
      auth: NoAuth
      headers:
        token: Text
      mandatoryQuery:
        integratedBppConfigId: Text
        lat: Double
        lon: Double
      response:
        type: SharedCabRoutesResp
  - POST:
      endpoint: /sharedCab/route/select
      auth: NoAuth
      headers:
        token: Text
      request:
        type: SelectRouteReq
      response:
        type: SelectRouteResp
  - GET:
      endpoint: /sharedCab/session
      auth: NoAuth
      headers:
        token: Text
      mandatoryQuery:
        driverId: Text
        vehicleNumber: Text
      response:
        type: SharedCabSession
  - POST:
      endpoint: /sharedCab/seats
      auth: NoAuth
      headers:
        token: Text
      request:
        type: SeatsReq
      response:
        type: SharedCabSession
  - POST:
      endpoint: /sharedCab/route/end
      auth: NoAuth
      headers:
        token: Text
      request:
        type: EndRouteReq
      response:
        type: "(Kernel.Prelude.Maybe SharedLogic.SharedCab.SessionView.SharedCabSession)"
  - POST:
      endpoint: /sharedCab/resume
      auth: NoAuth
      headers:
        token: Text
      request:
        type: SharedCabDriverReq
      response:
        type: SharedCabSession
  - GET:
      endpoint: /sharedCab/trips
      auth: NoAuth
      headers:
        token: Text
      mandatoryQuery:
        driverId: Text
        date: Day
      response:
        type: SharedCabTripsResp
  - POST:
      endpoint: /sharedCab/booking/{bookingId}/cancel
      auth: NoAuth
      headers:
        token: Text
      params:
        bookingId: Id FRFSTicketBooking
      request:
        type: SharedCabDriverReq
      response:
        type: SharedCabSession
  - POST:
      endpoint: /sharedCab/booking/{bookingId}/boardedWithoutCode
      auth: NoAuth
      headers:
        token: Text
      params:
        bookingId: Id FRFSTicketBooking
      request:
        type: SharedCabDriverReq
      response:
        type: SharedCabSession
  - POST:
      endpoint: /sharedCab/booking/{bookingId}/dropped
      auth: NoAuth
      headers:
        token: Text
      params:
        bookingId: Id FRFSTicketBooking
      request:
        type: SharedCabDriverReq
      response:
        type: SharedCabSession
