imports:
  SharedCabDemandResp: SharedLogic.SharedCab.SessionView
  SharedCabSession: SharedLogic.SharedCab.SessionView
  CabUpdate: Domain.Types.SharedCabSession
  CabSyncResp: Domain.Types.SharedCabSession
  SharedCabSeatsResp: Domain.Types.SharedCabSession
  FRFSTicketBooking: Domain.Types.FRFSTicketBooking
  APISuccess: Kernel.Types.APISuccess

module: SharedCabInternal

# SharedCabSession lives in SharedLogic.SharedCab.SessionView because its `route` field clashes with Servant.route.
# Driver-app owns the cab's trip (vehicle_trip, the session, the route feed and the LTS attach) and tells rider-app through
# /sharedCab/cab/sync; rider-app owns the bookings and the seats they take.
types:
  SharedCabDemandReq:
    agencyId: Text
    routeCodes: "[Text]"

  SharedCabSessionOperation:
    enum: "SET_SEATS,CAB_FULL"

  SharedCabSessionOperationReq:
    operation: SharedCabSessionOperation
    driverId: Text
    vehicleNumber: Text
    version: Maybe Int
    walkupCount: Maybe Int

  SharedCabBookingOperation:
    enum: "ACCEPT,DECLINE,CANCEL,BOARDED_WITHOUT_CODE,DROPPED"

  SharedCabBookingOperationReq:
    operation: SharedCabBookingOperation
    driverId: Text
    vehicleNumber: Text
    reason: Maybe Text

  RiderCallNumberResp:
    riderNumber: Text

  SharedCabMessageReq:
    driverId: Text
    vehicleNumber: Text
    message: Text

apis:
  - POST:
      endpoint: /sharedCab/routes/demand
      auth: NoAuth
      headers:
        token: Text
      request:
        type: SharedCabDemandReq
      response:
        type: SharedCabDemandResp
  - POST:
      endpoint: /sharedCab/cab/sync
      auth: NoAuth
      headers:
        token: Text
      request:
        type: CabUpdate
      response:
        type: CabSyncResp
  - POST:
      endpoint: /sharedCab/session/operations
      auth: NoAuth
      headers:
        token: Text
      request:
        type: SharedCabSessionOperationReq
      response:
        type: SharedCabSeatsResp
  - POST:
      endpoint: /sharedCab/booking/{bookingId}/operations
      auth: NoAuth
      headers:
        token: Text
      params:
        bookingId: Id FRFSTicketBooking
      request:
        type: SharedCabBookingOperationReq
      response:
        type: SharedCabSession
  - GET:
      endpoint: /sharedCab/booking/{bookingId}/callNumber
      auth: NoAuth
      headers:
        token: Text
      params:
        bookingId: Id FRFSTicketBooking
      mandatoryQuery:
        driverId: Text
        vehicleNumber: Text
      response:
        type: RiderCallNumberResp
  - POST:
      endpoint: /sharedCab/booking/{bookingId}/message
      auth: NoAuth
      headers:
        token: Text
      params:
        bookingId: Id FRFSTicketBooking
      request:
        type: SharedCabMessageReq
      response:
        type: APISuccess
