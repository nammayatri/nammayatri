imports:
  UTCTime: Kernel.Prelude
  Day: Data.Time
  VehicleTrip: Domain.Types.VehicleTrip
  VehicleTripStatus: Domain.Types.VehicleTrip
  VehicleTripEndReason: Domain.Types.VehicleTrip
  HighPrecMoney: Kernel.Types.Common
  IntegratedBPPConfig: Domain.Types.IntegratedBPPConfig
  ServiceTierType: BecknV2.FRFS.Enums
  SessionStatus: SharedLogic.SharedCab.SessionState
  PauseReason: SharedLogic.SharedCab.SessionState
  SessionMovement: SharedLogic.SharedCab.SessionState
  SelectRouteMode: SharedLogic.SharedCab.SessionState

module: SharedCabInternal

# Responses are the driver-app /sharedCab/* contract verbatim (driver-app proxies them unchanged);
# requests add the driver/vehicle identity driver-app resolves from its token.
types:
  SharedCabRoute:
    code: Text
    name: Text
    direction: Text
    fromStop: Text
    toStop: Text
    distanceKm: Maybe Double
    isStandRoute: Bool

  SharedCabRoutesResp:
    routes: "[SharedCabRoute]"

  SessionRoute:
    code: Text
    name: Text
    direction: Text
    nextStops: "[Text]"

  RiderStatus:
    enum: "AT_STOP, MINUTES_AWAY"

  BoardingRider:
    bookingId: Text
    firstName: Text
    seats: Int
    dropStop: Text
    fare: HighPrecMoney
    riderStatus: RiderStatus
    minutesAway: Maybe Int
    expiresAt: Maybe UTCTime

  AlightingRider:
    bookingId: Text
    firstName: Text
    seats: Int

  RidersAtStop:
    stopName: Text
    boarding: "[BoardingRider]"
    alighting: "[AlightingRider]"

  DemandAtStop:
    stopName: Text
    waiting: Int
    searching: Int
    windowMin: Int

  LowDemandAlternative:
    routeCode: Text
    name: Text
    riders: Int
    windowMin: Int
    distanceKm: Double

  LowDemandCard:
    alternatives: "[LowDemandAlternative]"

  OffRoute:
    nearestRoutes: "[SharedCabRoute]"

  SharedCabSession:
    route: SessionRoute
    queuedRoute: Maybe SessionRoute
    status: SessionStatus
    pauseReason: Maybe PauseReason
    movement: SessionMovement
    capacity: Int
    walkupCount: Int
    available: Int
    version: Int
    ridersByStop: "[RidersAtStop]"
    demandAhead: "[DemandAtStop]"
    lowDemandCard: Maybe LowDemandCard
    offRoute: Maybe OffRoute

  AffectedRider:
    bookingId: Text
    firstName: Text
    dropStop: Text

  SelectRouteResp:
    session: Maybe SharedCabSession
    affectedRiders: Maybe [AffectedRider]

  SelectRouteReq:
    driverId: Text
    vehicleNumber: Text
    integratedBppConfigId: Id IntegratedBPPConfig
    serviceTierType: ServiceTierType
    capacity: Maybe Int
    routeCode: Text
    walkupCount: Int
    mode: Maybe SelectRouteMode

  SeatsReq:
    driverId: Text
    vehicleNumber: Text
    walkupCount: Int
    version: Int

  EndRouteNext:
    enum: "RETURN, CHANGE, END"

  # END closes the run as END_ROUTE when atLastStop (driver ended at the route's last stop), else END_FOR_NOW.
  # RETURN / END are refused (SHARED_CAB_RIDERS_ON_BOARD) while riders are on board unless force.
  EndRouteReq:
    driverId: Text
    vehicleNumber: Text
    next: EndRouteNext
    atLastStop: Maybe Bool
    force: Maybe Bool

  SharedCabDriverReq:
    driverId: Text
    vehicleNumber: Text

  SharedCabTrip:
    id: Id VehicleTrip
    routeCode: Text
    status: VehicleTripStatus
    startedAt: UTCTime
    endedAt: Maybe UTCTime
    endReason: Maybe VehicleTripEndReason
    offlineBoardings: Int

  SharedCabTripsResp:
    trips: "[SharedCabTrip]"

apis:
  - GET:
      endpoint: /sharedCab/routes
      auth: NoAuth
      headers:
        token: Text
      mandatoryQuery:
        integratedBppConfigId: Text
        lat: Double
        lon: Double
      response:
        type: SharedCabRoutesResp
  - POST:
      endpoint: /sharedCab/route/select
      auth: NoAuth
      headers:
        token: Text
      request:
        type: SelectRouteReq
      response:
        type: SelectRouteResp
  - GET:
      endpoint: /sharedCab/session
      auth: NoAuth
      headers:
        token: Text
      mandatoryQuery:
        driverId: Text
        vehicleNumber: Text
      response:
        type: SharedCabSession
  - POST:
      endpoint: /sharedCab/seats
      auth: NoAuth
      headers:
        token: Text
      request:
        type: SeatsReq
      response:
        type: SharedCabSession
  - POST:
      endpoint: /sharedCab/route/end
      auth: NoAuth
      headers:
        token: Text
      request:
        type: EndRouteReq
      response:
        type: "(Kernel.Prelude.Maybe API.Types.UI.SharedCabInternal.SharedCabSession)"
  - POST:
      endpoint: /sharedCab/resume
      auth: NoAuth
      headers:
        token: Text
      request:
        type: SharedCabDriverReq
      response:
        type: SharedCabSession
  - GET:
      endpoint: /sharedCab/trips
      auth: NoAuth
      headers:
        token: Text
      mandatoryQuery:
        driverId: Text
        date: Day
      response:
        type: SharedCabTripsResp
