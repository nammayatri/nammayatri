# Kept after haskell-cac removal for backward compatibility: older rider apps
# may still call /v2/getUiConfigs; dropping the route would 404 them.
# Handler returns empty Object {}.
imports:
module: Cac
types: {}
apis:
  - POST:
      endpoint: /getUiConfigs
      auth: TokenAuth
      request:
        type: "Data.Aeson.Object"
      response:
        type: "Data.Aeson.Object"
