imports:
  OfferRespAPIEntity: SharedLogic.Offer
  CumulativeOfferResp: SharedLogic.Offer
  HighPrecMoney: Kernel.Types.Common

module: Offers

types: {}

apis:
  - GET:
      endpoint: /offers/list
      auth: TokenAuth
      query:
        - amount: HighPrecMoney
      response:
        type: "[OfferRespAPIEntity]"
  - GET:
      endpoint: /offers/list/v2
      auth: TokenAuth
      query:
        - amount: HighPrecMoney
      response:
        type: CumulativeOfferResp
