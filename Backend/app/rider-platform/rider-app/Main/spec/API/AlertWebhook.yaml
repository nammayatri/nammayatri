imports:
  APISuccess: Kernel.Types.APISuccess
  AlertIncident: Domain.Types.AlertIncident

module: AlertWebhook

types:
  # VictoriaMetrics vmalert webhook request
  VmAlertWebhookReq:
    receiver: Maybe Text
    status: Text
    alerts: "[AlertDetail]"
    externalURL: Maybe Text

  AlertDetail:
    status: Text
    labels: AlertLabels
    annotations: AlertAnnotations
    startsAt: UTCTime
    endsAt: UTCTime

  AlertLabels:
    alertname: Text
    alert: Maybe Text
    alertgroup: Maybe Text
    severity: Maybe Text

  AlertAnnotations:
    description: Maybe Text
    summary: Maybe Text

apis:
  - POST:
      endpoint: /api/v1/alerts/update
      auth: NoAuth
      request:
        type: VmAlertWebhookReq
      query:
        isManual: Bool
        rca: Text
        incidentId: Id AlertIncident
      response:
        type: APISuccess
