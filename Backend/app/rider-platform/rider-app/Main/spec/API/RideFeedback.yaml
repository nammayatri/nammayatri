imports:
  Booking: Domain.Types.Booking
  Language: Kernel.External.Types
  Value: Data.Aeson

module: RideFeedback

# Ride feedback for the rider app, from booking confirmation to drop-off (asked before a driver too,
# e.g. while waiting in an airport queue). Questions, answers and targeting live in the driver platform
# (dynamic-offer-driver-app); rider-app forwards these calls there and runs the actions an answer triggers.
types:
  RideFeedbackQuestionType:
    enum: "SINGLE_SELECT,MULTI_SELECT,YES_NO,STAR_RATING,EMOJI_SCALE,THUMBS,SCALE,TEXT_INPUT,NUMBER_INPUT,IMAGE_UPLOAD,AUDIO"

  RideFeedbackResponseStatus:
    enum: "SHOWN,ANSWERED,SKIPPED,EXPIRED"

  RideFeedbackAnswer:
    selectedOptionKeys: Maybe [Text]
    text: Maybe Text
    number: Maybe Double
    rating: Maybe Int
    mediaFileIds: Maybe [Text]

  RideFeedbackQuestionsRes:
    serverTime: UTCTime
    questions: "[FeedbackQuestionItem]"
    followUpQuestions: "[FeedbackQuestionItem]"

  FeedbackQuestionItem:
    questionId: Text
    questionKey: Text
    questionType: RideFeedbackQuestionType
    title: Text
    description: Maybe Text
    options: Maybe [FeedbackOptionItem]
    inputConfig: Maybe FeedbackInputConfigRes
    acknowledgement: Maybe Text
    iconUrl: Maybe Text
    isSkippable: Bool
    showAt: UTCTime
    autoDismissAfterSeconds: Maybe Int
    uiConfig: Maybe Value

  FeedbackOptionItem:
    key: Text
    label: Text
    iconUrl: Maybe Text
    nextQuestionKey: Maybe Text
    requiresText: Bool
    isExclusive: Bool

  FeedbackInputConfigRes:
    placeholder: Maybe Text
    minLength: Maybe Int
    maxLength: Maybe Int
    minValue: Maybe Double
    maxValue: Maybe Double
    step: Maybe Double
    minSelections: Maybe Int
    maxSelections: Maybe Int
    maxFiles: Maybe Int
    maxDurationSec: Maybe Int
    minLabel: Maybe Text
    maxLabel: Maybe Text

  SubmitRideFeedbackReq:
    responses: "[FeedbackResponseItem]"

  # A follow-up's parent is found on the server: the answer on this ride whose option opened it.
  FeedbackResponseItem:
    questionId: Text
    status: RideFeedbackResponseStatus
    answer: Maybe RideFeedbackAnswer

  SubmitRideFeedbackRes:
    results: "[FeedbackSubmitResult]"

  FeedbackSubmitResult:
    questionId: Text
    accepted: Bool
    errorCode: Maybe Text

apis:
  # GET /booking/{bookingId}/feedback/questions
  - GET:
      endpoint: /booking/{bookingId}/feedback/questions
      auth: TokenAuth
      headers:
        x-language: Language
      params:
        bookingId: Id Booking
      response:
        type: API.Types.UI.RideFeedback.RideFeedbackQuestionsRes

  # POST /booking/{bookingId}/feedback
  - POST:
      endpoint: /booking/{bookingId}/feedback
      auth: TokenAuth
      params:
        bookingId: Id Booking
      request:
        type: API.Types.UI.RideFeedback.SubmitRideFeedbackReq
      response:
        type: API.Types.UI.RideFeedback.SubmitRideFeedbackRes
