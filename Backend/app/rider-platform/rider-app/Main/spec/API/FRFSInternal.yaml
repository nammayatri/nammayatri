imports:
  FRFSTripPassengerManifestResp: API.Types.UI.FRFSTicketService
  APISuccess: Kernel.Types.APISuccess
  NotifyTripStartedSource: Domain.Types.FavouriteRoute

module: FRFSInternal

types:
  NotifyTripStartedReq:
    gtfsId: Text
    routeId: Text
    routeShortName: Maybe Text
    vehicleNumber: Text
    startedAt: Maybe Int

  NotifyBusApproachingReq:
    gtfsId: Text
    routeId: Text
    vehicleNumber: Text
    etaSeconds: Maybe Int
    distanceMeters: Double
    thresholdType: Text
    crossedStopId: Maybe Text

apis:
  - GET:
      endpoint: /frfs/trip/{tripId}/route/{routeId}/manifest
      auth: NoAuth
      headers:
        token: Text
      params:
        tripId: Text
        routeId: Text
      response:
        type: "API.Types.UI.FRFSTicketService.FRFSTripPassengerManifestResp"
  - POST:
      endpoint: /frfs/trip/{tripId}/notifyTripStarted
      auth: NoAuth
      headers:
        token: Text
      params:
        tripId: Text
      query:
        source: NotifyTripStartedSource
      response:
        type: "Kernel.Types.APISuccess.APISuccess"
  - POST:
      endpoint: /frfs/trip/{tripId}/stop/{stopCode}/notifyApproaching
      auth: NoAuth
      headers:
        token: Text
      params:
        tripId: Text
        stopCode: Text
      request:
        type: NotifyBusApproachingReq
      response:
        type: "Kernel.Types.APISuccess.APISuccess"

  # v2 of the route above. The v1 shape stays bodyless forever: crew apps already in
  # the field call it with no body, and adding a ReqBody there would 415 them. v2
  # carries the payload gps-processor already builds.
  - POST:
      endpoint: /frfs/trip/{tripId}/notifyTripStarted/v2
      auth: NoAuth
      headers:
        token: Text
      params:
        tripId: Text
      request:
        type: NotifyTripStartedReq
      response:
        type: "Kernel.Types.APISuccess.APISuccess"
