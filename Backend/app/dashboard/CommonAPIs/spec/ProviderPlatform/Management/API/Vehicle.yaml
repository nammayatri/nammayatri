imports:
  Summary: Dashboard.Common
  DriverAssociationInfo: Dashboard.Common.Driver
  ApprovalStatusFilter: Dashboard.Common.Driver
  VehicleVariant: Dashboard.Common

module: Vehicle

apis:
  - GET: # VehicleListAPI
      endpoint: /list
      auth: ApiAuthV2
      query:
        - limit: Int
        - offset: Int
        - fleetOwnerId: Text
        - vehicleNumber: Text
        - verified: Bool
        - approvalStatus: ApprovalStatusFilter
        - from: UTCTime
        - to: UTCTime
        - requestorId: Text
      response:
        type: VehicleListRes
  - GET: # VehicleInfoAPI
      endpoint: /info
      auth: ApiAuthV2
      query:
        - vehicleNumber: Text
      response:
        type: VehicleListItem
      migrate:
        capability: city-operations.vehicle.read
      helperApi:
        - GET:
            endpoint: /info/{fleetOwnerId}/{mbFleet}
            auth: ApiAuthV2
            query:
              - vehicleNumber: Text
            params:
              fleetOwnerId: Text
              mbFleet: Bool
            response:
              type: VehicleListItem

types:
  VehicleListRes:
    - totalItems: Int
    - summary: Summary
    - vehicles: [VehicleListItem]
  VehicleListItem:
    - rcId: Text
    - vehicleNumber: Maybe Text
    - vehicleMake: Maybe Text
    - vehicleModel: Maybe Text
    - vehicleColor: Maybe Text
    - vehicleClass: Maybe Text
    - vehicleVariant: Maybe VehicleVariant
    - verified: Maybe Bool
    - approved: Maybe Bool
    - createdAt: UTCTime
    - recentFleetInfo: Maybe DriverAssociationInfo
    - linkedDriverInfo: Maybe DriverAssociationInfo
