imports:
  Driver: Dashboard.Common
  Summary: Dashboard.Common
  DriverIds: Dashboard.Common.Driver
  Ride: Dashboard.Common
  Image: Dashboard.Common
  VehicleCategory: Dashboard.Common
  VehicleVariant: Dashboard.Common
  DriverGoHomeRequest: Dashboard.Common
  DriverHomeLocation: Dashboard.Common
  VerificationStatus: Dashboard.Common
  DriverDocumentsInfoRes: Dashboard.Common.Driver
  DriverActivityRes: Dashboard.Common.Driver
  DriverLicense: Dashboard.Common.Driver
  VehicleRegistrationCertificate: Dashboard.Common.Driver
  ReasonForDisablingServiceCharge: Dashboard.Common.Driver
  ServiceNames: Dashboard.Common.Driver
  EarningType: Dashboard.Common.Driver
  Version: Kernel.Types.Version
  LatLong: Kernel.External.Maps.Types
  City: Kernel.Types.Beckn.Context
  Currency: Kernel.Types.Common
  HighPrecMoney: Kernel.Types.Common
  PersonIdsReq: Dashboard.Common
  PersonMobileNoReq: Dashboard.Common
  PersonRes: Dashboard.Common
  Person: Dashboard.Common
  MandatoryQueryParam: Kernel.Utils.Common
  DriverFeeStatus: Dashboard.Common.Driver
  TagNameValue: Lib.Yudhishthira.Types
  SpecialLocation: Lib.Types.SpecialLocation
  UpdateTagBulkReq: Dashboard.Common
  UpdateTagBulkRes: Dashboard.Common
  Merchant: Dashboard.Common
  MerchantOperatingCity: Dashboard.Common
  ServiceTierType: Dashboard.Common
  UpsertDriverServiceTiersCsvReq: Dashboard.Common.Driver
  IndianState: Kernel.Types.Beckn.Context
  Day: Data.Time
  AddressDocumentType: Dashboard.Common.Driver
  OnboardingAs: Dashboard.Common.Driver
  DisabledReasonFlag: Dashboard.Common.Driver
  DriverAssociationInfo: Dashboard.Common.Driver
  ApprovalStatusFilter: Dashboard.Common.Driver

module: Driver

apis:
  - GET: # DriverDocumentsInfoAPI
      endpoint: /documents/info
      auth: ApiAuthV2
      response:
        type: DriverDocumentsInfoRes
  - POST: # PersonNumbersAPI
      endpoint: /personNumbers
      auth: ApiAuthV2
      multipart:
        type: PersonIdsReq
      response:
        type: "[PersonRes]"
  - POST:
      endpoint: /updateTagBulk
      auth: ApiAuthV2
      multipart:
        type: UpdateTagBulkReq
      response:
        type: "[UpdateTagBulkRes]"
  - POST: # PersonMobileNoAPI
      endpoint: /driverDataDecryption
      auth: ApiAuthV2
      request:
        type: "[DriverEncDataReq]"
      response:
        type: "[DriverDecDataResp]"
  - POST: # PersonIDAPI
      endpoint: /personId
      auth: ApiAuthV2
      multipart:
        type: PersonMobileNoReq
      response:
        type: "[PersonRes]"

  - GET: # DriverAadhaarInfoAPI
      endpoint: /{driverId}/aadhaarInfo
      auth: ApiAuthV2
      params:
        driverId: Id Driver
      response:
        type: DriverAadhaarInfoRes
  - GET: # DriverAadhaarInfoByPhoneAPI
      endpoint: /{mobileNo}/aadhaarInfobyMobileNumber
      auth: ApiAuthV2
      params:
        mobileNo: Text
      response:
        type: DriverAadhaarInfoByPhoneReq
  - GET: # DriverLoginOtpAPI
      endpoint: /loginOtp
      query:
        - mobileNumber: Text
        - mobileCountryCode: Text
        - driverId: Text
      auth: ApiAuthV2
      response:
        type: DriverLoginOtpRes
      migrate:
        capability: city-operations.pii.read
  - GET: # DriverListAPI
      endpoint: /list
      auth: ApiAuthV2
      query:
        - limit: Int
        - offset: Int
        - verified: Bool
        - enabled: Bool
        - blocked: Bool
        - subscribed: Bool
        - phone: Text
        - vehicleNumberSearchString: Text
        - mbNameSearchString: Text
        - approvalStatus: ApprovalStatusFilter
        - onboardingAs: OnboardingAs
        - fleetOwnerId: Text
        - from: UTCTime
        - to: UTCTime
        - fleetSeeker: Bool
      response:
        type: DriverListRes
  - GET: # DriverActivityAPI
      endpoint: /activity
      auth: ApiAuthV2
      response:
        type: DriverActivityRes
  - POST: # DisableDriverAPI
      endpoint: /{driverId}/disable
      auth: ApiAuthV2
      params:
        driverId: Id Driver
      response:
        type: APISuccess
  - POST: # UpdateACUsageRestrictionAPI
      endpoint: /{driverId}/acRestriction/update
      auth: ApiAuthV2
      params:
        driverId: Id Driver
      request:
        type: UpdateACUsageRestrictionReq
      response:
        type: APISuccess
  - POST: # BlockDriverWithReasonAPI
      endpoint: /{driverId}/blockWithReason
      auth: ApiAuthV2
      params:
        driverId: Id Driver
      request:
        type: BlockDriverWithReasonReq
      response:
        type: APISuccess
      helperApi:
        - POST:
            endpoint: /{driverId}/blockWithReason/{dashboardUserName}
            auth: ApiAuthV2
            params:
              driverId: Id Driver
              dashboardUserName: Text
            request:
              type: BlockDriverWithReasonReq
            response:
              type: APISuccess
  - POST: # BlockDriverAPI
      endpoint: /{driverId}/block
      auth: ApiAuthV2
      params:
        driverId: Id Driver
      response:
        type: APISuccess
  - GET: # BlockReasonListAPI
      endpoint: /blockReasonList
      auth: ApiAuthV2
      response:
        type: "[BlockReason]"
  - POST: # UnblockDriverAPI
      endpoint: /{driverId}/unblock
      auth: ApiAuthV2
      params:
        driverId: Id Driver
      query:
        - preventWeeklyCancellationRateBlockingTill: UTCTime
        - preventDailyCancellationRateBlockingTill: UTCTime
      response:
        type: APISuccess
      helperApi:
        - POST:
            endpoint: /{driverId}/unblock/{dashboardUserName}
            auth: ApiAuthV2
            params:
              driverId: Id Driver
              dashboardUserName: Text
            query:
              - preventWeeklyCancellationRateBlockingTill: UTCTime
              - preventDailyCancellationRateBlockingTill: UTCTime
            response:
              type: APISuccess
  - GET: # DriverLocationAPI
      endpoint: /location
      auth: ApiAuthV2
      query:
        - limit: Int
        - offset: Int
      request:
        type: DriverIds
      response:
        type: DriverLocationRes
  - DELETE: # DeleteDriverAPI
      endpoint: /{driverId}/permanentlyDelete
      auth: ApiAuthV2
      params:
        driverId: Id Driver
      response:
        type: APISuccess
  - POST: # UnlinkDLAPI
      endpoint: /{driverId}/unlinkDL
      auth: ApiAuthV2
      params:
        driverId: Id Driver
      response:
        type: APISuccess
  - POST: # UnlinkAadhaarAPI
      endpoint: /{driverId}/unlinkAadhaar
      auth: ApiAuthV2
      params:
        driverId: Id Driver
      response:
        type: APISuccess
  - POST: # UpdatePhoneNumberAPI
      endpoint: /{driverId}/updatePhoneNumber
      auth: ApiAuthV2
      params:
        driverId: Id Driver
      request:
        type: UpdatePhoneNumberReq
      validation: Dashboard.ProviderPlatform.Management.Driver.validateUpdatePhoneNumberReq
      response:
        type: APISuccess
  - POST: # UpdateDriverAadhaarAPI
      endpoint: /{mobileNo}/updateByPhoneNumber
      auth: ApiAuthV2
      params:
        mobileNo: Text
      request:
        type: UpdateDriverDataReq
      response:
        type: APISuccess
  - POST: # UpdateDriverNameAPI
      endpoint: /{driverId}/updateName
      auth: ApiAuthV2
      params:
        driverId: Id Driver
      request:
        type: UpdateDriverNameReq
      response:
        type: APISuccess
      # validation: Dashboard.ProviderPlatform.Management.Driver.validateUpdateDriverNameReq
  - POST: # DeleteRCAPI
      endpoint: /{driverId}/deleteRC
      auth: ApiAuthV2
      params:
        driverId: Id Driver
      request:
        type: DeleteRCReq
      response:
        type: APISuccess
  - GET: # ClearOnRideStuckDriversAPI
      endpoint: /clearStuck/onRide
      auth: ApiAuthV2
      query:
        - dbSyncTime: Int
      response:
        type: ClearOnRideStuckDriversRes
  - POST: # SendDummyRideRequestToDriverViaDashboardAPI
      endpoint: /{driverId}/sendDummyNotification # TODO: refactor to sendDummyRideRequestToDriver
      auth: ApiAuthV2
      params:
        driverId: Id Driver
      response:
        type: DummyRideRequestRes
  - POST: # ChangeOperatingCityAPI
      endpoint: /{driverId}/changeOperatingCity
      auth: ApiAuthV2
      params:
        driverId: Id Driver
      request:
        type: ChangeOperatingCityReq
      response:
        type: APISuccess
  - GET: # GetOperatingCityAPI
      endpoint: /getOperatingCity
      auth: ApiAuthV2
      query:
        - mobileCountryCode: Text
        - mobileNumber: Text
        - rideId: Id Ride
      response:
        type: GetOperatingCityResp
  - POST: # PauseOrResumeServiceChargesAPI
      endpoint: /{driverId}/pauseOrResumeServiceCharges
      auth: ApiAuthV2
      params:
        driverId: Id Driver
      request:
        type: PauseOrResumeServiceChargesReq
      response:
        type: APISuccess
  - POST: # UpdateRCInvalidStatusAPI
      endpoint: /updateRCInvalidStatus/{driverId}
      auth: ApiAuthV2
      params:
        driverId: Id Driver
      request:
        type: UpdateRCInvalidStatusReq
      response:
        type: APISuccess
  - POST:
      endpoint: /updateRCInvalidStatusByRCNumber
      auth: ApiAuthV2
      request:
        type: UpdateRCInvalidStatusByRCNumberReq
      response:
        type: APISuccess
  - POST: # UpdateVehicleVariantAPI
      endpoint: /updateVehicleVariant/{driverId}
      auth: ApiAuthV2
      params:
        driverId: Id Driver
      request:
        type: UpdateVehicleVariantReq
      response:
        type: APISuccess
  - POST: # BulkReviewRCVariantAPI
      endpoint: /bulkReviewRCVariant
      auth: ApiAuthV2
      request:
        type: "[ReviewRCVariantReq]"
      response:
        type: "[ReviewRCVariantRes]"
  - POST: # UpdateDriverTagAPI
      endpoint: /{driverId}/updateDriverTag
      auth: ApiAuthV2
      params:
        driverId: Id Driver
      request:
        type: UpdateDriverTagReq
      response:
        type: APISuccess
  - POST: # UpdateSpecialLocWarriorAPI
      endpoint: /{driverId}/updateSpecialLocWarrior
      auth: ApiAuthV2
      params:
        driverId: Id Driver
      request:
        type: UpdateDriverSpecialLocWarriorReq
      response:
        type: APISuccess
  - POST:
      endpoint: /clearFee
      auth: ApiAuthV2
      mandatoryQuery:
        driverId: Id Driver
      request:
        type: ClearDriverFeeReq
      response:
        type: APISuccess
      helperApi:
        - POST:
            endpoint: /clearFee
            auth: ApiAuthV2
            mandatoryQuery:
              driverId: Id Driver
            query:
              - requestorId: Text
            request:
              type: ClearDriverFeeReq
            response:
              type: APISuccess
  - GET:
      endpoint: /panAadharSelfieDetails
      mandatoryQuery:
        phoneNo: Text
        countryCode: Text
      auth: ApiAuthV2
      response:
        type: PanAadharSelfieDetailsResp
  - POST:
      endpoint: /syncDocAadharPan
      request:
        type: AadharPanSyncReq
      auth: ApiAuthV2
      response:
        type: APISuccess
  - POST:
      endpoint: /updateVehicleManufacturing/{driverId}
      auth: ApiAuthV2
      params:
        driverId: Id Driver
      request:
        type: UpdateVehicleManufacturingReq
      response:
        type: APISuccess

  - POST:
      endpoint: /{driverId}/vehicle/appendSelectedServiceTiers
      auth: ApiAuthV2
      params:
        driverId: Id Driver
      request:
        type: AppendSelectedServiceTiersReq
      response:
        type: APISuccess

  - POST:
      endpoint: /vehicle/upsertSelectedServiceTiers
      auth: ApiAuthV2
      multipart:
        type: UpsertDriverServiceTiersCsvReq
      response:
        type: APISuccess

  - POST:
      endpoint: /{driverId}/refundByPayout
      params:
        driverId: Id Driver
      request:
        type: RefundByPayoutReq
      auth: ApiAuthV2
      response:
        type: APISuccess
      helperApi:
        - POST:
            endpoint: /{driverId}/refundByPayout
            auth: ApiAuthV2
            params:
              driverId: Id Driver
            query:
              - requestorId: Text
            request:
              type: RefundByPayoutReq
            response:
              type: APISuccess
  - GET:
      endpoint: /{driverId}/securityDepositStatus
      params:
        driverId: Id Driver
      query:
        - serviceName: ServiceNames
      auth: ApiAuthV2
      response:
        type: ([SecurityDepositDfStatusRes])
  - GET:
      endpoint: /panAadharSelfieDetailsList
      mandatoryQuery:
        docType: Text
        driverId: Id Driver
      auth: ApiAuthV2
      response:
        type: ([PanAadharSelfieDetailsListResp])
  - POST:
      endpoint: /bulk/subscriptionServiceUpdate
      auth: ApiAuthV2
      request:
        type: BulkServiceUpdateReq
      response:
        type: APISuccess

  - GET: # DriverStatsAPI
      endpoint: /stats
      auth: ApiAuthV2
      query:
        - entityId: Id Driver
        - fromDate: Day
        - toDate: Day
      response:
        type: DriverStatsRes
      helperApi:
        - GET:
            endpoint: /stats
            auth: ApiAuthV2
            query:
              - entityId: Id Driver
              - fromDate: Day
              - toDate: Day
            mandatoryQuery:
              - requestorId: Text
            response:
              type: DriverStatsRes

  - GET: # DriverEarningsArrayAPI
      endpoint: /earnings
      auth: ApiAuthV2
      mandatoryQuery:
        - from: Day
        - to: Day
        - earningType: EarningType
        - driverId: Id Driver
      response:
        type: EarningPeriodStatsRes
      helperApi:
        - GET:
            endpoint: /earnings
            auth: ApiAuthV2
            mandatoryQuery:
              - from: Day
              - to: Day
              - earningType: EarningType
              - driverId: Id Driver
              - requestorId: Text
            response:
              type: EarningPeriodStatsRes

  # FY / quarter earnings for a driver OR a fleet owner. entityId is a person id
  # (the accumulator is keyed on personId), so pass either. Dashboard-only:
  # ApiAuthV2, no TokenAuth/UI variant. The helperApi is the BPP-side endpoint the
  # dashboard calls through Client.callManagementAPI, carrying requestorId.
  - GET: # DriverFyEarningsAPI
      endpoint: /fyEarnings
      auth: ApiAuthV2
      mandatoryQuery:
        - financialYear: Int
        - entityId: Id Driver
      query:
        - quarter: Int
      response:
        type: FyEarningsRes
      migrate:
        capability: finance.earnings.read
      helperApi:
        - GET:
            endpoint: /fyEarnings
            auth: ApiAuthV2
            mandatoryQuery:
              - financialYear: Int
              - entityId: Id Driver
              - requestorId: Text
            query:
              - quarter: Int
            response:
              type: FyEarningsRes

  - POST: # UpdateTdsRateAPI
      endpoint: /tdsRate/update
      auth: ApiAuthV2
      request:
        type: UpdateTdsRateReq
      response:
        type: APISuccess

  - POST: # UpdateDriverMerchantAPI
      endpoint: /{driverId}/updateMerchant
      auth: ApiAuthV2
      params:
        driverId: Id Driver
      request:
        type: UpdateDriverMerchantReq
      response:
        type: APISuccess

  - GET: # GetAirportPreferenceAPI
      endpoint: /airportPreference
      auth: ApiAuthV2
      query:
        - phoneNumber: Text
        - vehicleNumber: Text
        - specialZoneId: Text
      response:
        type: AirportPreferenceRes

  - POST: # SetAirportPreferenceAPI
      endpoint: /{driverId}/airportPreference
      auth: ApiAuthV2
      params:
        driverId: Id Driver
      request:
        type: AirportPreferenceReq
      response:
        type: APISuccess

  - GET: # DriverSearchRequestStatsAPI
      endpoint: /{driverId}/searchRequestStats
      auth: ApiAuthV2
      params:
        driverId: Id Driver
      query:
        - fromDate: Day
        - toDate: Day
      response:
        type: DriverSearchRequestStatsRes

  - GET: # GetDriverIdentityInfoAPI
      endpoint: /{driverId}/identityInfo
      auth: ApiAuthV2
      params:
        driverId: Id Driver
      response:
        type: DriverIdentityInfoRes
      helperApi:
        - GET:
            endpoint: /{driverId}/identityInfo/{requestorId}
            auth: ApiAuthV2
            params:
              driverId: Id Driver
              requestorId: Text
            response:
              type: DriverIdentityInfoRes

  - POST: # UpdateDriverIdentityInfoAPI
      endpoint: /{driverId}/identityInfo/update
      auth: ApiAuthV2
      params:
        driverId: Id Driver
      request:
        type: UpdateDriverIdentityInfoReq
      response:
        type: APISuccess
      helperApi:
        - POST:
            endpoint: /{driverId}/identityInfo/update/{requestorId}
            auth: ApiAuthV2
            params:
              driverId: Id Driver
              requestorId: Text
            request:
              type: UpdateDriverIdentityInfoReq
            response:
              type: APISuccess

  - POST: # postDriverAssociationChange
      endpoint: /{subjectId}/association/change
      auth: ApiAuthV2
      params:
        subjectId: Text
      request:
        type: ChangeAssociationReq
      response:
        type: APISuccess
      helperApi:
        - POST:
            endpoint: /{requestorId}/{subjectId}/association/change
            auth: ApiAuthV2
            params:
              requestorId: Text
              subjectId: Text
            request:
              type: ChangeAssociationReq
            response:
              type: APISuccess

types:
  DriverIdentityInfoRes:
    - driverId: Id Driver
    - nomineeName: Maybe Text
    - nomineeRelationship: Maybe Text
    - nomineeDob: Maybe Day
    - address: Maybe Text
    - addressDocumentType: Maybe AddressDocumentType
    - addressState: Maybe IndianState
    - derive: "'HideSecrets"
  UpdateDriverIdentityInfoReq:
    - nomineeName: Maybe Text
    - nomineeRelationship: Maybe Text
    - nomineeDob: Maybe Day
    - address: Maybe Text
    - addressDocumentType: Maybe AddressDocumentType
    - addressState: Maybe IndianState
    - derive: "'HideSecrets"
  DriverListRes:
    - totalItems: Int # for backward compatibility
    - summary: Summary
    - drivers: [DriverListItem]
  DriverLoginOtpRes:
    - driverId: Id Driver
    - otp: Text
    - attemptsLeft: Int
    - generatedAt: UTCTime
    - authExpiryMinutes: Int
    - derive: "'HideSecrets"
  DummyRideRequestRes:
    - result: Text
    - reason: Maybe Text
  DriverListItem:
    - driverId: Id Driver
    - firstName: Text
    - middleName: Maybe Text
    - lastName: Maybe Text
    - vehicleNo: Maybe Text
    - phoneNo: Maybe Text
    - mobileCountryCode: Maybe Text
    - enabled: Bool
    - blocked: Bool
    - subscribed: Bool
    - verified: Bool
    - onRide: Bool
    - active: Bool
    - onboardingDate: Maybe UTCTime
    - createdAt: UTCTime
    - updatedAt: UTCTime
    - approved: Maybe Bool
    - onboardingAs: Maybe OnboardingAs
    - recentFleetInfo: Maybe DriverAssociationInfo
    - hasActiveRc: Bool
    - disabledReasonFlag: Maybe DisabledReasonFlag
    - linkedVehicleInfo: [LinkedVehicleInfo]
  LinkedVehicleInfo:
    - rcId: Text
    - vehicleNumber: Maybe Text
    - vehicleMake: Maybe Text
    - vehicleModel: Maybe Text
    - vehicleColor: Maybe Text
    - vehicleClass: Maybe Text
    - verified: Maybe Bool
    - approved: Maybe Bool
    - isActive: Bool
    - associatedTill: Maybe UTCTime
  LicDetails:
    - licExpiry: UTCTime
    - vehicleClass: [Text]
  RCDetails:
    - vehicleRegistrationCertNumber: Text
    - vehicleClass: Text
    - fitnessExpiry: UTCTime
    - insuranceExpiry: Maybe UTCTime
    - failedRules: [Text]
    - verificationStatus: Maybe VerificationStatus
  DriverAadhaarInfoRes:
    - driverName: Text
    - driverGender: Text
    - driverDob: Text
    - driverImage: Maybe Text
  DriverAadhaarInfoByPhoneReq:
    - recordType: Type
    - type: DriverAadhaarInfoRes
  UpdateACUsageRestrictionReq:
    # - recordType: NewType
    - isWorking: Bool
    - derive: "'HideSecrets"
    - downgradeReason: Maybe Text
  BlockDriverWithReasonReq:
    - reasonCode: Text
    - blockReason: Maybe Text
    - blockTimeInHours: Maybe Int
  BlockReason:
    - reasonCode: Id BlockReason
    - blockReason: Maybe Text
    - blockTimeInHours: Maybe Int
  DriverLocationRes:
    - driverLocationsNotFound: Maybe (NonEmpty (Id Driver))
    - driverLocations: [DriverLocationItem]
  DriverLocationItem:
    - driverId: Id Driver
    - firstName: Text
    - middleName: Maybe Text
    - lastName: Maybe Text
    - vehicleNo: Text
    - phoneNo: Text
    - active: Bool
    - onRide: Bool
    - location: LatLong
    - lastLocationTimestamp: UTCTime
  DeleteRCReq:
    - recordType: NewType
    - rcNo: Text
    - derive: "'HideSecrets"
  DriverEncDataReq:
    - driverIdReq: Id Driver
    - driverDataReq: Text
    - derive: "'HideSecrets"
  DriverDecDataResp:
    - driverIdResp: Id Driver
    - driverDataResp: Maybe Text
    - derive: "'HideSecrets"
  UpdatePhoneNumberReq:
    - newPhoneNumber: Text
    - newCountryCode: Text
    - derive: "'HideSecrets"
  UpdateDriverDataReq:
    - driverName: Text
    - driverGender: Text
    - driverDob: Text
    - driverAadhaarNumber: Text
    - isVerified: Bool
  UpdateDriverNameReq:
    - firstName: Text
    - middleName: Maybe Text
    - lastName: Maybe Text
    - derive: "'HideSecrets"
  ClearOnRideStuckDriversRes:
    - recordType: NewType
    - driverIds: [Id Driver]
  ChangeOperatingCityReq:
    - recordType: NewType
    - operatingCity: City
    - derive: "'HideSecrets"
  GetOperatingCityResp:
    - recordType: NewType
    - operatingCity: City
    - derive: "'HideSecrets"
  PauseOrResumeServiceChargesReq:
    - serviceChargeEligibility: Bool
    - vehicleId: Maybe Text
    - serviceName: ServiceNames
    - reason: Maybe ReasonForDisablingServiceCharge
    - planId: Maybe Text
    - derive: "'HideSecrets"
  UpdateRCInvalidStatusReq:
    - rcId: Text
    - vehicleVariant: VehicleVariant
    - derive: "'HideSecrets"
  UpdateRCInvalidStatusByRCNumberReq:
    - rcNumber: Text
    - vehicleVariant: VehicleVariant
    - derive: "'HideSecrets"
  UpdateVehicleVariantReq:
    - rcId: Text
    - vehicleVariant: VehicleVariant
    - derive: "'HideSecrets"
  UpdateVehicleManufacturingReq:
    - rcId: Text
    - manufacturing: Day
    - derive: "'HideSecrets"
  AppendSelectedServiceTiersReq:
    - selected_service_tiers: [ServiceTierType]
    - derive: "'HideSecrets"
  ReviewRCVariantReq:
    - rcId: Text
    - vehicleVariant: Maybe VehicleVariant
    - markReviewed: Maybe Bool
  ReviewRCVariantRes:
    - rcId: Text
    - status: Text
  UpdateDriverTagReq:
    - driverTag: TagNameValue
    - isAddingTag: Bool
    - derive: "'HideSecrets"
  UpdateDriverSpecialLocWarriorReq:
    - isSpecialLocWarrior: Bool
    - preferredPrimarySpecialLocId: Maybe (Id SpecialLocation)
    - preferredSecondarySpecialLocIds: [Id SpecialLocation]
    - derive: "'HideSecrets"
  ClearDriverFeeReq:
    - serviceName: ServiceNames
    - feeType: DriverFeeType
    - platformFee: HighPrecMoney
    - sgstPercentage: Maybe HighPrecMoney
    - cgstPercentage: Maybe HighPrecMoney
    - currency: Maybe Currency
    - sendManualLink: Bool
  DriverFeeType:
    - enum: "PAYOUT_REGISTRATION, ONE_TIME_SECURITY_DEPOSIT"
    - derive: "Read, Kernel.Prelude.ToParamSchema"
  PanAadharSelfieDetailsResp:
    - personName: Text
    - personId: Text
    - selfieDetails: Maybe SelfieDetails
    - aadhaarDetails: Maybe AadhaarDetails
    - panDetails: Maybe PanDetails
  SelfieDetails:
    - latestStatus: Maybe Text
    - latestStatusTime: UTCTime
    - latestTransactionId: Maybe Text
  AadhaarDetails:
    - aadhaarStatus: Maybe Text
    - aadhaarStatusTime: UTCTime
    - aadhaarTransactionId: Maybe Text
  PanDetails:
    - panStatus: Maybe Text
    - panStatusTime: UTCTime
    - panTransactionId: Maybe Text
  SyncDocType:
    - enum: "Aadhaar, Pan"
  AadharPanSyncReq:
    - phoneNo: Text
    - countryCode: Text
    - documentType: SyncDocType
    - derive: "'HideSecrets"
  SecurityDepositDfStatusRes:
    - securityDepositStatus: DriverFeeStatus
    - securityDepositAmountWithCurrency: Maybe PriceAPIEntity
    - driverFeeId: Text
    - refundedAmount: Maybe HighPrecMoney
    - createdAt: UTCTime
  RefundByPayoutReq:
    - serviceName: ServiceNames
    - refundAmountDeduction: HighPrecMoney
    - payerVpa: Maybe Text
    - driverFeeType: DriverFeeType
    - refundAmountSegregation: Maybe Text
    - derive: "'HideSecrets"
  PanAadharSelfieDetailsListResp:
    - transactionId: Text
    - verificationStatus: Maybe Text
    - failureReason: Maybe Text
    - createdAt: UTCTime
    - updatedAt: UTCTime
