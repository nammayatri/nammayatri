    - sapMessage: Maybe Text
    - status: Text
    - merchantId: Text
    - merchantOperatingCityId: Text
    - createdAt: UTCTime
    - updatedAt: UTCTime

  # ----- SAP Journal Transactions (drill-down) -----
  SapJournalTransactionsRes:
    - total: Int
    - transactions: [SapJournalTransactionItem]
  SapJournalTransactionItem:
    - debitAmount: HighPrecMoney
    - creditAmount: HighPrecMoney
    - currency: Text
    - description: Text
    - referenceId: Maybe Text
    - referenceType: Maybe ReferenceType
    - creationDate: UTCTime
    - createdBy: Text

  # ----- TDS Reimbursement -----
  TdsReimbursementQuarter:
