  # ----- Wallet ledger (balance + ledger combined) -----
  # normal mode (no subscriptionId): Liability wallet account — all entries on that account;
  #   expiryEntries/creditEntries = Nothing.
  # subscription mode (subscriptionId set): prepaid RideCredit account — RideSubscriptionDebit entries (ride <-> ledger join);
  #   expiryEntries/creditEntries returned separately (not part of the join; mixing into one list would make limit/offset incorrect).
  WalletLedgerRes:
    - availableWalletBalance: Maybe HighPrecMoney
    - lockedWalletBalance: Maybe HighPrecMoney
    - lastWalletUpdatedAt: Maybe UTCTime
    - totalItems: Int
    - ledgerEntries: [WalletLedgerItem]
    - expiryEntries: Maybe [WalletLedgerItem] # subscription filter only — ExpiryCreditTransfer entries
    - creditEntries: Maybe [WalletLedgerItem] # subscription filter only — SubscriptionCredit entries
    - subscriptionId: Maybe (Id SubscriptionPurchase) # echo of request filter; Just only in subscription mode
  WalletLedgerItem:
    - walletTxnId: Maybe Text
    - walletTxnDate: Maybe UTCTime
    - sourceType: Maybe Text
    - sourceReferenceId: Maybe Text
    - creditAmount: Maybe HighPrecMoney
    - debitAmount: Maybe HighPrecMoney
    - openingBalance: Maybe HighPrecMoney
    - closingBalance: Maybe HighPrecMoney
    - subscriptionAllocations: Maybe [SubscriptionCreditAllocation]
    - reason: Maybe Text

  # ----- Earnings Summary -----
  EarningsSummaryRes:
    - totalRideEarnings: HighPrecMoney
    - totalIncentives: HighPrecMoney
    - totalPenalties: HighPrecMoney
    - grossEarnings: HighPrecMoney
    - totalTdsDeducted: HighPrecMoney
    - totalGstDeducted: HighPrecMoney
    - netEarnings: HighPrecMoney

  # ----- SAP Journal Entries -----
  SapJournalListRes:
