imports:
  Driver: Dashboard.Common
  Summary: Dashboard.Common
  ServiceNames: Dashboard.Common.Driver
  AuthReq: Dashboard.ProviderPlatform.Management.DriverRegistration
  AuthRes: Dashboard.ProviderPlatform.Management.DriverRegistration
  Value: Data.Aeson
  Day: Data.Time

module: System


apis:
  - POST:
      endpoint: /runQuery
      auth: ApiAuthV2
      request:
        type: QueryData
      response:
        type: APISuccess

types:
  QueryData:
    - queryType: QueryType
    - tableName: Text
    - setClause: Value
    - whereClause: Value
    - derive: "'HideSecrets"

  QueryType:
    - enum: "INSERT, UPDATE"