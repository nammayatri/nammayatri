imports:
  Driver: API.Types.ProviderPlatform.Fleet.Driver
  PlanListAPIRes: Domain.Action.UI.Plan
  Plan: Domain.Types.Plan
  PlanSubscribeRes: Domain.Action.UI.Plan
  CurrentPlanRes: Domain.Action.UI.Plan
  SubscriptionPurchaseListRes: Domain.Action.UI.Plan
  SubscriptionPurchaseStatus: Domain.Types.SubscriptionPurchase
  ServiceNames: Domain.Types.Plan
  Invoice: Domain.Types.Invoice
  PaymentStatusResp: Domain.Action.UI.Payment
  HistoryEntityV2: Domain.Action.UI.Driver
  CancellationChargeHistoryRes: Domain.Action.UI.Plan
  DriverFee: Domain.Types.DriverFee
  InvoicePaymentMode: Domain.Types.Invoice
  HistoryEntryDetailsEntityV2: Domain.Action.UI.Driver
  WaiveOffMode : Domain.Types.DriverPlan
  WaiveOffEntity : Domain.Types.DriverPlan


importPackageOverrides:
  Domain.Action.UI.Plan: "dynamic-offer-driver-app"
  Domain.Action.UI.Payment: "dynamic-offer-driver-app"
  Domain.Types.SubscriptionPurchase: "dynamic-offer-driver-app"
  Domain.Types.Invoice: "dynamic-offer-driver-app"

module: Subscription
apiPrefix: plan

apis:
  - GET: # ListPlan
      endpoint: /{driverId}/list
      name: GetSubscriptionListPlan
      auth: ApiAuthV2
      params:
        driverId: Id Driver
      response:
        type: PlanListAPIRes
      helperApi:
        - GET:
            endpoint: /{driverId}/list
            name: GetSubscriptionListPlan
            auth: ApiAuthV2
            params:
              driverId: Id Driver
            query:
              - requestorId: Text
            response:
              type: PlanListAPIRes
  - PUT: # SelectPlan
      endpoint: /{driverId}/{planId}/select
      name: PutSubscriptionSelectPlan
      auth: ApiAuthV2
      params:
        driverId: Id Driver
        planId: Id Plan
      response:
        type: APISuccess
      helperApi:
        - PUT:
            endpoint: /{driverId}/{planId}/select
            name: PutSubscriptionSelectPlan
            auth: ApiAuthV2
            params:
              driverId: Id Driver
              planId: Id Plan
            query:
              - requestorId: Text
            response:
              type: APISuccess
  - PUT: # SuspendPlan
      endpoint: /{driverId}/suspend
      name: PutSubscriptionSuspendPlan
      auth: ApiAuthV2
      params:
        driverId: Id Driver
      response:
        type: APISuccess
      helperApi:
        - PUT:
            endpoint: /{driverId}/suspend
            name: PutSubscriptionSuspendPlan
            auth: ApiAuthV2
            params:
              driverId: Id Driver
            query:
              - requestorId: Text
            response:
              type: APISuccess
  - POST: # SubscribePlan
      endpoint: /{driverId}/{planId}/subscribe
      name: PostSubscriptionSubscribePlan
      auth: ApiAuthV2
      params:
        driverId: Id Driver
        planId: Id Plan
      response:
        type: PlanSubscribeRes
      helperApi:
        - POST:
            endpoint: /{driverId}/{planId}/subscribe
            name: PostSubscriptionSubscribePlan
            auth: ApiAuthV2
            params:
              driverId: Id Driver
              planId: Id Plan
            query:
              - requestorId: Text
            response:
              type: PlanSubscribeRes
  - GET: # CurrentPlan
      endpoint: /{driverId}
      name: GetSubscriptionCurrentPlan
      auth: ApiAuthV2
      params:
        driverId: Id Driver
      response:
        type: CurrentPlanRes
      helperApi:
        - GET:
            endpoint: /{driverId}
            name: GetSubscriptionCurrentPlan
            auth: ApiAuthV2
            params:
              driverId: Id Driver
            query:
              - requestorId: Text
            response:
              type: CurrentPlanRes
  - GET: # ListPlanV2
      endpoint: /{driverId}/{serviceName}/v2/list
      name: GetSubscriptionListPlanV2
      auth: ApiAuthV2
      params:
        driverId: Id Driver
        serviceName: ServiceNames
      response:
        type: PlanListAPIRes
      helperApi:
        - GET:
            endpoint: /{driverId}/{serviceName}/v2/list
            name: GetSubscriptionListPlanV2
            auth: ApiAuthV2
            params:
              driverId: Id Driver
              serviceName: ServiceNames
            query:
              - requestorId: Text
            response:
              type: PlanListAPIRes
  - PUT: # SelectPlanV2
      endpoint: /{driverId}/{planId}/{serviceName}/v2/select
      name: PutSubscriptionSelectPlanV2
      auth: ApiAuthV2
      params:
        driverId: Id Driver
        planId: Id Plan
        serviceName: ServiceNames
      response:
        type: APISuccess
      helperApi:
        - PUT:
            endpoint: /{driverId}/{planId}/{serviceName}/v2/select
            name: PutSubscriptionSelectPlanV2
            auth: ApiAuthV2
            params:
              driverId: Id Driver
              planId: Id Plan
              serviceName: ServiceNames
            query:
              - requestorId: Text
            response:
              type: APISuccess
  - PUT: # SuspendPlanV2
      endpoint: /{driverId}/{serviceName}/v2/suspend
      name: PutSubscriptionSuspendPlanV2
      auth: ApiAuthV2
      params:
        driverId: Id Driver
        serviceName: ServiceNames
      response:
        type: APISuccess
      helperApi:
        - PUT:
            endpoint: /{driverId}/{serviceName}/v2/suspend
            name: PutSubscriptionSuspendPlanV2
            auth: ApiAuthV2
            params:
              driverId: Id Driver
              serviceName: ServiceNames
            query:
              - requestorId: Text
            response:
              type: APISuccess
  - POST: # SubscribePlanV2
      endpoint: /{driverId}/{planId}/{serviceName}/v2/subscribe
      name: PostSubscriptionSubscribePlanV2
      auth: ApiAuthV2
      params:
        driverId: Id Driver
        planId: Id Plan
        serviceName: ServiceNames
      request:
        type: PlanSubscribeReq
      response:
        type: PlanSubscribeRes
      helperApi:
        - POST:
            endpoint: /{driverId}/{planId}/{serviceName}/v2/subscribe
            name: PostSubscriptionSubscribePlanV2
            auth: ApiAuthV2
            params:
              driverId: Id Driver
              planId: Id Plan
              serviceName: ServiceNames
            query:
              - requestorId: Text
            request:
              type: PlanSubscribeReq
            response:
              type: PlanSubscribeRes
  - GET: # CurrentPlanV2
      endpoint: /{driverId}/{serviceName}
      name: GetSubscriptionCurrentPlanV2
      auth: ApiAuthV2
      params:
        driverId: Id Driver
        serviceName: ServiceNames
      response:
        type: CurrentPlanRes
      helperApi:
        - GET:
            endpoint: /{driverId}/{serviceName}
            name: GetSubscriptionCurrentPlanV2
            auth: ApiAuthV2
            params:
              driverId: Id Driver
              serviceName: ServiceNames
            query:
              - requestorId: Text
            response:
              type: CurrentPlanRes
  - GET: # OrderStatus = (PaymentStatus)
      endpoint: /{driverId}/{orderId}/status
      name: GetSubscriptionOrderStatus
      auth: ApiAuthV2
      params:
        driverId: Id Driver
        orderId: Id Invoice
      response:
        type: PaymentStatusResp
      helperApi:
        - GET:
            endpoint: /{driverId}/{orderId}/status
            name: GetSubscriptionOrderStatus
            auth: ApiAuthV2
            params:
              driverId: Id Driver
              orderId: Id Invoice
            query:
              - requestorId: Text
            response:
              type: PaymentStatusResp
  - GET: # DriverPaymentHistoryAPIV2
      endpoint: /{driverId}/payments/history/v2/{serviceName}
      name: GetSubscriptionDriverPaymentHistoryAPIV2
      auth: ApiAuthV2
      params:
        driverId: Id Driver
        serviceName: ServiceNames
      query:
        - paymentMode: InvoicePaymentMode
        - limit: Int
        - offset: Int
      response:
        type: HistoryEntityV2
      helperApi:
        - GET:
            endpoint: /{driverId}/payments/history/v2/{serviceName}
            name: GetSubscriptionDriverPaymentHistoryAPIV2
            auth: ApiAuthV2
            params:
              driverId: Id Driver
              serviceName: ServiceNames
            query:
              - paymentMode: InvoicePaymentMode
              - limit: Int
              - offset: Int
              - requestorId: Text
            response:
              type: HistoryEntityV2
  - GET: # DriverPaymentHistoryEntityDetailsAPIV2
      endpoint: /{driverId}/payments/history/v2/{serviceName}/{invoiceId}/entity
      name: GetSubscriptionDriverPaymentHistoryEntityDetailsV2
      auth: ApiAuthV2
      params:
        driverId: Id Driver
        serviceName: ServiceNames
        invoiceId: Id Invoice
      response:
        type: HistoryEntryDetailsEntityV2
      helperApi:
        - GET:
            endpoint: /{driverId}/payments/history/v2/{serviceName}/{invoiceId}/entity
            name: GetSubscriptionDriverPaymentHistoryEntityDetailsV2
            auth: ApiAuthV2
            params:
              driverId: Id Driver
              serviceName: ServiceNames
              invoiceId: Id Invoice
            query:
              - requestorId: Text
            response:
              type: HistoryEntryDetailsEntityV2
  - GET: # CancellationChargeHistory
      endpoint: /{driverId}/cancellationChargeHistory/{serviceName}
      name: GetSubscriptionCancellationChargeHistory
      auth: ApiAuthV2
      params:
        driverId: Id Driver
        serviceName: ServiceNames
      query:
        - limit: Int
        - offset: Int
      response:
        type: CancellationChargeHistoryRes
      helperApi:
        - GET:
            endpoint: /{driverId}/cancellationChargeHistory/{serviceName}
            name: GetSubscriptionCancellationChargeHistory
            auth: ApiAuthV2
            params:
              driverId: Id Driver
              serviceName: ServiceNames
            query:
              - limit: Int
              - offset: Int
              - requestorId: Text
            response:
              type: CancellationChargeHistoryRes
      migrate:
        capability: city-operations.subscription.read
  - POST: # CollectManualPayments
      endpoint: /{driverId}/{serviceName}/collect
      name: PostSubscriptionCollectManualPayments
      auth: ApiAuthV2
      params:
        driverId: Id Driver
        serviceName: ServiceNames
      request:
        type: CollectManualPaymentsReq
      response:
        type: APISuccess
      helperApi:
        - POST:
            endpoint: /{driverId}/{serviceName}/collect
            name: PostSubscriptionCollectManualPayments
            auth: ApiAuthV2
            params:
              driverId: Id Driver
              serviceName: ServiceNames
            query:
              - requestorId: Text
            request:
              type: CollectManualPaymentsReq
            response:
              type: APISuccess
  - POST:
      endpoint: /waiveOff/fee
      name: PostSubscriptionFeeWaiveOff
      auth: ApiAuthV2
      request:
        type: WaiveOffReq
      response:
        type: APISuccess
      helperApi:
        - POST:
            endpoint: /waiveOff/fee
            name: PostSubscriptionFeeWaiveOff
            auth: ApiAuthV2
            query:
              - requestorId: Text
            request:
              type: WaiveOffReq
            response:
              type: APISuccess
  - GET: # ListSubscriptionPurchases
      endpoint: /{driverId}/subscriptionPurchases
      name: GetSubscriptionPurchaseList
      auth: ApiAuthV2
      params:
        driverId: Id Driver
      query:
        - limit: Int
        - offset: Int
        - status: SubscriptionPurchaseStatus
      response:
        type: SubscriptionPurchaseListRes
      helperApi:
        - GET:
            endpoint: /{driverId}/subscriptionPurchases
            name: GetSubscriptionPurchaseList
            auth: ApiAuthV2
            params:
              driverId: Id Driver
            query:
              - limit: Int
              - offset: Int
              - status: SubscriptionPurchaseStatus
              - requestorId: Text
            response:
              type: SubscriptionPurchaseListRes

types:
  PlanSubscribeReq:
     - recordType: NewType
     - vehicleNumber: Maybe Text
     - derive: "'HideSecrets"
  CollectManualPaymentsReq:
     - paymentIds: Maybe [Id DriverFee]
     - derive: "'HideSecrets"
  WaiveOffReq :
      - recordType : NewType
      - waiveOffEntities : [WaiveOffEntity]
      - derive: "'HideSecrets"
