imports:
  User: Dashboard.Common
  ConfigPilotGetConfigRequest: Lib.Yudhishthira.Types
  ConfigPilotCreateRowRequest: Lib.Yudhishthira.Types
  CreateNammaTagRequest: Lib.Yudhishthira.Types
  UpdateNammaTagRequest: Lib.Yudhishthira.Types
  APISuccess: Kernel.Types.APISuccess
  ChakraQueriesAPIEntity: Lib.Yudhishthira.Types
  ChakraQueryUpdateReq: Lib.Yudhishthira.Types
  ChakraQueryDeleteReq: Lib.Yudhishthira.Types
  AppDynamicLogicReq: Lib.Yudhishthira.Types
  AppDynamicLogicResp: Lib.Yudhishthira.Types
  LogicDomain: Lib.Yudhishthira.Types
  AppDynamicLogic: Lib.Yudhishthira.Types.AppDynamicLogic
  RunKaalChakraJobReq: Lib.Yudhishthira.Types
  RunKaalChakraJobRes: Lib.Yudhishthira.Types
  GetLogicsResp: Lib.Yudhishthira.Types
  CreateTimeBoundRequest: Lib.Yudhishthira.Types
  LogicRolloutObject: Lib.Yudhishthira.Types
  LogicRolloutReq: Lib.Yudhishthira.Types
  UpdateRolloutGroupReq: Lib.Yudhishthira.Types
  RolloutGroupInfo: Lib.Yudhishthira.Types
  TimeBoundResp: Lib.Yudhishthira.Types
  Chakra: Lib.Yudhishthira.Types
  DomainSchemaResp: Lib.Yudhishthira.Types
  ChakraQueryResp: Lib.Yudhishthira.Types
  AppDynamicLogicDomainResp: Lib.Yudhishthira.Types
  AppDynamicLogicVersionResp: Lib.Yudhishthira.Types
  UpdateTagReq: Lib.Yudhishthira.Types
  CreateConfigRequest: Lib.Yudhishthira.Types
  UiConfigRequest: Lib.Yudhishthira.Types
  UiConfigResponse: Lib.Yudhishthira.Types
  ConfigType: Lib.Yudhishthira.Types
  ConfigDetailsResp: Lib.Yudhishthira.Types
  TableDataResp: Lib.Yudhishthira.Types
  ActionChangeRequest: Lib.Yudhishthira.Types
  AlwaysOnListResp: Lib.Yudhishthira.Types
  UiConfigGetVersionResponse: Lib.Yudhishthira.Types
  UiDevicePlatformReq: Lib.Yudhishthira.Types
  VerifyNammaTagRequest: Lib.Yudhishthira.Types
  VerifyNammaTagResponse: Lib.Yudhishthira.Types
  NammaTagV2: Lib.Yudhishthira.Types.NammaTagV2
  NammaTagDetailsResp: Lib.Yudhishthira.Types
  Value: Data.Aeson
  NammaTagEventsOrNammaTagNamesResp: Lib.Yudhishthira.Types


module: NammaTag

types: {}

apis:
  - POST:
      endpoint: /tag/create
      auth: ApiAuthV2
      request:
        type: CreateNammaTagRequest
      response:
        type: APISuccess
  - POST:
      endpoint: /tag/update
      auth: ApiAuthV2
      request:
        type: UpdateNammaTagRequest
      response:
        type: APISuccess
  - POST:
      endpoint: /tag/verify
      auth: ApiAuthV2
      request:
        type: VerifyNammaTagRequest
      response:
        type: VerifyNammaTagResponse
  - DELETE:
      endpoint: /tag/delete
      auth: ApiAuthV2
      mandatoryQuery:
        tagName: Text
      response:
        type: APISuccess
  - GET:
      endpoint: /tag/all
      auth: ApiAuthV2
      response:
        type: "[NammaTagDetailsResp]"
  - GET:
      endpoint: /tag/details
      auth: ApiAuthV2
      mandatoryQuery:
        tagName: Text
      response:
        type: NammaTagDetailsResp
  - POST:
      endpoint: /query/create
      auth: ApiAuthV2
      request:
        type: ChakraQueriesAPIEntity
      response:
        type: APISuccess
  - POST:
      endpoint: /query/update
      auth: ApiAuthV2
      request:
        type: ChakraQueryUpdateReq
      response:
        type: APISuccess
  - DELETE:
      endpoint: /query/delete
      auth: ApiAuthV2
      request:
        type: ChakraQueryDeleteReq
      response:
        type: APISuccess
  - GET:
      endpoint: /query/details
      auth: ApiAuthV2
      mandatoryQuery:
        chakra: Chakra
        queryName: Text
      response:
        type: ChakraQueriesAPIEntity
  - POST:
      endpoint: /appDynamicLogic/verify
      auth: ApiAuthV2
      request:
        type: AppDynamicLogicReq
      response:
        type: AppDynamicLogicResp
  - GET:
      endpoint: /appDynamicLogic
      auth: ApiAuthV2
      mandatoryQuery:
        domain: LogicDomain
      query:
        version: Int
      response:
        type: "[GetLogicsResp]"
  - POST:
      endpoint: /runJob
      auth: ApiAuthV2
      request:
        type: RunKaalChakraJobReq
      response:
        type: RunKaalChakraJobRes
  - GET:
      endpoint: /timeBounds
      auth: ApiAuthV2
      mandatoryQuery:
        domain: LogicDomain
      response:
        type: TimeBoundResp
  - POST:
      endpoint: /timeBounds/create
      auth: ApiAuthV2
      request:
        type: CreateTimeBoundRequest
      response:
        type: APISuccess
  - DELETE:
      endpoint: /timeBounds/delete
      auth: ApiAuthV2
      mandatoryQuery:
        domain: LogicDomain
        name: Text
      response:
        type: APISuccess
  - GET:
      endpoint: /appDynamicLogic/getLogicRollout
      auth: ApiAuthV2
      mandatoryQuery:
        domain: LogicDomain
      query:
        timeBound: Text
        activeOnly: Bool
      response:
        type: "[LogicRolloutObject]"
  - POST:
      endpoint: /appDynamicLogic/upsertLogicRollout
      auth: ApiAuthV2
      request:
        type: LogicRolloutReq
      response:
        type: APISuccess
  - POST:
      endpoint: /appDynamicLogic/updateExperimentGroup
      auth: ApiAuthV2
      request:
        type: UpdateRolloutGroupReq
      response:
        type: APISuccess
      migrate:
        capability: system-config.dynamic_logic.write
  - GET:
      endpoint: /appDynamicLogic/experimentGroups
      auth: ApiAuthV2
      query:
        domain: LogicDomain
      response:
        type: "[RolloutGroupInfo]"
      migrate:
        capability: system-config.dynamic_logic.read
  - GET:
      endpoint: /appDynamicLogic/versions
      auth: ApiAuthV2
      mandatoryQuery:
        domain: LogicDomain
      query:
        limit: Int
        offset: Int
      response:
        type: AppDynamicLogicVersionResp
  - GET:
      endpoint: /appDynamicLogic/domains
      auth: ApiAuthV2
      response:
        type: AppDynamicLogicDomainResp
  - GET:
      endpoint: /appDynamicLogic/domainsAndEvents
      auth: ApiAuthV2
      query:
        fetchNammaTagNames: Bool
      response:
        type: NammaTagEventsOrNammaTagNamesResp
  - GET:
      endpoint: /appDynamicLogic/getDomainSchema
      auth: ApiAuthV2
      mandatoryQuery:
        domain: LogicDomain
      response:
        type: DomainSchemaResp
  - GET:
      endpoint: /query/all
      auth: ApiAuthV2
      mandatoryQuery:
        chakra: Chakra
      response:
        type: ChakraQueryResp
  - POST:
      endpoint: /{customerId}/updateCustomerTag
      auth: ApiAuthV2
      params:
        customerId: Id User
      request:
        type: UpdateTagReq
      response:
        type: APISuccess
  - POST:
      endpoint: /configPilot/getVersion
      auth: ApiAuthV2
      request:
        type: UiConfigRequest
      response:
        type: UiConfigGetVersionResponse
  - POST:
      endpoint: /configPilot/getConfig
      auth: ApiAuthV2
      request:
        type: UiConfigRequest
      response:
        type: UiConfigResponse
  - POST:
      endpoint: /configPilot/createUiConfig
      auth: ApiAuthV2
      request:
        type: CreateConfigRequest
      response:
        type: APISuccess
  - GET:
      endpoint: /configPilot/allConfigs/
      auth: ApiAuthV2
      query:
        underExperiment: Bool
      response:
        type: "[ConfigType]"
  - GET:
      endpoint: /configPilot/configDetails
      auth: ApiAuthV2
      mandatoryQuery:
        tableName: ConfigType
      response:
        type: "[ConfigDetailsResp]"
  - GET:
      endpoint: /configPilot/getTableData
      auth: ApiAuthV2
      mandatoryQuery:
        tableName: ConfigType
      response:
        type: TableDataResp
  - GET:
      endpoint: /configPilot/allUiConfigs
      auth: ApiAuthV2
      query:
        underExperiment: Bool
      response:
        type: "[LogicDomain]"
  - GET:
      endpoint: /configPilot/uiConfigDetails
      auth: ApiAuthV2
      request:
        type: UiDevicePlatformReq
      response:
        type: "[ConfigDetailsResp]"
  - GET:
      endpoint: /configPilot/getUiTableData
      auth: ApiAuthV2
      request:
        type: UiDevicePlatformReq
      response:
        type: TableDataResp
  - GET:
      endpoint: /configPilot/alwaysOnList
      auth: ApiAuthV2
      mandatoryQuery:
        domain: LogicDomain
      response:
        type: AlwaysOnListResp
  - POST:
      endpoint: /configPilot/actionChange
      auth: ApiAuthV2
      request:
        type: ActionChangeRequest
      response:
        type: APISuccess
  - POST:
      endpoint: /configPilot/getConfigWithDimensions
      auth: ApiAuthV2
      request:
        type: ConfigPilotGetConfigRequest
      response:
        type: TableDataResp
  - GET:
      endpoint: /configPilot/getDimensionSchema
      auth: ApiAuthV2
      mandatoryQuery:
        configType: ConfigType
      response:
        type: DomainSchemaResp
  - POST:
      endpoint: /configPilot/createRow
      auth: ApiAuthV2
      request:
        type: ConfigPilotCreateRowRequest
      response:
        type: APISuccess
