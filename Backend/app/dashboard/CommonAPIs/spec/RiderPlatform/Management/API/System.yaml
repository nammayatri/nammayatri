imports:
  Value: Data.Aeson

module: System

apis:
  - POST:
      endpoint: /runQuery
      auth: ApiAuthV2
      request:
        type: QueryData
      response:
        type: APISuccess

types:
  QueryData:
    - queryType: QueryType
    - tableName: Text
    - setClause: Value
    - whereClause: Value
    - derive: "'HideSecrets"

  QueryType:
    - enum: "INSERT, UPDATE"