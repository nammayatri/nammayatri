imports:
  UTCTime: Kernel.Prelude
  Day: Data.Time
  ShortId: Kernel.Types.Id
  HighPrecMoney: Kernel.Types.Common
  Currency: Kernel.Types.Common
  Price: Kernel.Types.Common
  PayoutOrderStatus : Kernel.External.Payout.Juspay.Types.Payout
  AccountDetailsType : Kernel.External.Payout.Juspay.Types.Payout
  TransferStatus: Kernel.External.Payout.Interface.Types
  SettlementRefType: Kernel.External.Payout.Interface.Types
  EntityName : Lib.Payment.Domain.Types.Common
  EncryptedHashedField: Kernel.External.Encryption
  DbHash: Kernel.External.Encryption

PayoutOrder:
  tableName: payout_order
  derives: "Generic"
  fields:
    id : Id PayoutOrder
    shortId : Maybe (ShortId PayoutOrder)
    customerId : Text
    orderId : Text
    merchantId : Text
    merchantOperatingCityId : Maybe Text
    city : Text
    amount : Price
    idAssignedByServiceProvider : Maybe Text
    status : PayoutOrderStatus
    transferId : Maybe Text
    transferAmount : Maybe HighPrecMoney
    transferStatus : Maybe TransferStatus
    accountDetailsType : Maybe AccountDetailsType
    entityName : Maybe EntityName
    vpa : Maybe Text
    mobileNo : (EncryptedHashedField e Text)
    customerEmail : (EncryptedHashedField e Text)
    lastStatusCheckedAt : Maybe UTCTime
    createdAt : UTCTime
    updatedAt : UTCTime
    entityIds : Maybe [Text]
    responseCode : Maybe Text
    responseMessage : Maybe Text
    retriedOrderId : Maybe Text
    pgBaseFee : Maybe HighPrecMoney
    pgGst : Maybe HighPrecMoney
    merchantTopUpAmount : Maybe HighPrecMoney
    batchId : Maybe (Id PayoutBatch)
    failureCategory : Maybe Text
    settlementRef : Maybe Text
    settlementRefType : Maybe SettlementRefType
  beamFields:
    amount:
      currency: Maybe Currency
      price: HighPrecMoney
  fromTType:
    amount: Kernel.Types.Common.mkPrice currency price|E
  toTType:
    price: (.amount)|I
    currency: (Kernel.Prelude.Just . (.currency))|I
  sqlType:
    id: character varying(36)
    mobileNoEncrypted: character varying(255)
    customerEmailEncrypted: character varying(255)
    mobileNoHash: bytea
    customerEmailHash: bytea
    createdAt: timestamp with time zone
    updatedAt: timestamp with time zone
  constraints:
    id: SecondaryKey
    orderId: PrimaryKey
    customerId: "!SecondaryKey"
    entityIds: "!SecondaryKey"
    batchId: "!SecondaryKey"
  queries:
    findById:
      kvFunction: findOneWithKV
      where: id
    findByOrderId:
      kvFunction: findOneWithKV
      where: orderId
    findAllByBatchId:
      kvFunction: findAllWithKV
      where: batchId
    updatePayoutOrderStatus:
      kvFunction: updateOneWithKV
      params: [status]
      where: orderId
    updatePayoutOrderStatusAndTransferStatus:
      kvFunction: updateOneWithKV
      params: [status, transferStatus]
      where: orderId
    updatePayoutOrderTxnRespInfo:
      kvFunction: updateOneWithKV
      params: [responseCode, responseMessage]
      where: orderId
    updateRetriedOrderId:
      kvFunction: updateOneWithKV
      params: [retriedOrderId]
      where: orderId
    updateBatchId:
      kvFunction: updateOneWithKV
      params: [batchId]
      where: orderId
    updateFailureCategory:
      kvFunction: updateOneWithKV
      params: [failureCategory]
      where: orderId
    updateSettlementRef:
      kvFunction: updateOneWithKV
      params: [settlementRef, settlementRefType]
      where: orderId

  extraOperations:
  - EXTRA_QUERY_FILE
  defaultQueryTypeConstraint: "(Lib.Payment.Storage.Beam.BeamFlow.BeamFlow m r)"
  beamInstance: MakeTableInstancesGenericSchema

PayoutTransaction:
  tableName: payout_transaction
  derives: "Generic"
  fields:
    id : Id PayoutTransaction
    payoutOrderId : Id PayoutOrder
    transactionRef : Text
    gateWayRefId : Maybe Text
    fulfillmentMethod : Maybe Text
    amount : Price
    status : Text
    merchantId: Text
    merchantOperatingCityId : Maybe Text
    beneficiaryName : Maybe Text
    beneficiaryAccount : Maybe Text
    beneficiaryIfsc : Maybe Text
    createdAt : UTCTime
    updatedAt : UTCTime
  sqlType:
    id: character varying(36)
    createdAt: timestamp with time zone
    updatedAt: timestamp with time zone
  constraints:
    id: PrimaryKey
    transactionRef: SecondaryKey
  beamFields:
    amount:
      currency: Maybe Currency
      price: HighPrecMoney
  fromTType:
    amount: Kernel.Types.Common.mkPrice currency price|E
  toTType:
    price: (.amount)|I
    currency: (Kernel.Prelude.Just . (.currency))|I
  queries:
    findById:
      kvFunction: findOneWithKV
      where: id
    findByTransactionRef:
      kvFunction: findOneWithKV
      where: transactionRef
    updatePayoutTransactionStatus:
      kvFunction: updateWithKV
      params: [status]
      where: transactionRef
  defaultQueryTypeConstraint: "(Lib.Payment.Storage.Beam.BeamFlow.BeamFlow m r)"
  beamInstance: MakeTableInstancesGenericSchema

PayoutRequest:
  tableName: payout_request
  derives: "Generic"

  types:
    PayoutRequestStatus:
      enum: "INITIATED,PROCESSING,CREDITED,AUTO_PAY_FAILED,RETRYING,FAILED,CANCELLED,CASH_PAID,CASH_PENDING"
      derive: "HttpInstance"

    PayoutType:
      enum: "INSTANT,SCHEDULED,ADHOC"
      derive: "HttpInstance"
  fields:
    id: Id PayoutRequest
    entityName: Maybe EntityName
    entityId: Text
    entityRefId: Maybe Text
    beneficiaryId: Text
    amount: Maybe HighPrecMoney
    status: PayoutRequestStatus
    retryCount: Maybe Int
    failureReason: Maybe Text
    payoutTransactionId: Maybe Text
    expectedCreditTime: Maybe UTCTime
    scheduledAt: Maybe UTCTime
    cashMarkedById: Maybe Text
    cashMarkedByName: Maybe Text
    cashMarkedAt: Maybe UTCTime
    merchantId: Text
    merchantOperatingCityId: Text
    customerVpa: Maybe Text
    customerPhone: Maybe Text
    customerEmail: Maybe Text
    customerName: Maybe Text
    remark: Maybe Text
    orderType: Maybe Text
    city: Maybe Text
    payoutFee: Maybe HighPrecMoney
    payoutType: Maybe PayoutType
    coverageFrom: Maybe UTCTime
    coverageTo: Maybe UTCTime
    ledgerEntryIds: Maybe [Text]
    settlementRef: Maybe Text
    settlementRefType: Maybe SettlementRefType
    createdAt: UTCTime
    updatedAt: UTCTime
  domainInstance:
    - Custom Kernel.Utils.TH.mkHttpInstancesForListOfEnums <PayoutRequestStatus>
    - Custom Kernel.Utils.TH.mkHttpInstancesForListOfEnums <PayoutType>
  sqlType:
    id: character varying(36)
    createdAt: timestamp with time zone
    updatedAt: timestamp with time zone
  constraints:
    id: PrimaryKey
  queries:
    findById:
      kvFunction: findOneWithKV
      where: id
    findByEntity:
      kvFunction: findOneWithKV
      where:
        and: [entityId, entityName]
    findManyByEntityIds:
      kvFunction: findAllWithKV
      where:
        and:
          - in: [entityId]
    updateStatusById:
      kvFunction: updateOneWithKV
      params: [status]
      where: id
    updateStatusWithReasonById:
      kvFunction: updateOneWithKV
      params: [status, failureReason]
      where: id
    updateRetryCountById:
      kvFunction: updateOneWithKV
      params: [retryCount]
      where: id
    updatePayoutTransactionIdById:
      kvFunction: updateOneWithKV
      params: [payoutTransactionId]
      where: id
    updateCashDetailsById:
      kvFunction: updateOneWithKV
      params: [cashMarkedById, cashMarkedByName, cashMarkedAt]
      where: id
    updateSettlementRef:
      kvFunction: updateOneWithKV
      params: [settlementRef, settlementRefType]
      where: id
  defaultQueryTypeConstraint: "(Lib.Payment.Storage.Beam.BeamFlow.BeamFlow m r)"
  beamInstance: MakeTableInstancesGenericSchema

PayoutBatch:
  tableName: payout_batch
  derives: "Generic"

  types:
    PayoutBatchOrigin:
      enum: "SCHEDULED,ADHOC,INSTANT"
      derive: "HttpInstance"
    PayoutBatchStatus:
      enum: "OPEN,SEALED,SUBMITTED,SUBMIT_UNKNOWN,AWAITING_PARTNER_APPROVAL,PARTIALLY_RESOLVED,COMPLETED,REJECTED,AWAITING_BANK"
      derive: "HttpInstance"

  fields:
    id: Id PayoutBatch
    merchantId: Text
    merchantOperatingCityId: Maybe Text
    runId: Maybe Text
    origin: PayoutBatchOrigin
    status: PayoutBatchStatus
    payoutRail: Text
    valueDate: Day
    clientRefNo: Text
    partnerBatchRef: Maybe Text
    itemCount: Int
    totalAmount: HighPrecMoney
    processedCount: Int
    rejectedCount: Int
    pendingCount: Int
    inquiryAttemptsToday: Int
    inquiryQuotaDate: Maybe Day
    nextInquiryAt: Maybe UTCTime
    retryOfBatchId: Maybe (Id PayoutBatch)
    partnerResponseCode: Maybe Text
    failureReason: Maybe Text
    submittedAt: Maybe UTCTime
    resolvedAt: Maybe UTCTime
    createdAt: UTCTime
    updatedAt: UTCTime

  default:
    itemCount: "0"
    totalAmount: "0"
    processedCount: "0"
    rejectedCount: "0"
    pendingCount: "0"
    inquiryAttemptsToday: "0"

  sqlType:
    id: character varying(36)
    createdAt: timestamp with time zone
    updatedAt: timestamp with time zone

  constraints:
    id: PrimaryKey
    runId: "!SecondaryKey"
    clientRefNo: "!SecondaryKey"

  queries:
    findByClientRefNo:
      kvFunction: findOneWithKV
      where: clientRefNo
    findAllByRunId:
      kvFunction: findAllWithKV
      where: runId
    updateStatus:
      kvFunction: updateOneWithKV
      params: [status]
      where: id
    markSubmitted:
      kvFunction: updateOneWithKV
      params: [status, partnerBatchRef, submittedAt]
      where: id
    updateInquiryState:
      kvFunction: updateOneWithKV
      params: [inquiryAttemptsToday, inquiryQuotaDate, nextInquiryAt]
      where: id
    updateResolutionCounts:
      kvFunction: updateOneWithKV
      params: [status, processedCount, rejectedCount, pendingCount, resolvedAt]
      where: id
    updateFailure:
      kvFunction: updateOneWithKV
      params: [status, partnerResponseCode, failureReason]
      where: id

  extraOperations:
  - EXTRA_QUERY_FILE
  defaultQueryTypeConstraint: "(Lib.Payment.Storage.Beam.BeamFlow.BeamFlow m r)"
  beamInstance: MakeTableInstancesGenericSchema

PayoutBatchExclusion:
  tableName: payout_batch_exclusion
  derives: "Generic"

  types:
    PayoutBatchExclusionBeneficiaryType:
      enum: "DRIVER,FLEET_OWNER"
      derive: "HttpInstance"
    PayoutBatchExclusionReason:
      enum: "BELOW_MINIMUM,ZERO_BALANCE,PAYOUT_IN_FLIGHT,SETTLEMENT_PENDING,BANK_DETAILS_MISSING,BANK_DETAILS_UNVERIFIED,BANK_DETAILS_INVALID,ACCOUNT_BLOCKED,NOT_REGISTERED_WITH_PARTNER"
      derive: "HttpInstance"

  fields:
    id: Id PayoutBatchExclusion
    merchantId: Text
    runId: Text
    beneficiaryId: Text
    beneficiaryType: PayoutBatchExclusionBeneficiaryType
    reason: PayoutBatchExclusionReason
    balanceAtEvaluation: Maybe HighPrecMoney
    notifiedAt: Maybe UTCTime
    correctedAt: Maybe UTCTime
    createdAt: UTCTime
    updatedAt: UTCTime

  sqlType:
    id: character varying(36)
    createdAt: timestamp with time zone

  constraints:
    id: PrimaryKey
    runId: "!SecondaryKey"
    beneficiaryId: "!SecondaryKey"

  queries:
    findAllByRunId:
      kvFunction: findAllWithKV
      where: runId
    findAllByBeneficiaryId:
      kvFunction: findAllWithKV
      where: beneficiaryId
    markCorrected:
      kvFunction: updateOneWithKV
      params: [correctedAt]
      where: id

  defaultQueryTypeConstraint: "(Lib.Payment.Storage.Beam.BeamFlow.BeamFlow m r)"
  beamInstance: MakeTableInstancesGenericSchema
