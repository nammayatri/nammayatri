# Finance Kernel - Journal Entry Transaction Table
# Stores individual transaction-level data before SAP aggregation
# Queried by time range for SAP transactional reports

imports:
  UTCTime: Kernel.Prelude
  HighPrecMoney: Kernel.Types.Common
  Currency: Kernel.Types.Common
  TransactionType: Lib.Finance.Domain.Types.SapJournalEntry
  SapJournalEntry: Lib.Finance.Domain.Types.SapJournalEntry
  ActorType: Lib.Finance.Core.Types

JournalEntryTransaction:
  tableName: journal_entry_transaction
  derives: "Generic"

  types:
    ReferenceType:
      enum: "SubscriptionPurchase, Booking, Payout, TdsReimbursementRequest"
      derive: "HttpInstance"

  fields:
    id: Id JournalEntryTransaction
    debitAmount: HighPrecMoney
    creditAmount: HighPrecMoney
    currency: Currency
    description: Text
    referenceId: Maybe Text
    referenceType: Maybe ReferenceType
    sapJournalEntryId: Id SapJournalEntry
    sapBatchId: Text
    transactionType: TransactionType
    status: Text
    merchantId: Text
    merchantOperatingCityId: Text
    createdAt: UTCTime
    updatedAt: UTCTime
    createdBy: ActorType                           # Who created this record
    createdById: Maybe Text                        # requestId for UNKNOWN/SYSTEM, jobId for JOB, personId for PERSON/DASHBOARD_PERSON
    updatedBy: ActorType                           # Who updated this record
    updatedById: Maybe Text                        # requestId for UNKNOWN/SYSTEM, jobId for JOB, personId for PERSON/DASHBOARD_PERSON

  constraints:
    id: PrimaryKey

  queries:
    findById:
      kvFunction: findOneWithKV
      where: id

  extraOperations:
    - EXTRA_QUERY_FILE

  default:
    debitAmount: "0"
    creditAmount: "0"

  defaultQueryTypeConstraint: "(Lib.Finance.Storage.Beam.BeamFlow.BeamFlow m r)"
  beamInstance: MakeTableInstancesGenericSchema
