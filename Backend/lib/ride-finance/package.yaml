name: ride-finance
version: 0.1.0.0
github: "nammayatri/nammayatri"
license: AllRightsReserved
author: "nammayatri"
maintainer: "nammayatri"
copyright: "2024 Juspay Technologies Private Limited"

flags:
  Local:
    description: Enable this flag for faster compile times
    manual: true
    default: false

description: Ride Finance - pure shared model for ride fare components, tax pairs, totals and presentation

default-extensions:
  - ConstraintKinds
  - DataKinds
  - DefaultSignatures
  - DeriveAnyClass
  - DeriveFunctor
  - DeriveGeneric
  - DerivingStrategies
  - DuplicateRecordFields
  - ExplicitNamespaces
  - FlexibleContexts
  - FlexibleInstances
  - FunctionalDependencies
  - GADTs
  - LambdaCase
  - MultiParamTypeClasses
  - MultiWayIf
  - NamedFieldPuns
  - NoImplicitPrelude
  - OverloadedStrings
  - PatternSynonyms
  - PolyKinds
  - RankNTypes
  - RecordWildCards
  - ScopedTypeVariables
  - TupleSections
  - TypeApplications
  - TypeFamilies
  - TypeOperators
  - ViewPatterns
  - BlockArguments
  - TypeSynonymInstances
  - UndecidableInstances

dependencies:
  - base >= 4.7 && < 5
  - aeson
  - containers
  - mobility-core
  - openapi3
  - record-dot-preprocessor
  - record-hasfield
  - text

ghc-options:
  - -fwrite-ide-info
  - -hiedir=.hie
  - -Wall
  - -Wcompat
  - -Widentities
  - -fhide-source-paths
  - -Werror
  - -fplugin=RecordDotPreprocessor

library:
  source-dirs:
    - src
  when:
    - condition: flag(Local)
      then:
        ghc-options:
          - -Wno-ambiguous-fields
          - -O0
      else:
        ghc-options:
          - -Wno-ambiguous-fields
          - -O2

tests:
  ride-finance-test:
    main: Main.hs
    source-dirs:
      - test
    dependencies:
      - ride-finance
      - hspec
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
