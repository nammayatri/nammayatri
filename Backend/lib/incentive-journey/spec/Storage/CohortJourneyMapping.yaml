imports:
  CohortDetails: Lib.IncentiveJourney.Domain.Types.CohortDetails
  IncentiveJourney: Lib.IncentiveJourney.Domain.Types.IncentiveJourney
  Merchant: Lib.IncentiveJourney.Domain.Types.Common
  MerchantOperatingCity: Lib.IncentiveJourney.Domain.Types.Common
  MilestoneRewardType: Lib.IncentiveJourney.Domain.Types.Common
  Value: Data.Aeson

CohortJourneyMapping:
  tableName: cohort_journey_mapping

  types:
    CampaignUserLinkType:
      enum: "Assigned, OptIn"
      derive': "Generic, Show, Read, Eq, Ord, ToJSON, FromJSON, ToSchema, ToParamSchema"

  domainInstance:
    - Custom Kernel.Beam.Lib.UtilsTH.mkBeamInstancesForEnumAndList <CampaignUserLinkType>
    - Custom Kernel.Utils.TH.mkHttpInstancesForEnum <CampaignUserLinkType>

  fields:
    id: Id CohortJourneyMapping
    merchantId: Id Merchant
    merchantOperatingCityId: Id MerchantOperatingCity
    cohortId: Id CohortDetails
    journeyId: Id IncentiveJourney
    startDate: UTCTime
    streakRange: Int
    enabled: Bool
    # Previous campaign row when this mapping is a roll; null for the first run.
    parentId: Maybe (Id CohortJourneyMapping)
    maxWaiveOffCount: Maybe Int
    streakEndRewardType: Maybe MilestoneRewardType
    streakEndRewardValue: Maybe Int
    streakEndRewardExpirationAt: Maybe Int
    # Extra fields per reward type (SWO: serviceName, waiveOffMode).
    # NetOff streak: includeEarningsAllDay, mgAmountSlabs, percentSlabs, periodDays.
    # Percentage / daysValidFor reuse streakEndRewardValue / streakEndRewardExpirationAt.
    streakEndRewardMetadata: Maybe Value
    # Assigned = legacy bulk/auto-apply (no opt-in). OptIn = driver must opt in once per period.
    # Maybe for generator backwards-compat; treat Nothing as Assigned.
    campaignUserLinkType: Maybe CampaignUserLinkType
    # Campaign control features (generic). Array of:
    # { "feature": "AutoAssign"|"PoolingPriority"|"AcceptancePriority"|"CanDxToggleAA"|"CanDxCancelBooking",
    #   "config": { ... }, "enableIn": "TimeBound"|"AllDay" }
    controlFeatures: Maybe Value
    createdAt: UTCTime
    updatedAt: UTCTime

  default:
    enabled: "true"
    parentId: "NULL"
    maxWaiveOffCount: "1"
    streakEndRewardType: "NULL"
    streakEndRewardValue: "NULL"
    streakEndRewardExpirationAt: "NULL"
    streakEndRewardMetadata: "NULL"
    campaignUserLinkType: "NULL"
    controlFeatures: "NULL"

  sqlType:
    streakEndRewardMetadata: json
    controlFeatures: json

  constraints:
    id: PrimaryKey
    cohortId: "!SecondaryKey"
    journeyId: "!SecondaryKey"

  queries:
    findById:
      kvFunction: findOneWithKV
      where: id
    findByCohortId:
      kvFunction: findAllWithKV
      where: cohortId
    findByJourneyId:
      kvFunction: findAllWithKV
      where: journeyId

  extraIndexes:
    - columns: [merchantId]
    - columns: [merchantOperatingCityId]
    - columns: [cohortId]
    - columns: [journeyId]
    - columns: [parentId]
    # Rolling campaigns: same city+cohort+journey may repeat with a new startDate.
    - columns: [merchantOperatingCityId, cohortId, journeyId, startDate]
      unique: true

  extraOperations:
    - EXTRA_QUERY_FILE
    - GENERATE_INDEXES

  beamInstance: MakeTableInstancesGenericSchema
  defaultQueryTypeConstraint: "(Lib.IncentiveJourney.Storage.Beam.BeamFlow.BeamFlow m r)"
