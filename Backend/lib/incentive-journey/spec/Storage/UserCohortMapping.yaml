imports:
  Person: Lib.IncentiveJourney.Domain.Types.Common
  CohortJourneyMapping: Lib.IncentiveJourney.Domain.Types.CohortJourneyMapping

UserCohortMapping:
  tableName: user_cohort_mapping

  types:
    OptInPeriod:
      enum: "Daily, Weekly"
      derive': "Generic, Show, Read, Eq, Ord, ToJSON, FromJSON, ToSchema, ToParamSchema"

  domainInstance:
    - Custom Kernel.Beam.Lib.UtilsTH.mkBeamInstancesForEnumAndList <OptInPeriod>
    - Custom Kernel.Utils.TH.mkHttpInstancesForEnum <OptInPeriod>

  fields:
    id: Id UserCohortMapping
    userId: Id Person
    cohortMappingId: Id CohortJourneyMapping
    enabled: Bool
    validTill: UTCTime
    # Null for Assigned cohorts. Set when OptIn invite is created.
    optInPeriod: Maybe OptInPeriod
    # Null = invited / eligible but not active for eval. Just = opted in for this period.
    optedInAt: Maybe UTCTime
    optedInBy: Maybe Text
    termsAcceptedAt: Maybe UTCTime
    createdAt: UTCTime
    updatedAt: UTCTime

  default:
    optInPeriod: "NULL"
    optedInAt: "NULL"
    optedInBy: "NULL"
    termsAcceptedAt: "NULL"

  constraints:
    id: PrimaryKey
    userId: "!SecondaryKey"
    cohortMappingId: "!SecondaryKey"

  queries:
    findById:
      kvFunction: findOneWithKV
      where: id
    findByUserId:
      kvFunction: findAllWithKV
      where: userId
    findByUserIdAndCohortMappingId:
      kvFunction: findOneWithKV
      where:
        and: [userId, cohortMappingId]

  extraIndexes:
    - columns: [userId]
    - columns: [cohortMappingId]
    - columns: [userId, cohortMappingId]
      unique: true

  extraOperations:
    - EXTRA_QUERY_FILE
    - GENERATE_INDEXES

  excludedFields: [merchantId, merchantOperatingCityId]

  beamInstance: MakeTableInstancesGenericSchema
  defaultQueryTypeConstraint: "(Lib.IncentiveJourney.Storage.Beam.BeamFlow.BeamFlow m r)"
