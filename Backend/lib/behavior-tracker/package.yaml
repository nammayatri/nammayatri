# hpack defaults
# Ref: https://github.com/sol/hpack#defaults

# Workaround for segfault on macOS
# https://github.com/NixOS/nixpkgs/issues/149692#issuecomment-1587564664
# hpack defaults
# Ref: https://github.com/sol/hpack#defaults

# Workaround for segfault on macOS
# https://github.com/NixOS/nixpkgs/issues/149692#issuecomment-1587564664
name: behavior-tracker
version: 0.1.0.0
github: "nammayatri/nammayatri"
license: AllRightsReserved
author: "nammayatri"
maintainer: "nammayatri"
copyright: "2026 Moving Innovation Technologies Private Limited"

flags:
  Local:
    description: Enable this flag for faster compile times
    manual: true
    default: false

description: "Behavior tracking library — city bt: SWC counters/snapshots plus campaign-scoped ij:bm: counters (Incentive Journey)"

default-extensions:
  - ConstraintKinds
  - DataKinds
  - DefaultSignatures
  - DeriveAnyClass
  - DeriveFunctor
  - DeriveGeneric
  - DuplicateRecordFields
  - ExplicitNamespaces
  - FlexibleContexts
  - FlexibleInstances
  - FunctionalDependencies
  - GADTs
  - LambdaCase
  - MultiParamTypeClasses
  - MultiWayIf
  - NamedFieldPuns
  - NoImplicitPrelude
  - OverloadedStrings
  - PackageImports
  - PatternSynonyms
  - PolyKinds
  - RankNTypes
  - RecordWildCards
  - ScopedTypeVariables
  - TupleSections
  - TypeApplications
  - TypeFamilies
  - TypeOperators
  - ViewPatterns
  - BlockArguments
  - TypeSynonymInstances
  - UndecidableInstances
  - OverloadedRecordDot

dependencies:
  - base >= 4.7 && < 5
  - text
  - time
  - aeson
  - containers
  - euler-hs

ghc-options:
  - -fwrite-ide-info
  - -hiedir=.hie

library:
  source-dirs:
    - src
  ghc-options:
    - -Wall
    - -Wcompat
    - -Widentities
    - -fhide-source-paths
    - -Werror
  when:
    - condition: flag(Local)
      then:
        ghc-options:
          - -Wno-incomplete-uni-patterns
          - -Wno-incomplete-record-updates
          - -O0
          - -funfolding-use-threshold20
          - -fno-cse
          - -fmax-simplifier-iterations1
          - -fno-specialise-aggressively
          - -j4
      else:
        ghc-options:
          - -Wno-incomplete-uni-patterns
          - -Wno-incomplete-record-updates
          - -O2
          - -j4
  dependencies:
    - mobility-core
    - openapi3
    - data-default-class
    - hedis
